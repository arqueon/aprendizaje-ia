<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#101a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#7b93c5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7b93c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1628" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0e1628" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#7b93c5" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- panel declarado: todo visible -->
  <g fill="#34508c" fill-opacity="0.3" stroke="#5c7ab4" stroke-opacity="0.6" stroke-width="2.5">
    <rect x="190" y="170" width="290" height="300" rx="10"/>
  </g>
  <g stroke="#9db2d8" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
    <line x1="225" y1="225" x2="445" y2="225"/><line x1="225" y1="260" x2="430" y2="260"/>
    <line x1="225" y1="295" x2="445" y2="295"/><line x1="225" y1="330" x2="415" y2="330"/>
  </g>
  <rect x="220" y="390" width="230" height="28" rx="6" fill="#7b93c5" fill-opacity="0.55"/>
  <!-- panel opaco: casi nada visible -->
  <g fill="#1a2540" fill-opacity="0.85" stroke="#5c7ab4" stroke-opacity="0.35" stroke-width="2.5">
    <rect x="720" y="170" width="290" height="300" rx="10"/>
  </g>
  <g stroke="#9db2d8" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round">
    <line x1="755" y1="225" x2="975" y2="225"/>
  </g>
  <rect x="750" y="390" width="230" height="28" rx="6" fill="#7b93c5" fill-opacity="0.12" stroke="#7b93c5" stroke-opacity="0.3" stroke-dasharray="8 7"/>
  <!-- la declaración fluye en un solo sentido -->
  <g stroke="#c3cfe9" stroke-opacity="0.6" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 500 270 h 180"/><polyline points="658,248 680,270 658,292"/>
  </g>
  <g stroke="#c3cfe9" stroke-opacity="0.3" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="4 12">
    <path d="M 700 370 h -180"/>
  </g>
  <polyline points="542,348 520,370 542,392" stroke="#c3cfe9" stroke-opacity="0.3" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <rect width="1200" height="630" fill="url(#ov)"/>
</svg>
