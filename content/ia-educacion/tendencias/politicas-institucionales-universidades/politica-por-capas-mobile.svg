<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 935" role="img" aria-labelledby="titulo desc">
  <title id="titulo">De la institución al curso: qué puede aclarar cada ámbito</title>
  <desc id="desc">Versión vertical de los cuatro ámbitos: acuerdos generales, decisiones de la institución, acuerdos del programa o disciplina y explicación para cada curso, asociados a los niveles institucional, de programa y de asignatura. El esquema es un ejemplo para conversar y no representa normas vigentes.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="935"/>

  <g class="tk-font">
    <text x="210" y="34" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">De la institución al curso</text>
    <text x="210" y="57" text-anchor="middle" font-size="14.5" class="f-muted">Qué puede aclarar cada ámbito</text>

    <g transform="translate(25 78)">
      <rect width="370" height="158" rx="5" class="bg-primary st-primary" stroke-width="1.7"/>
      <text x="28" y="39" font-size="19" font-weight="bold" class="f-primary">1 · Acuerdos generales</text>
      <text x="28" y="72" font-size="15" class="f-muted">Qué aprendizaje se protege, cómo se cuida</text>
      <text x="28" y="95" font-size="15" class="f-muted">a las personas y quién responde por</text>
      <text x="28" y="118" font-size="15" class="f-muted">las decisiones institucionales.</text>
      <text x="342" y="141" text-anchor="end" font-size="13.5" font-weight="bold" class="f-primary">Nivel institucional</text>
    </g>
    <path d="M210 236v28" class="st-axis" stroke-width="2.3"/>
    <path d="m202 254 8 10 8-10" fill="none" class="st-axis" stroke-width="2.3"/>
    <g transform="translate(25 268)">
      <rect width="370" height="134" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
      <text x="28" y="39" font-size="19" font-weight="bold" class="f-ink">2 · Decisiones de la institución</text>
      <text x="28" y="72" font-size="15" class="f-muted">Herramientas autorizadas, privacidad,</text>
      <text x="28" y="95" font-size="15" class="f-muted">apoyo y formas de revisión.</text>
      <text x="342" y="118" text-anchor="end" font-size="13.5" font-weight="bold" class="f-primary">Nivel institucional</text>
    </g>
    <path d="M210 402v28" class="st-axis" stroke-width="2.3"/>
    <path d="m202 420 8 10 8-10" fill="none" class="st-axis" stroke-width="2.3"/>
    <g transform="translate(25 434)">
      <rect width="370" height="134" rx="5" class="bg-warn st-warn" stroke-width="1.5"/>
      <text x="28" y="39" font-size="19" font-weight="bold" class="f-ink">3 · Acuerdos del programa</text>
      <text x="28" y="72" font-size="15" class="f-muted">Las academias explican cómo se aplican</text>
      <text x="28" y="95" font-size="15" class="f-muted">los acuerdos en su campo.</text>
      <text x="342" y="118" text-anchor="end" font-size="13.5" font-weight="bold" class="f-primary">Nivel de programa</text>
    </g>
    <path d="M210 568v28" class="st-axis" stroke-width="2.3"/>
    <path d="m202 586 8 10 8-10" fill="none" class="st-axis" stroke-width="2.3"/>
    <g transform="translate(25 600)">
      <rect width="370" height="158" rx="5" class="bg-good st-good" stroke-width="1.7"/>
      <text x="28" y="39" font-size="19" font-weight="bold" class="f-good">4 · Explicación para cada curso</text>
      <text x="28" y="72" font-size="15" class="f-muted">La actividad aclara qué puede hacer la IA,</text>
      <text x="28" y="95" font-size="15" class="f-muted">qué hará la persona y cómo se</text>
      <text x="28" y="118" font-size="15" class="f-muted">revisará el aprendizaje.</text>
      <text x="342" y="141" text-anchor="end" font-size="13.5" font-weight="bold" class="f-good">Nivel de asignatura</text>
    </g>

    <rect x="25" y="790" width="370" height="120" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="210" y="824" text-anchor="middle" font-size="15.5" font-weight="bold" class="f-primary">Cada ámbito desarrolla con más detalle</text>
    <text x="210" y="847" text-anchor="middle" font-size="15.5" font-weight="bold" class="f-primary">los acuerdos anteriores.</text>
    <text x="210" y="874" text-anchor="middle" font-size="14" class="f-muted">Es un ejemplo para conversar; no representa</text>
    <text x="210" y="895" text-anchor="middle" font-size="14" class="f-muted">normas ni autoridades ya definidas.</text>
  </g>
</svg>
