<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura de política por capas y gobernanza distribuida</title>
  <desc id="desc">Versión vertical de cuatro capas: principios, políticas institucionales, guía disciplinar y expectativas de curso. Cada capa concreta la anterior y se vincula con responsabilidades institucionales, de programa y de asignatura.</desc>
  <style>
    .tk{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}.ink{fill:#202945}.muted{fill:#5b5a66}.primary{fill:#b12028}.good{fill:#5e6a28}
    .bg-primary{fill:#f7e5e2}.bg-good{fill:#eceddc}.bg-neutral{fill:#f2ebdf}.st-primary{stroke:#b12028}.st-good{stroke:#5e6a28}.st-axis{stroke:#202945}
  </style>
  <g class="tk">
    <text x="210" y="34" text-anchor="middle" font-size="20" font-weight="bold" class="ink">De los principios a la asignatura</text>
    <g transform="translate(25 58)">
      <rect width="370" height="152" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="28" y="39" font-size="20" font-weight="bold" class="primary">1 · Principios</text>
      <text x="28" y="72" font-size="15.5" class="muted">Integridad del aprendizaje, responsabilidad</text>
      <text x="28" y="96" font-size="15.5" class="muted">humana, transparencia, equidad, datos</text>
      <text x="28" y="120" font-size="15.5" class="muted">y autonomía.</text>
      <text x="342" y="137" text-anchor="end" font-size="13.5" font-weight="bold" class="primary">Nivel institucional</text>
    </g>
    <path d="M210 210v30" class="st-axis" stroke-width="2.3"/>
    <g transform="translate(25 240)">
      <rect width="370" height="140" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
      <text x="28" y="39" font-size="20" font-weight="bold" class="ink">2 · Políticas institucionales</text>
      <text x="28" y="72" font-size="15.5" class="muted">Licenciamiento de herramientas, privacidad</text>
      <text x="28" y="96" font-size="15.5" class="muted">y marco de integridad.</text>
      <text x="342" y="124" text-anchor="end" font-size="13.5" font-weight="bold" class="primary">Nivel institucional</text>
    </g>
    <path d="M210 380v30" class="st-axis" stroke-width="2.3"/>
    <g transform="translate(25 410)">
      <rect width="370" height="140" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
      <text x="28" y="39" font-size="20" font-weight="bold" class="ink">3 · Guía disciplinar</text>
      <text x="28" y="72" font-size="15.5" class="muted">Programas y academias adaptan los criterios</text>
      <text x="28" y="96" font-size="15.5" class="muted">a cada campo y organizan su formación.</text>
      <text x="342" y="124" text-anchor="end" font-size="13.5" font-weight="bold" class="primary">Nivel de programa</text>
    </g>
    <path d="M210 550v30" class="st-axis" stroke-width="2.3"/>
    <g transform="translate(25 580)">
      <rect width="370" height="152" rx="5" class="bg-good st-good" stroke-width="1.7"/>
      <text x="28" y="39" font-size="20" font-weight="bold" class="good">4 · Expectativas de curso</text>
      <text x="28" y="72" font-size="15.5" class="muted">La asignatura comunica qué se permite,</text>
      <text x="28" y="96" font-size="15.5" class="muted">qué se declara, qué se excluye</text>
      <text x="28" y="120" font-size="15.5" class="muted">y cómo se evalúa.</text>
      <text x="342" y="137" text-anchor="end" font-size="13.5" font-weight="bold" class="good">Nivel de asignatura</text>
    </g>
    <rect x="25" y="775" width="370" height="170" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="210" y="811" text-anchor="middle" font-size="18" font-weight="bold" class="primary">Gobernanza distribuida</text>
    <text x="48" y="846" font-size="15.5" class="ink">• La institución sostiene el marco común.</text>
    <text x="48" y="875" font-size="15.5" class="ink">• El programa lo traduce a su disciplina.</text>
    <text x="48" y="904" font-size="15.5" class="ink">• La asignatura decide dentro del marco.</text>
    <text x="210" y="966" text-anchor="middle" font-size="14.5" font-weight="bold" class="muted">Arquitectura orientativa; no asigna competencias jurídicas.</text>
  </g>
</svg>
