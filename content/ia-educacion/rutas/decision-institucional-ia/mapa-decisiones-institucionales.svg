<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Seis decisiones institucionales conectadas</title>
  <desc id="desc">Un mandato revisable ocupa el centro. A su alrededor se conectan propósito y alcance; gobernanza y responsabilidades; personas, capacidades y equidad; datos, tecnología e infraestructura; portafolio y recursos; y evidencia, revisión y continuidad.</desc>
  <defs>
    <style>
      .paper { fill: #ece9e1; }
      .line { fill: none; stroke: #18223c; stroke-width: 5; stroke-linecap: round; }
      .node { stroke: #18223c; stroke-width: 4; }
      .title { font: 700 36px Newsreader, Georgia, serif; fill: #18223c; }
      .label { font: 700 27px Inter, Arial, sans-serif; fill: #18223c; }
      .small { font: 500 19px Inter, Arial, sans-serif; fill: #18223c; }
      .number { font: 800 30px Inter, Arial, sans-serif; fill: #ece9e1; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, solo la preferencia del sistema; el lienzo opaco
       garantiza legibilidad en cualquier caso. Ver CLAUDE.md convencion 6. */
      @media (prefers-color-scheme: dark) {
        .paper { fill: #131c31; }
        .line { stroke: #eceee9; }
        .node { stroke: #34405f; }
        .title, .label, .small { fill: #eceee9; }
        .number { fill: #131c31; }
        rect[fill="#f4e6d8"] { fill: #3a2c17; }
        rect[fill="#eed3b4"] { fill: #46351a; }
        rect[fill="#eceddc"] { fill: #2b331f; }
        rect[fill="#e3e6ec"] { fill: #243352; }
        circle[fill="#34508c"] { fill: #8ba3d6; }
        circle[fill="#687653"], circle[fill="#536326"] { fill: #b9c47a; }
        circle[fill="#b06a1f"] { fill: #d49a55; }
      }
    </style>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency=".8" numOctaves="2" seed="19" type="fractalNoise" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
  </defs>

  <rect class="paper" width="1600" height="960" rx="36"/>

  <g class="line" opacity=".65">
    <path d="M800 480 410 228"/>
    <path d="M800 480 1190 228"/>
    <path d="M800 480 1320 500"/>
    <path d="M800 480 1178 744"/>
    <path d="M800 480 422 744"/>
    <path d="M800 480 280 500"/>
  </g>

  <g filter="url(#grain)">
    <rect x="590" y="348" width="420" height="264" rx="42" fill="#f4e6d8" class="node"/>
    <circle cx="800" cy="392" r="32" fill="#34508c"/>
    <text x="800" y="403" text-anchor="middle" class="number">↻</text>
    <text x="800" y="472" text-anchor="middle" class="title">Mandato institucional</text>
    <text x="800" y="518" text-anchor="middle" class="title">revisable</text>
    <text x="800" y="548" text-anchor="middle" class="small">Conserva una dirección común,</text>
    <text x="800" y="574" text-anchor="middle" class="small">límites explícitos y</text>
    <text x="800" y="600" text-anchor="middle" class="small">recursos suficientes.</text>

    <rect x="145" y="116" width="520" height="190" rx="34" fill="#eed3b4" class="node"/>
    <circle cx="202" cy="172" r="32" fill="#34508c"/>
    <text x="202" y="182" text-anchor="middle" class="number">1</text>
    <text x="254" y="176" class="label">Propósito y alcance</text>
    <text x="254" y="225" class="small">Delimita el problema, la población,</text>
    <text x="254" y="253" class="small">los límites y la revisión.</text>

    <rect x="935" y="116" width="520" height="190" rx="34" fill="#eceddc" class="node"/>
    <circle cx="992" cy="172" r="32" fill="#687653"/>
    <text x="992" y="182" text-anchor="middle" class="number">2</text>
    <text x="1044" y="164" class="label">Gobernanza y</text>
    <text x="1044" y="202" class="label">responsabilidades</text>
    <text x="1044" y="242" class="small">Distribuye decisiones entre institución,</text>
    <text x="1044" y="270" class="small">programa y asignatura.</text>

    <rect x="1045" y="405" width="470" height="190" rx="34" fill="#e3e6ec" class="node"/>
    <circle cx="1102" cy="461" r="32" fill="#536326"/>
    <text x="1102" y="471" text-anchor="middle" class="number">3</text>
    <text x="1154" y="453" class="label">Personas, capacidades</text>
    <text x="1154" y="491" class="label">y equidad</text>
    <text x="1154" y="531" class="small">Asegura formación, tiempo,</text>
    <text x="1154" y="559" class="small">acceso y participación.</text>

    <rect x="915" y="654" width="540" height="190" rx="34" fill="#eed3b4" class="node"/>
    <circle cx="972" cy="710" r="32" fill="#34508c"/>
    <text x="972" y="720" text-anchor="middle" class="number">4</text>
    <text x="1024" y="702" class="label">Datos, tecnología e</text>
    <text x="1024" y="740" class="label">infraestructura</text>
    <text x="1024" y="780" class="small">Protege privacidad, portabilidad</text>
    <text x="1024" y="808" class="small">y reversibilidad.</text>

    <rect x="145" y="654" width="540" height="190" rx="34" fill="#f4e6d8" class="node"/>
    <circle cx="202" cy="710" r="32" fill="#b06a1f"/>
    <text x="202" y="720" text-anchor="middle" class="number">5</text>
    <text x="254" y="714" class="label">Portafolio y recursos</text>
    <text x="254" y="763" class="small">Prioriza según capacidad, costo</text>
    <text x="254" y="791" class="small">y estrategia de salida.</text>

    <rect x="85" y="405" width="470" height="190" rx="34" fill="#eceddc" class="node"/>
    <circle cx="142" cy="461" r="32" fill="#687653"/>
    <text x="142" y="471" text-anchor="middle" class="number">6</text>
    <text x="194" y="453" class="label">Evidencia, revisión</text>
    <text x="194" y="491" class="label">y continuidad</text>
    <text x="194" y="531" class="small">Decide si continuar, modificar,</text>
    <text x="194" y="559" class="small">ampliar o detener.</text>
  </g>
</svg>
