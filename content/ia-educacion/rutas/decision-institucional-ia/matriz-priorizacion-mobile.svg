<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Matriz de priorización por ajuste estratégico y capacidad institucional</title>
  <desc id="desc">Versión móvil de una matriz de dos por dos. Con ajuste alto y capacidad alta se puede emprender; con ajuste alto y capacidad baja conviene construir capacidad; con ajuste bajo y capacidad alta se debe posponer; con ambos bajos no se prioriza.</desc>
  <style>
    .tk{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}.ink{fill:#202945}.muted{fill:#5b5a66}.primary{fill:#b12028}.good{fill:#5e6a28}.risk{fill:#9f2f2f}
    .bg-primary{fill:#f7e5e2}.bg-good{fill:#eceddc}.bg-neutral{fill:#f2ebdf}.bg-risk{fill:#fae4e4}.st-primary{stroke:#b12028}.st-good{stroke:#5e6a28}.st-axis{stroke:#202945}.st-risk{stroke:#9f2f2f}
  </style>
  <g class="tk">
    <text x="210" y="30" text-anchor="middle" font-size="19" font-weight="bold" class="ink">Ajuste estratégico × capacidad</text>
    <text x="25" y="82" font-size="14" font-weight="bold" class="ink">Ajuste alto</text>
    <rect x="25" y="100" width="180" height="185" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="115" y="138" text-anchor="middle" font-size="18" font-weight="bold" class="ink">Desarrollar</text>
    <text x="115" y="163" text-anchor="middle" font-size="18" font-weight="bold" class="ink">capacidad primero</text>
    <text x="115" y="208" text-anchor="middle" font-size="14.5" class="muted">Alto aporte;</text>
    <text x="115" y="232" text-anchor="middle" font-size="14.5" class="muted">capacidad por construir.</text>
    <rect x="215" y="100" width="180" height="185" class="bg-good st-good" stroke-width="1.5"/>
    <text x="305" y="138" text-anchor="middle" font-size="18" font-weight="bold" class="good">Emprender</text>
    <text x="305" y="163" text-anchor="middle" font-size="18" font-weight="bold" class="good">con seguimiento</text>
    <text x="305" y="208" text-anchor="middle" font-size="14.5" class="good">Alto aporte y</text>
    <text x="305" y="232" text-anchor="middle" font-size="14.5" class="good">capacidad disponible.</text>

    <rect x="25" y="295" width="180" height="185" class="bg-risk st-risk" stroke-width="1.5"/>
    <text x="115" y="340" text-anchor="middle" font-size="18" font-weight="bold" class="risk">No priorizar</text>
    <text x="115" y="385" text-anchor="middle" font-size="14.5" class="risk">Bajo aporte y</text>
    <text x="115" y="409" text-anchor="middle" font-size="14.5" class="risk">baja capacidad.</text>
    <rect x="215" y="295" width="180" height="185" class="bg-neutral st-axis" stroke-width="1.5"/>
    <text x="305" y="340" text-anchor="middle" font-size="18" font-weight="bold" class="ink">Posponer</text>
    <text x="305" y="385" text-anchor="middle" font-size="14.5" class="muted">Factible, pero</text>
    <text x="305" y="409" text-anchor="middle" font-size="14.5" class="muted">de bajo aporte.</text>
    <text x="25" y="506" font-size="14" font-weight="bold" class="ink">Ajuste bajo</text>
    <text x="25" y="535" font-size="14" class="muted">Capacidad baja</text>
    <text x="395" y="535" text-anchor="end" font-size="14" class="muted">Capacidad alta</text>
    <path d="M25 550H395" class="st-axis" stroke-width="2"/>
    <path d="m385 543 10 7-10 7" fill="none" class="st-axis" stroke-width="2"/>
    <rect x="25" y="576" width="370" height="54" rx="5" class="bg-primary st-primary" stroke-width="1.3"/>
    <text x="210" y="599" text-anchor="middle" font-size="14.5" font-weight="bold" class="primary">Ayuda para deliberar; no prescribe</text>
    <text x="210" y="619" text-anchor="middle" font-size="14.5" font-weight="bold" class="primary">automáticamente una decisión.</text>
  </g>
</svg>
