<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1230" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Matriz UDGIA de priorización responsable</title>
  <desc id="desc">Versión vertical de una matriz conceptual original. Cuatro criterios orientan la deliberación: propósito de aprendizaje, salvaguardas y responsabilidad, capacidad para sostener, y evidencia y revisión. Su análisis conjunto conduce a priorizar y pilotar, preparar condiciones, reformular o no priorizar por ahora.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional. Síntesis original del marco UDGIA.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    .tk{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}.ink{fill:#18223c}.muted{fill:#525d70}.primary{fill:#34508c}.good{fill:#536326}.risk{fill:#8b2635}
    .bg-primary{fill:#e7ecf7}.bg-good{fill:#eceddc}.bg-neutral{fill:#ece9e1}.bg-warn{fill:#f4e6d8}.bg-risk{fill:#f8e7ea}
    .st-primary{stroke:#34508c}.st-good{stroke:#536326}.st-axis{stroke:#18223c}.st-warn{stroke:#914411}.st-risk{stroke:#8b2635}

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="1230"/>

  <g class="tk">
    <text x="210" y="34" text-anchor="middle" font-size="21" font-weight="bold" class="ink">Priorización responsable UDGIA</text>
    <text x="210" y="58" text-anchor="middle" font-size="14.5" class="muted">Cuatro preguntas antes de ampliar una iniciativa</text>

    <g transform="translate(25 84)">
      <rect width="370" height="154" rx="5" class="bg-primary st-primary" stroke-width="1.7"/>
      <text x="22" y="34" font-size="19" font-weight="bold" class="primary">1 · Propósito de aprendizaje</text>
      <text x="22" y="67" font-size="15" font-weight="bold" class="ink">¿Qué problema formativo resuelve?</text>
      <text x="22" y="96" font-size="14.5" class="muted">Resultado esperado y población</text>
      <text x="22" y="118" font-size="14.5" class="muted">deben estar definidos.</text>
      <text x="22" y="142" font-size="13.5" class="primary">Sin propósito claro → reformular.</text>
    </g>

    <g transform="translate(25 258)">
      <rect width="370" height="164" rx="5" class="bg-warn st-warn" stroke-width="1.7"/>
      <text x="22" y="34" font-size="19" font-weight="bold" class="ink">2 · Salvaguardas y responsabilidad</text>
      <text x="22" y="67" font-size="15" font-weight="bold" class="ink">¿Protege agencia, equidad, datos</text>
      <text x="22" y="89" font-size="15" font-weight="bold" class="ink">y juicio humano?</text>
      <text x="22" y="118" font-size="14.5" class="muted">Riesgos, alternativa y responsables</text>
      <text x="22" y="140" font-size="14.5" class="muted">deben estar identificados.</text>
      <text x="22" y="156" font-size="12.5" class="risk">Sin salvaguardas → preparar condiciones.</text>
    </g>

    <g transform="translate(25 442)">
      <rect width="370" height="154" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
      <text x="22" y="34" font-size="19" font-weight="bold" class="ink">3 · Capacidad para sostener</text>
      <text x="22" y="67" font-size="15" font-weight="bold" class="ink">¿Hay personas, tiempo, infraestructura</text>
      <text x="22" y="89" font-size="15" font-weight="bold" class="ink">y apoyo?</text>
      <text x="22" y="118" font-size="14.5" class="muted">Recursos y responsable operativo</text>
      <text x="22" y="140" font-size="14.5" class="muted">deben estar confirmados.</text>
    </g>

    <g transform="translate(25 616)">
      <rect width="370" height="154" rx="5" class="bg-good st-good" stroke-width="1.7"/>
      <text x="22" y="34" font-size="19" font-weight="bold" class="good">4 · Evidencia y revisión</text>
      <text x="22" y="67" font-size="15" font-weight="bold" class="ink">¿Puede probarse, revisarse y detenerse?</text>
      <text x="22" y="96" font-size="14.5" class="muted">Indicadores, fecha de revisión</text>
      <text x="22" y="118" font-size="14.5" class="muted">y criterio de salida deben definirse.</text>
      <text x="22" y="142" font-size="13.5" class="good">Con revisión → pilotar y aprender.</text>
    </g>

    <path d="M210 770v38" class="st-axis" stroke-width="2"/>
    <text x="210" y="800" text-anchor="middle" font-size="13.5" font-weight="bold" class="ink">La orientación surge del conjunto</text>

    <g transform="translate(25 826)">
      <rect width="180" height="118" rx="5" class="bg-good st-good" stroke-width="1.5"/>
      <text x="90" y="34" text-anchor="middle" font-size="16" font-weight="bold" class="good">Priorizar y pilotar</text>
      <text x="90" y="64" text-anchor="middle" font-size="13.5" class="muted">Propósito, resguardos,</text>
      <text x="90" y="84" text-anchor="middle" font-size="13.5" class="muted">capacidad y revisión</text>
      <text x="90" y="104" text-anchor="middle" font-size="13.5" class="muted">están definidos.</text>
    </g>
    <g transform="translate(215 826)">
      <rect width="180" height="118" rx="5" class="bg-warn st-warn" stroke-width="1.5"/>
      <text x="90" y="34" text-anchor="middle" font-size="16" font-weight="bold" class="ink">Preparar condiciones</text>
      <text x="90" y="64" text-anchor="middle" font-size="13.5" class="muted">El propósito es sólido;</text>
      <text x="90" y="84" text-anchor="middle" font-size="13.5" class="muted">faltan capacidad</text>
      <text x="90" y="104" text-anchor="middle" font-size="13.5" class="muted">o salvaguardas.</text>
    </g>
    <g transform="translate(25 954)">
      <rect width="180" height="118" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="90" y="34" text-anchor="middle" font-size="16" font-weight="bold" class="primary">Reformular</text>
      <text x="90" y="64" text-anchor="middle" font-size="13.5" class="muted">Problema, población</text>
      <text x="90" y="84" text-anchor="middle" font-size="13.5" class="muted">o evidencia aún</text>
      <text x="90" y="104" text-anchor="middle" font-size="13.5" class="muted">son ambiguos.</text>
    </g>
    <g transform="translate(215 954)">
      <rect width="180" height="118" rx="5" class="bg-risk st-risk" stroke-width="1.5"/>
      <text x="90" y="34" text-anchor="middle" font-size="16" font-weight="bold" class="risk">No priorizar aún</text>
      <text x="90" y="64" text-anchor="middle" font-size="13.5" class="muted">Aporte insuficiente</text>
      <text x="90" y="84" text-anchor="middle" font-size="13.5" class="muted">o riesgos</text>
      <text x="90" y="104" text-anchor="middle" font-size="13.5" class="muted">desproporcionados.</text>
    </g>

    <rect x="25" y="1102" width="370" height="96" rx="5" class="bg-neutral st-axis" stroke-width="1.2"/>
    <text x="210" y="1130" text-anchor="middle" font-size="14.5" font-weight="bold" class="ink">Herramienta deliberativa.</text>
    <text x="210" y="1156" text-anchor="middle" font-size="13.5" class="muted">No sustituye la evaluación pedagógica,</text>
    <text x="210" y="1178" text-anchor="middle" font-size="13.5" class="muted">ética, normativa, presupuestal o contextual.</text>
    <text x="210" y="1218" text-anchor="middle" font-size="12.5" class="primary">Síntesis original del marco UDGIA</text>
  </g>
</svg>
