<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1292" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Cuatro preguntas para decidir por dónde empezar</title>
  <desc id="desc">Versión vertical de las cuatro preguntas previas a ampliar una iniciativa: qué necesidad educativa atiende, qué cuidados requiere, si existen personas y recursos para sostenerla y cómo se aprenderá de una prueba. Las cuatro respuestas se consideran juntas para probar en pequeño, preparar condiciones, reformular o esperar.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="1292"/>

  <g class="tk-font">
    <text x="210" y="34" text-anchor="middle" font-size="20" font-weight="bold" class="f-ink">Cuatro preguntas para decidir</text>
    <text x="210" y="59" text-anchor="middle" font-size="20" font-weight="bold" class="f-ink">por dónde empezar</text>
    <text x="210" y="84" text-anchor="middle" font-size="14.5" class="f-muted">Antes de ampliar una iniciativa de IA</text>

    <g transform="translate(25 108)">
      <rect width="370" height="160" rx="5" class="bg-primary st-primary" stroke-width="1.7"/>
      <text x="22" y="34" font-size="18" font-weight="bold" class="f-primary">1 · Necesidad educativa</text>
      <text x="22" y="64" font-size="15" font-weight="bold" class="f-ink">¿Qué se quiere mejorar y para quién?</text>
      <text x="22" y="93" font-size="14.5" class="f-muted">Explicar el aprendizaje esperado</text>
      <text x="22" y="115" font-size="14.5" class="f-muted">y las personas involucradas.</text>
      <text x="22" y="141" font-size="13.5" class="f-primary">Si la necesidad no está clara, se reformula.</text>
    </g>

    <g transform="translate(25 284)">
      <rect width="370" height="176" rx="5" class="bg-warn st-warn" stroke-width="1.7"/>
      <text x="22" y="34" font-size="18" font-weight="bold" class="f-ink">2 · Cuidados y responsabilidad</text>
      <text x="22" y="64" font-size="15" font-weight="bold" class="f-ink">¿Protege aprendizaje, acceso, datos</text>
      <text x="22" y="86" font-size="15" font-weight="bold" class="f-ink">y decisiones humanas?</text>
      <text x="22" y="115" font-size="14.5" class="f-muted">Identificar posibles daños, otra opción</text>
      <text x="22" y="137" font-size="14.5" class="f-muted">y quién responderá.</text>
      <text x="22" y="163" font-size="13.5" class="f-risk">Si faltan cuidados, se preparan primero.</text>
    </g>

    <g transform="translate(25 476)">
      <rect width="370" height="176" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
      <text x="22" y="34" font-size="18" font-weight="bold" class="f-ink">3 · Capacidad para sostener</text>
      <text x="22" y="64" font-size="15" font-weight="bold" class="f-ink">¿Hay personas, tiempo, infraestructura</text>
      <text x="22" y="86" font-size="15" font-weight="bold" class="f-ink">y apoyo?</text>
      <text x="22" y="115" font-size="14.5" class="f-muted">Confirmar los recursos y quién sostendrá</text>
      <text x="22" y="137" font-size="14.5" class="f-muted">el trabajo cotidiano.</text>
      <text x="22" y="163" font-size="13.5" class="f-ink">Si falta capacidad, se prepara antes de ampliar.</text>
    </g>

    <g transform="translate(25 668)">
      <rect width="370" height="160" rx="5" class="bg-good st-good" stroke-width="1.7"/>
      <text x="22" y="34" font-size="18" font-weight="bold" class="f-good">4 · Prueba y aprendizaje</text>
      <text x="22" y="64" font-size="15" font-weight="bold" class="f-ink">¿Puede probarse, revisarse y detenerse?</text>
      <text x="22" y="93" font-size="14.5" class="f-muted">Acordar qué se observará, cuándo</text>
      <text x="22" y="115" font-size="14.5" class="f-muted">y qué haría detenerse.</text>
      <text x="22" y="141" font-size="13.5" class="f-good">Con revisión acordada, se prueba y aprende.</text>
    </g>

    <path d="M210 828v34" class="st-axis" stroke-width="2"/>
    <text x="210" y="884" text-anchor="middle" font-size="14" font-weight="bold" class="f-ink">La decisión surge de las cuatro respuestas, no de una sola</text>

    <g transform="translate(25 904)">
      <rect width="180" height="122" rx="5" class="bg-good st-good" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-size="16" font-weight="bold" class="f-good">Probar en pequeño</text>
      <text x="90" y="60" text-anchor="middle" font-size="13.5" class="f-muted">Necesidad, cuidados,</text>
      <text x="90" y="80" text-anchor="middle" font-size="13.5" class="f-muted">recursos y revisión</text>
      <text x="90" y="100" text-anchor="middle" font-size="13.5" class="f-muted">están definidos.</text>
    </g>
    <g transform="translate(215 904)">
      <rect width="180" height="122" rx="5" class="bg-warn st-warn" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-size="16" font-weight="bold" class="f-ink">Preparar condiciones</text>
      <text x="90" y="60" text-anchor="middle" font-size="13.5" class="f-muted">El propósito es sólido;</text>
      <text x="90" y="80" text-anchor="middle" font-size="13.5" class="f-muted">faltan recursos</text>
      <text x="90" y="100" text-anchor="middle" font-size="13.5" class="f-muted">o cuidados.</text>
    </g>
    <g transform="translate(25 1042)">
      <rect width="180" height="122" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Reformular</text>
      <text x="90" y="60" text-anchor="middle" font-size="13.5" class="f-muted">Problema, población</text>
      <text x="90" y="80" text-anchor="middle" font-size="13.5" class="f-muted">o aprendizaje aún</text>
      <text x="90" y="100" text-anchor="middle" font-size="13.5" class="f-muted">no son claros.</text>
    </g>
    <g transform="translate(215 1042)">
      <rect width="180" height="122" rx="5" class="bg-risk st-risk" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-size="16" font-weight="bold" class="f-risk">Esperar por ahora</text>
      <text x="90" y="60" text-anchor="middle" font-size="13.5" class="f-muted">El aporte es pequeño</text>
      <text x="90" y="80" text-anchor="middle" font-size="13.5" class="f-muted">o los posibles daños son</text>
      <text x="90" y="100" text-anchor="middle" font-size="13.5" class="f-muted">demasiado altos.</text>
    </g>

    <rect x="25" y="1188" width="370" height="76" rx="5" class="bg-neutral st-axis" stroke-width="1.1"/>
    <text x="210" y="1219" text-anchor="middle" font-size="14" class="f-ink">Las preguntas ayudan a conversar; no toman</text>
    <text x="210" y="1241" text-anchor="middle" font-size="14" class="f-ink">la decisión ni sustituyen las revisiones necesarias.</text>
  </g>
</svg>
