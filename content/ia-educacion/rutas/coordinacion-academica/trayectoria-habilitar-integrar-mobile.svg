<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" role="img" aria-labelledby="titulo desc">
  <title id="titulo">De tener inteligencia artificial disponible a integrarla con propósito</title>
  <desc id="desc">Versión vertical del recorrido en tres momentos: la inteligencia artificial ya está disponible y en uso; la comunidad aprende a comprenderla, comprobarla y explicar decisiones; y se integra con propósito donde aporta sin desplazar el aprendizaje. Las orientaciones apoyan ese recorrido y pueden revisarse con la experiencia.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="790"/>

  <g class="tk-font">
    <text x="210" y="38" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">Una trayectoria institucional posible</text>

    <rect x="25" y="64" width="370" height="150" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
    <circle cx="62" cy="102" r="22" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="62" y="109" text-anchor="middle" font-size="20" font-weight="bold" class="f-primary">1</text>
    <text x="100" y="107" font-size="21" font-weight="bold" class="f-ink">Ya está disponible</text>
    <text x="48" y="145" font-size="15.5" class="f-muted">La IA ya está presente y en uso cotidiano.</text>
    <text x="48" y="169" font-size="15.5" class="f-muted">Este acceso, por sí solo,</text>
    <text x="48" y="193" font-size="15.5" class="f-muted">no garantiza aprendizaje.</text>
    <path d="M210 214v33" class="st-axis" stroke-width="2.5"/>
    <path d="m202 238 8 10 8-10" fill="none" class="st-axis" stroke-width="2.5"/>

    <rect x="25" y="252" width="370" height="150" rx="5" class="bg-warn st-warn" stroke-width="1.5"/>
    <circle cx="62" cy="290" r="22" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="62" y="297" text-anchor="middle" font-size="20" font-weight="bold" class="f-primary">2</text>
    <text x="100" y="295" font-size="21" font-weight="bold" class="f-ink">Aprender a utilizarla</text>
    <text x="48" y="333" font-size="15.5" class="f-muted">Comprender sus límites, comprobar sus</text>
    <text x="48" y="357" font-size="15.5" class="f-muted">respuestas y explicar decisiones.</text>
    <text x="48" y="381" font-size="15.5" class="f-muted">La formación conecta acceso y criterio.</text>
    <path d="M210 402v33" class="st-axis" stroke-width="2.5"/>
    <path d="m202 426 8 10 8-10" fill="none" class="st-axis" stroke-width="2.5"/>

    <rect x="25" y="440" width="370" height="150" rx="5" class="bg-good st-good" stroke-width="1.7"/>
    <circle cx="62" cy="478" r="22" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="62" y="485" text-anchor="middle" font-size="20" font-weight="bold" class="f-primary">3</text>
    <text x="100" y="483" font-size="21" font-weight="bold" class="f-good">Integrarla con propósito</text>
    <text x="48" y="521" font-size="15.5" class="f-muted">Incorporarla donde aporta,</text>
    <text x="48" y="545" font-size="15.5" class="f-muted">sin desplazar el aprendizaje.</text>
    <text x="48" y="569" font-size="15.5" class="f-muted">Revisar lo que ocurre en la práctica.</text>

    <path d="M210 590v34" class="st-primary" stroke-width="2.5"/>
    <rect x="25" y="624" width="370" height="140" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="210" y="658" text-anchor="middle" font-size="17" font-weight="bold" class="f-primary">Las orientaciones se concentran</text>
    <text x="210" y="682" text-anchor="middle" font-size="17" font-weight="bold" class="f-primary">en aprender, decidir e integrar</text>
    <text x="210" y="714" text-anchor="middle" font-size="15" class="f-muted">Son revisables a partir de la experiencia;</text>
    <text x="210" y="738" text-anchor="middle" font-size="15" class="f-muted">no constituyen un reglamento cerrado.</text>
  </g>
</svg>
