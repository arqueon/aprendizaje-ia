<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" role="img" aria-labelledby="titulo desc">
  <title id="titulo">De habilitar a integrar</title>
  <desc id="desc">Versión vertical de una trayectoria institucional posible en tres etapas: habilitar condiciones básicas, capacitar a la comunidad e integrar la IA al diseño educativo. Las etapas pueden solaparse y se revisan periódicamente.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    .tk{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}.ink{fill:#18223c}.muted{fill:#525d70}.primary{fill:#34508c}.good{fill:#536326}
    .bg-primary{fill:#e7ecf7}.bg-good{fill:#eceddc}.bg-neutral{fill:#ece9e1}.st-primary{stroke:#34508c}.st-good{stroke:#536326}.st-axis{stroke:#18223c}

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="790"/>

  <g class="tk">
    <text x="210" y="35" text-anchor="middle" font-size="19" font-weight="bold" class="ink">Trayectoria institucional posible</text>
    <rect x="25" y="62" width="370" height="155" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
    <circle cx="62" cy="100" r="22" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="62" y="107" text-anchor="middle" font-size="20" font-weight="bold" class="primary">1</text>
    <text x="100" y="105" font-size="22" font-weight="bold" class="ink">Habilitar</text>
    <text x="48" y="143" font-size="16" class="muted">La IA ya está presente y en uso cotidiano.</text>
    <text x="48" y="170" font-size="16" class="muted">Asegurar acceso, protección de datos</text>
    <text x="48" y="194" font-size="16" class="muted">e infraestructura para experimentar.</text>
    <path d="M210 217v35" class="st-axis" stroke-width="2.5"/>
    <path d="m202 243 8 10 8-10" fill="none" class="st-axis" stroke-width="2.5"/>

    <rect x="25" y="258" width="370" height="155" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <circle cx="62" cy="296" r="22" fill="#fff" class="st-primary" stroke-width="1.5"/>
    <text x="62" y="303" text-anchor="middle" font-size="20" font-weight="bold" class="primary">2</text>
    <text x="100" y="301" font-size="22" font-weight="bold" class="primary">Capacitar</text>
    <text x="48" y="339" font-size="16" class="muted">Desarrollar competencias, criterios</text>
    <text x="48" y="366" font-size="16" class="muted">y alfabetización en IA mediante</text>
    <text x="48" y="390" font-size="16" class="muted">formación y acompañamiento.</text>
    <path d="M210 413v35" class="st-axis" stroke-width="2.5"/>
    <path d="m202 439 8 10 8-10" fill="none" class="st-axis" stroke-width="2.5"/>

    <rect x="25" y="454" width="370" height="155" rx="5" class="bg-good st-good" stroke-width="1.7"/>
    <circle cx="62" cy="492" r="22" fill="#fff" class="st-good" stroke-width="1.5"/>
    <text x="62" y="499" text-anchor="middle" font-size="20" font-weight="bold" class="good">3</text>
    <text x="100" y="497" font-size="22" font-weight="bold" class="good">Integrar</text>
    <text x="48" y="535" font-size="16" class="muted">Articular la IA con los propósitos</text>
    <text x="48" y="562" font-size="16" class="muted">de aprendizaje, el diseño, la evaluación</text>
    <text x="48" y="586" font-size="16" class="muted">y el acompañamiento.</text>

    <path d="M210 609v36" class="st-primary" stroke-width="2.5"/>
    <rect x="25" y="645" width="370" height="112" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="210" y="681" text-anchor="middle" font-size="18" font-weight="bold" class="primary">Revisar y volver a decidir</text>
    <text x="210" y="711" text-anchor="middle" font-size="15.5" class="muted">Las etapas pueden solaparse.</text>
    <text x="210" y="735" text-anchor="middle" font-size="15.5" class="muted">No forman una escala obligatoria.</text>
  </g>
</svg>
