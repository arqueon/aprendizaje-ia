<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="titulo desc">
  <title id="titulo">De tener inteligencia artificial disponible a integrarla con propósito</title>
  <desc id="desc">La inteligencia artificial ya está disponible y se utiliza. Para incorporarla a la vida
    académica hacen falta dos movimientos: aprender a comprenderla y revisarla, y decidir dónde aporta valor
    sin desplazar el aprendizaje. Las orientaciones apoyan ese recorrido y pueden revisarse con la experiencia.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>

  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="f-ink"/>
    </marker>
  </defs>

  <rect class="fig-canvas" x="0" y="0" width="880" height="360"/>
  <g class="tk-font">
    <!-- Etapa 1: ya está disponible -->
    <rect x="40" y="70" width="230" height="120" rx="2" class="bg-neutral st-axis" stroke-width="1.5"/>
    <text x="155" y="108" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">Ya está disponible</text>
    <text x="155" y="136" text-anchor="middle" font-size="13" class="f-muted">La IA ya está presente</text>
    <text x="155" y="154" text-anchor="middle" font-size="13" class="f-muted">y en uso cotidiano</text>
    <text x="155" y="172" text-anchor="middle" font-size="13" class="f-muted">Este acceso no garantiza aprendizaje</text>

    <!-- Flecha 1→2 -->
    <line x1="270" y1="130" x2="318" y2="130" class="st-axis" stroke-width="2" marker-end="url(#flecha)"/>

    <!-- Etapa 2: aprender a utilizarla -->
    <rect x="325" y="70" width="230" height="120" rx="2" class="bg-warn st-warn" stroke-width="1.5"/>
    <text x="440" y="108" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">Aprender a utilizarla</text>
    <text x="440" y="136" text-anchor="middle" font-size="13" class="f-muted">Comprender sus límites, comprobar</text>
    <text x="440" y="154" text-anchor="middle" font-size="13" class="f-muted">sus respuestas y explicar decisiones</text>
    <text x="440" y="172" text-anchor="middle" font-size="13" class="f-muted">La formación conecta acceso y criterio</text>

    <!-- Flecha 2→3 -->
    <line x1="555" y1="130" x2="603" y2="130" class="st-axis" stroke-width="2" marker-end="url(#flecha)"/>

    <!-- Etapa 3: integrarla con propósito -->
    <rect x="610" y="70" width="230" height="120" rx="2" class="bg-good st-good" stroke-width="1.5"/>
    <text x="725" y="108" text-anchor="middle" font-size="19" font-weight="bold" class="f-good">Integrarla con propósito</text>
    <text x="725" y="136" text-anchor="middle" font-size="13" class="f-muted">Incorporarla donde aporta</text>
    <text x="725" y="154" text-anchor="middle" font-size="13" class="f-muted">sin desplazar el aprendizaje</text>
    <text x="725" y="172" text-anchor="middle" font-size="13" class="f-muted">Revisar lo que ocurre en la práctica</text>

    <!-- Llave: alcance del documento -->
    <path d="M 325 215 L 325 232 L 840 232 L 840 215" fill="none" class="st-primary" stroke-width="2"/>
    <line x1="582" y1="232" x2="582" y2="247" class="st-primary" stroke-width="2"/>
    <text x="582" y="268" text-anchor="middle" font-size="14" font-weight="bold" class="f-primary">Las orientaciones se concentran en aprender, decidir e integrar</text>

    <!-- Banda inferior -->
    <rect x="40" y="295" width="800" height="42" rx="2" class="bg-primary st-primary" stroke-width="1.2"/>
    <text x="440" y="321" text-anchor="middle" font-size="13.5" class="f-primary">Son orientaciones revisables a partir de la experiencia; no constituyen un reglamento cerrado</text>
  </g>
</svg>
