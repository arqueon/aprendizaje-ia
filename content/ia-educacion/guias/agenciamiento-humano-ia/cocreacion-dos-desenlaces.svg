<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Dos maneras de trabajar con una respuesta de inteligencia artificial</title>
  <desc id="desc">La persona formula una pregunta, contrasta la respuesta, decide qué acepta y explica
    el resultado. Cuando conserva esas decisiones, la inteligencia artificial le ayuda a pensar. Cuando
    acepta la respuesta sin comprenderla ni comprobarla, la herramienta termina realizando el trabajo
    que la persona necesitaba aprender.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>

  <defs>
    <marker id="flechaCiclo" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="f-primary"/>
    </marker>
    <marker id="flechaGood" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="f-good"/>
    </marker>
    <marker id="flechaRisk" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="f-risk"/>
    </marker>
  </defs>

  <rect class="fig-canvas" x="0" y="0" width="880" height="600"/>
  <g class="tk-font">
    <!-- ===== Trabajo entre persona e IA ===== -->
    <rect x="245" y="42" width="130" height="56" rx="2" class="bg-primary st-primary" stroke-width="1.6"/>
    <text x="310" y="68" text-anchor="middle" font-size="15" font-weight="bold" class="f-primary">Persona</text>
    <text x="310" y="85" text-anchor="middle" font-size="11.5" class="f-muted">Juicio y propósito</text>

    <rect x="505" y="42" width="130" height="56" rx="2" class="bg-neutral st-axis" stroke-width="1.6"/>
    <text x="570" y="68" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">IA</text>
    <text x="570" y="85" text-anchor="middle" font-size="11.5" class="f-muted">Variantes y señales</text>

    <line x1="375" y1="70" x2="405" y2="70" class="st-primary" stroke-width="1.8"/>
    <line x1="505" y1="70" x2="475" y2="70" class="st-axis" stroke-width="1.8"/>
    <rect x="405" y="36" width="70" height="68" rx="2" class="bg-good st-good" stroke-width="1.8"/>
    <text x="440" y="61" text-anchor="middle" font-size="13" font-weight="bold" class="f-good">Trabajo</text>
    <text x="440" y="78" text-anchor="middle" font-size="13" font-weight="bold" class="f-good">conjunto</text>
    <text x="440" y="94" text-anchor="middle" font-size="10.5" class="f-muted">persona e IA</text>

    <text x="665" y="62" font-size="13.5" font-weight="bold" class="f-primary">Aportes diferentes</text>
    <text x="665" y="80" font-size="12" class="f-muted">La IA propone; la persona</text>
    <text x="665" y="96" font-size="12" class="f-muted">comprueba y decide</text>

    <!-- conexión al ciclo -->
    <line x1="440" y1="112" x2="440" y2="148" class="st-axis" stroke-width="1.8" marker-end="url(#flechaCiclo)"/>

    <!-- ===== Recorrido de trabajo ===== -->
    <!-- nodos: formular (arriba), contrastar (derecha), decidir (abajo), responder (izquierda) -->
    <g>
      <rect x="385" y="155" width="110" height="34" rx="2" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="440" y="177" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-primary">Formular</text>

      <rect x="555" y="263" width="110" height="34" rx="2" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="610" y="285" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-primary">Contrastar</text>

      <rect x="385" y="371" width="110" height="34" rx="2" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="440" y="393" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-primary">Decidir</text>

      <rect x="215" y="263" width="110" height="34" rx="2" class="bg-primary st-primary" stroke-width="1.5"/>
      <text x="270" y="285" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-primary">Responder</text>

      <!-- arcos del ciclo (sentido horario) -->
      <path d="M 500 178 Q 600 195 608 258" fill="none" class="st-primary" stroke-width="2" marker-end="url(#flechaCiclo)"/>
      <path d="M 608 302 Q 600 365 500 388" fill="none" class="st-primary" stroke-width="2" marker-end="url(#flechaCiclo)"/>
      <path d="M 380 388 Q 280 365 272 302" fill="none" class="st-primary" stroke-width="2" marker-end="url(#flechaCiclo)"/>
      <path d="M 272 258 Q 280 195 380 178" fill="none" class="st-primary" stroke-width="2" marker-end="url(#flechaCiclo)"/>
    </g>

    <!-- pregunta central -->
    <text x="440" y="270" text-anchor="middle" font-size="14" font-weight="bold" class="f-ink">¿Quién comprueba</text>
    <text x="440" y="289" text-anchor="middle" font-size="14" font-weight="bold" class="f-ink">y decide?</text>
    <text x="440" y="309" text-anchor="middle" font-size="11.5" class="f-muted">La decisión sigue siendo humana</text>

    <!-- ===== Desenlaces ===== -->
    <!-- La IA ayuda a pensar -->
    <path d="M 330 420 Q 250 450 230 478" fill="none" class="st-good" stroke-width="2.2" marker-end="url(#flechaGood)"/>
    <text x="218" y="448" text-anchor="end" font-size="12.5" font-weight="bold" class="f-good">La persona comprueba</text>
    <text x="218" y="464" text-anchor="end" font-size="12.5" font-weight="bold" class="f-good">y toma la decisión</text>

    <rect x="60" y="485" width="350" height="92" rx="2" class="bg-good st-good" stroke-width="1.8"/>
    <text x="235" y="512" text-anchor="middle" font-size="16" font-weight="bold" class="f-good">La IA ayuda a pensar</text>
    <text x="235" y="534" text-anchor="middle" font-size="12" class="f-muted">Una objeción o un ejemplo inesperado</text>
    <text x="235" y="550" text-anchor="middle" font-size="12" class="f-muted">obliga a revisar las propias ideas</text>
    <text x="235" y="566" text-anchor="middle" font-size="12" class="f-muted">antes de aceptar una respuesta</text>

    <!-- La IA sustituye el pensamiento -->
    <path d="M 550 420 Q 630 450 650 478" fill="none" class="st-risk" stroke-width="2.2" marker-end="url(#flechaRisk)"/>
    <text x="662" y="448" font-size="12.5" font-weight="bold" class="f-risk">La persona acepta</text>
    <text x="662" y="464" font-size="12.5" font-weight="bold" class="f-risk">sin revisar</text>

    <rect x="470" y="485" width="350" height="92" rx="2" class="bg-risk st-risk" stroke-width="1.8"/>
    <text x="645" y="512" text-anchor="middle" font-size="16" font-weight="bold" class="f-risk">La IA sustituye el pensamiento</text>
    <text x="645" y="534" text-anchor="middle" font-size="12" class="f-muted">La respuesta se copia o se valida</text>
    <text x="645" y="550" text-anchor="middle" font-size="12" class="f-muted">sin comprenderla ni comprobarla</text>
    <text x="645" y="566" text-anchor="middle" font-size="12" class="f-muted">y la persona deja de practicar</text>
  </g>
</svg>
