<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1040" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Dos maneras de trabajar con una respuesta de inteligencia artificial</title>
  <desc id="desc">Versión vertical del trabajo conjunto entre persona e IA: la persona formula, contrasta, decide y responde. Cuando comprueba y toma la decisión, la inteligencia artificial le ayuda a pensar; cuando acepta la respuesta sin revisarla, la herramienta sustituye el pensamiento que necesitaba practicar.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="1040"/>

  <g class="tk-font">
    <rect x="25" y="24" width="180" height="80" rx="5" class="bg-primary st-primary" stroke-width="1.6"/>
    <text x="115" y="56" text-anchor="middle" font-size="17" font-weight="bold" class="f-primary">Persona</text>
    <text x="115" y="80" text-anchor="middle" font-size="13.5" class="f-muted">Juicio y propósito</text>
    <rect x="215" y="24" width="180" height="80" rx="5" class="bg-neutral st-axis" stroke-width="1.6"/>
    <text x="305" y="56" text-anchor="middle" font-size="17" font-weight="bold" class="f-ink">IA</text>
    <text x="305" y="80" text-anchor="middle" font-size="13.5" class="f-muted">Variantes y señales</text>

    <line x1="115" y1="104" x2="115" y2="124" class="st-primary" stroke-width="2"/>
    <line x1="305" y1="104" x2="305" y2="124" class="st-axis" stroke-width="2"/>
    <rect x="25" y="124" width="370" height="56" rx="5" class="bg-good st-good" stroke-width="1.7"/>
    <text x="210" y="158" text-anchor="middle" font-size="16" font-weight="bold" class="f-good">Trabajo conjunto entre persona e IA</text>

    <text x="210" y="210" text-anchor="middle" font-size="15" font-weight="bold" class="f-primary">Aportes diferentes</text>
    <text x="210" y="233" text-anchor="middle" font-size="14.5" class="f-muted">La IA propone; la persona comprueba y decide.</text>

    <path d="M210 246v26" class="st-axis" stroke-width="2.3"/>
    <path d="m202 262 8 10 8-10" fill="none" class="st-axis" stroke-width="2.3"/>

    <rect x="25" y="282" width="330" height="48" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="190" y="313" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Formular</text>
    <path d="M190 330v18" class="st-primary" stroke-width="2"/>
    <path d="m183 340 7 9 7-9" fill="none" class="st-primary" stroke-width="2"/>
    <rect x="25" y="348" width="330" height="48" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="190" y="379" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Contrastar</text>
    <path d="M190 396v18" class="st-primary" stroke-width="2"/>
    <path d="m183 406 7 9 7-9" fill="none" class="st-primary" stroke-width="2"/>
    <rect x="25" y="414" width="330" height="48" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="190" y="445" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Decidir</text>
    <path d="M190 462v18" class="st-primary" stroke-width="2"/>
    <path d="m183 472 7 9 7-9" fill="none" class="st-primary" stroke-width="2"/>
    <rect x="25" y="480" width="330" height="48" rx="5" class="bg-primary st-primary" stroke-width="1.5"/>
    <text x="190" y="511" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Responder</text>

    <!-- retorno del ciclo -->
    <path d="M 355 504 L 385 504 L 385 306 L 363 306" fill="none" class="st-primary" stroke-width="1.8"/>
    <path d="m371 298 -10 8 10 8" fill="none" class="st-primary" stroke-width="1.8"/>

    <rect x="25" y="552" width="370" height="88" rx="5" class="bg-neutral st-axis" stroke-width="1.5"/>
    <text x="210" y="586" text-anchor="middle" font-size="16.5" font-weight="bold" class="f-ink">¿Quién comprueba y decide?</text>
    <text x="210" y="614" text-anchor="middle" font-size="14.5" class="f-muted">La decisión sigue siendo humana.</text>

    <g transform="translate(25 668)">
      <rect width="370" height="164" rx="5" class="bg-good st-good" stroke-width="1.8"/>
      <text x="185" y="34" text-anchor="middle" font-size="14" font-weight="bold" class="f-good">La persona comprueba y toma la decisión</text>
      <text x="185" y="64" text-anchor="middle" font-size="17.5" font-weight="bold" class="f-good">La IA ayuda a pensar</text>
      <text x="185" y="94" text-anchor="middle" font-size="14.5" class="f-muted">Una objeción o un ejemplo inesperado</text>
      <text x="185" y="116" text-anchor="middle" font-size="14.5" class="f-muted">obliga a revisar las propias ideas</text>
      <text x="185" y="138" text-anchor="middle" font-size="14.5" class="f-muted">antes de aceptar una respuesta.</text>
    </g>

    <g transform="translate(25 852)">
      <rect width="370" height="164" rx="5" class="bg-risk st-risk" stroke-width="1.8"/>
      <text x="185" y="34" text-anchor="middle" font-size="14" font-weight="bold" class="f-risk">La persona acepta sin revisar</text>
      <text x="185" y="64" text-anchor="middle" font-size="17.5" font-weight="bold" class="f-risk">La IA sustituye el pensamiento</text>
      <text x="185" y="94" text-anchor="middle" font-size="14.5" class="f-muted">La respuesta se copia o se valida</text>
      <text x="185" y="116" text-anchor="middle" font-size="14.5" class="f-muted">sin comprenderla ni comprobarla,</text>
      <text x="185" y="138" text-anchor="middle" font-size="14.5" class="f-muted">y la persona deja de practicar.</text>
    </g>
  </g>
</svg>
