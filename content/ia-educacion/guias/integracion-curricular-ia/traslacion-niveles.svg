<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="titulo desc">
  <title id="titulo">La integración se traslada del perfil de egreso al aula</title>
  <desc id="desc">Tres niveles conectados por flechas. En el perfil de egreso, una competencia marcada como transformación profunda se distingue de otra con ajuste necesario y de otra sin cambio inmediato. La competencia afectada se distribuye en tres asignaturas del programa: una la introduce, otra la profundiza y otra la consolida; una cuarta asignatura queda sin cambios. Cada asignatura ajustada hace visible la integración en el aula con tres elementos: sección de IA en el syllabus, criterio de uso de IA en la rúbrica y tutoría grupal en semanas clave. Una nota recuerda que cada competencia afectada vive en al menos dos asignaturas y que ninguna asignatura asume más de tres dimensiones nuevas.</desc>
  <style>
    .font{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}
    .ink{fill:var(--udg-c-ink,#18223c)}.muted{fill:var(--udg-c-muted,#525d70)}
    .paper{fill:var(--udg-c-surface,#ffffff)}.alt{fill:var(--udg-c-surface-alt,#ece9e1)}
    .indigo{fill:var(--udg-c-primary-tint,#e7ecf7)}.olive{fill:var(--udg-c-good-tint,#eceddc)}
    .warn{fill:var(--udg-c-warning-tint,#f4e6d8)}
    .line{stroke:var(--udg-c-ink,#18223c)}.stp{stroke:var(--udg-c-primary,#34508c)}
    .stg{stroke:var(--udg-c-good,#536326)}
    .primary{fill:var(--udg-c-primary,#34508c)}.good{fill:var(--udg-c-good,#536326)}
  </style>
  <defs>
    <marker id="fP" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="primary"/>
    </marker>
    <marker id="fG" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="good"/>
    </marker>
  </defs>
  <g class="font">
    <rect width="1280" height="700" class="paper"/>
    <text x="640" y="44" text-anchor="middle" font-size="28" font-weight="700" class="ink">La integración se traslada por niveles</text>
    <text x="640" y="74" text-anchor="middle" font-size="17" class="muted">Una competencia afectada se distribuye entre asignaturas y se vuelve visible en el syllabus y sus rúbricas.</text>

    <!-- Nivel 1: perfil de egreso -->
    <rect x="42" y="112" width="360" height="470" rx="10" class="alt line" stroke-width="1.5"/>
    <text x="222" y="150" text-anchor="middle" font-size="22" font-weight="700" class="ink">Perfil de egreso</text>
    <text x="222" y="176" text-anchor="middle" font-size="15" class="muted">mapeo por el claustro (paso 1)</text>

    <rect x="70" y="204" width="304" height="96" rx="8" class="indigo stp" stroke-width="2.5"/>
    <text x="90" y="238" font-size="17" font-weight="700" class="ink">Escritura técnica</text>
    <text x="90" y="264" font-size="15" font-weight="700" class="primary">Transformación profunda</text>
    <text x="90" y="286" font-size="14" class="muted">cambia de naturaleza con IA</text>

    <rect x="70" y="322" width="304" height="86" rx="8" class="warn line" stroke-width="1.3"/>
    <text x="90" y="354" font-size="17" font-weight="700" class="ink">Análisis de datos</text>
    <text x="90" y="380" font-size="15" class="muted">Ajuste necesario</text>

    <rect x="70" y="430" width="304" height="86" rx="8" class="paper line" stroke-width="1.3" stroke-dasharray="5 5"/>
    <text x="90" y="462" font-size="17" font-weight="700" class="muted">Atención humana presencial</text>
    <text x="90" y="488" font-size="15" class="muted">Sin cambio inmediato</text>

    <!-- Flechas de distribución -->
    <path d="M374 252 C 430 252, 430 208, 466 202" fill="none" class="stp" stroke-width="2.5" marker-end="url(#fP)"/>
    <path d="M374 252 C 430 252, 430 316, 466 322" fill="none" class="stp" stroke-width="2.5" marker-end="url(#fP)"/>
    <path d="M374 252 C 434 252, 434 436, 466 442" fill="none" class="stp" stroke-width="2.5" marker-end="url(#fP)"/>

    <!-- Nivel 2: asignaturas -->
    <rect x="472" y="112" width="336" height="470" rx="10" class="alt line" stroke-width="1.5"/>
    <text x="640" y="150" text-anchor="middle" font-size="22" font-weight="700" class="ink">Asignaturas del programa</text>
    <text x="640" y="176" text-anchor="middle" font-size="15" class="muted">matriz competencia × asignatura</text>

    <rect x="496" y="196" width="288" height="72" rx="8" class="indigo stp" stroke-width="2"/>
    <text x="514" y="226" font-size="16" font-weight="700" class="ink">Asignatura de 2.º semestre</text>
    <text x="514" y="250" font-size="15" class="primary">introduce</text>

    <rect x="496" y="316" width="288" height="72" rx="8" class="indigo stp" stroke-width="2"/>
    <text x="514" y="346" font-size="16" font-weight="700" class="ink">Asignatura de 4.º semestre</text>
    <text x="514" y="370" font-size="15" class="primary">profundiza</text>

    <rect x="496" y="436" width="288" height="72" rx="8" class="indigo stp" stroke-width="2"/>
    <text x="514" y="466" font-size="16" font-weight="700" class="ink">Asignatura de 6.º semestre</text>
    <text x="514" y="490" font-size="15" class="primary">consolida</text>

    <rect x="496" y="524" width="288" height="44" rx="8" class="paper line" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="514" y="552" font-size="15" class="muted">Otras asignaturas: sin cambios</text>

    <!-- Flechas hacia el aula -->
    <path d="M784 232 C 838 232, 838 236, 872 240" fill="none" class="stg" stroke-width="2.5" marker-end="url(#fG)"/>
    <path d="M784 352 C 838 352, 838 348, 872 344" fill="none" class="stg" stroke-width="2.5" marker-end="url(#fG)"/>
    <path d="M784 472 C 838 472, 838 452, 872 448" fill="none" class="stg" stroke-width="2.5" marker-end="url(#fG)"/>

    <!-- Nivel 3: syllabus y rúbricas -->
    <rect x="878" y="112" width="360" height="470" rx="10" class="alt line" stroke-width="1.5"/>
    <text x="1058" y="150" text-anchor="middle" font-size="22" font-weight="700" class="ink">Syllabus y rúbricas</text>
    <text x="1058" y="176" text-anchor="middle" font-size="15" class="muted">cada asignatura ajustada</text>

    <rect x="902" y="204" width="312" height="86" rx="8" class="olive stg" stroke-width="1.6"/>
    <text x="922" y="238" font-size="16" font-weight="700" class="ink">Sección de IA en el syllabus</text>
    <text x="922" y="264" font-size="14" class="muted">usos permitidos, restringidos, prohibidos</text>

    <rect x="902" y="312" width="312" height="86" rx="8" class="olive stg" stroke-width="1.6"/>
    <text x="922" y="346" font-size="16" font-weight="700" class="ink">Criterio de IA en la rúbrica</text>
    <text x="922" y="372" font-size="14" class="muted">uso transparente y proceso documentado</text>

    <rect x="902" y="420" width="312" height="86" rx="8" class="olive stg" stroke-width="1.6"/>
    <text x="922" y="454" font-size="16" font-weight="700" class="ink">Tutoría en semanas clave</text>
    <text x="922" y="480" font-size="14" class="muted">dudas resueltas y criterios unificados</text>

    <!-- Etiquetas de traslación (sobre los paneles) -->
    <g>
      <rect x="368" y="114" width="134" height="52" rx="8" class="paper stp" stroke-width="1.5"/>
      <text x="435" y="136" text-anchor="middle" font-size="15" font-weight="700" class="primary">se distribuye</text>
      <text x="435" y="156" text-anchor="middle" font-size="15" font-weight="700" class="primary">(paso 3)</text>
      <rect x="774" y="114" width="140" height="52" rx="8" class="paper stg" stroke-width="1.5"/>
      <text x="844" y="136" text-anchor="middle" font-size="15" font-weight="700" class="good">se hace visible</text>
      <text x="844" y="156" text-anchor="middle" font-size="15" font-weight="700" class="good">(paso 5)</text>
    </g>

    <!-- Nota de reglas -->
    <rect x="90" y="614" width="1100" height="60" rx="8" class="warn line" stroke-width="1.4"/>
    <text x="640" y="640" text-anchor="middle" font-size="16" font-weight="700" class="ink">Cada competencia afectada vive en al menos dos asignaturas;</text>
    <text x="640" y="662" text-anchor="middle" font-size="16" class="ink">ninguna asignatura asume más de tres dimensiones nuevas.</text>
  </g>
</svg>
