<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Instrumentos para evaluar el proceso</title>
  <desc id="desc">Tres instrumentos, portafolio iterativo, rúbrica analítica asistida y diario de reflexión, se articulan alrededor de la trazabilidad, la validación y el juicio docente.</desc>
  <style>
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#202945; } .f-muted { fill:#5B5A66; }
    .f-primary { fill:#B12028; } .f-good { fill:#5E6A28; } .f-risk { fill:#9A4A12; }
    .bg-primary { fill:#F7E5E2; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#F4E6D8; }
    .bg-neutral { fill:#F2EBDF; } .bg-warn { fill:#FDE8C0; }
    .st-primary { stroke:#B12028; } .st-good { stroke:#5E6A28; } .st-risk { stroke:#9A4A12; }
    .st-warn { stroke:#C9971C; } .st-axis { stroke:#202945; }
  </style>
  <g class="tk-font">
    <rect x="290" y="245" width="300" height="110" rx="2" class="bg-primary st-primary" stroke-width="1.8"/>
    <text x="440" y="280" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Trazabilidad y juicio docente</text>
    <text x="440" y="305" text-anchor="middle" font-size="12" class="f-muted">Versiones, criterios, decisiones</text>
    <text x="440" y="322" text-anchor="middle" font-size="12" class="f-muted">y reflexión sobre el aprendizaje</text>
    <text x="440" y="342" text-anchor="middle" font-size="12" font-weight="bold" class="f-ink">Evidencia del proceso</text>

    <rect x="40" y="55" width="240" height="100" rx="2" class="bg-good st-good" stroke-width="1.5"/>
    <text x="160" y="88" text-anchor="middle" font-size="15" font-weight="bold" class="f-good">Portafolio iterativo</text>
    <text x="160" y="114" text-anchor="middle" font-size="11.5" class="f-muted">Versiones sucesivas muestran</text>
    <text x="160" y="131" text-anchor="middle" font-size="11.5" class="f-muted">la evolución del pensamiento</text>

    <rect x="320" y="55" width="240" height="100" rx="2" class="bg-warn st-warn" stroke-width="1.5"/>
    <text x="440" y="88" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">Rúbrica analítica asistida</text>
    <text x="440" y="114" text-anchor="middle" font-size="11.5" class="f-muted">La IA retroalimenta con criterios;</text>
    <text x="440" y="131" text-anchor="middle" font-size="11.5" class="f-muted">el docente conserva la calificación</text>

    <rect x="600" y="55" width="240" height="100" rx="2" class="bg-neutral st-axis" stroke-width="1.5"/>
    <text x="720" y="88" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">Diario de reflexión</text>
    <text x="720" y="114" text-anchor="middle" font-size="11.5" class="f-muted">Registra consultas, decisiones</text>
    <text x="720" y="131" text-anchor="middle" font-size="11.5" class="f-muted">y conciencia del propio proceso</text>

    <g fill="none" stroke-width="1.5">
      <path d="M 160 155 L 350 245" class="st-good"/>
      <path d="M 440 155 L 440 245" class="st-warn"/>
      <path d="M 720 155 L 530 245" class="st-axis"/>
    </g>

    <rect x="170" y="420" width="540" height="34" rx="2" class="bg-primary st-primary" stroke-width="1.2"/>
    <text x="440" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" class="f-primary">La IA apoya la retroalimentación; el docente juzga el aprendizaje</text>
  </g>
</svg>
