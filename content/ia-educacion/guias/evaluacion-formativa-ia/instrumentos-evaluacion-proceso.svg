<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Instrumentos para evaluar el proceso</title>
  <desc id="desc">Cuatro instrumentos, portafolio iterativo, bitácora de decisiones, defensa oral y rúbricas asistidas, se articulan alrededor de la trazabilidad, la validación y el juicio docente.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#202945; } .f-muted { fill:#5B5A66; }
    .f-primary { fill:#B12028; } .f-good { fill:#5E6A28; } .f-risk { fill:#9A4A12; }
    .bg-primary { fill:#F7E5E2; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#F4E6D8; }
    .bg-neutral { fill:#F2EBDF; } .bg-warn { fill:#FDE8C0; }
    .st-primary { stroke:#B12028; } .st-good { stroke:#5E6A28; } .st-risk { stroke:#9A4A12; }
    .st-warn { stroke:#C9971C; } .st-axis { stroke:#202945; }
  </style>
  <g class="tk-font">
    <rect x="320" y="185" width="240" height="110" rx="2" class="bg-primary st-primary" stroke-width="1.8"/>
    <text x="440" y="220" text-anchor="middle" font-size="16" font-weight="bold" class="f-primary">Trazabilidad del proceso</text>
    <text x="440" y="245" text-anchor="middle" font-size="12" class="f-muted">Qué se preguntó, qué se descartó,</text>
    <text x="440" y="262" text-anchor="middle" font-size="12" class="f-muted">qué se transformó y por qué</text>
    <text x="440" y="282" text-anchor="middle" font-size="12" font-weight="bold" class="f-ink">Evidencia del juicio</text>

    <rect x="58" y="52" width="250" height="88" rx="2" class="bg-good st-good" stroke-width="1.5"/>
    <text x="183" y="82" text-anchor="middle" font-size="15" font-weight="bold" class="f-good">Portafolio iterativo</text>
    <text x="183" y="106" text-anchor="middle" font-size="11.5" class="f-muted">Versiones sucesivas que muestran</text>
    <text x="183" y="122" text-anchor="middle" font-size="11.5" class="f-muted">la evolución del pensamiento</text>

    <rect x="572" y="52" width="250" height="88" rx="2" class="bg-warn st-warn" stroke-width="1.5"/>
    <text x="697" y="82" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">Bitácora de decisiones</text>
    <text x="697" y="106" text-anchor="middle" font-size="11.5" class="f-muted">Registro de consultas, criterios,</text>
    <text x="697" y="122" text-anchor="middle" font-size="11.5" class="f-muted">aceptaciones y descartes</text>

    <rect x="58" y="340" width="250" height="88" rx="2" class="bg-neutral st-axis" stroke-width="1.5"/>
    <text x="183" y="370" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">Defensa oral</text>
    <text x="183" y="394" text-anchor="middle" font-size="11.5" class="f-muted">Explicar y sostener el trabajo</text>
    <text x="183" y="410" text-anchor="middle" font-size="11.5" class="f-muted">sin depender de la IA</text>

    <rect x="572" y="340" width="250" height="88" rx="2" class="bg-good st-good" stroke-width="1.5"/>
    <text x="697" y="370" text-anchor="middle" font-size="15" font-weight="bold" class="f-good">Rúbricas asistidas</text>
    <text x="697" y="394" text-anchor="middle" font-size="11.5" class="f-muted">Retroalimentación con IA,</text>
    <text x="697" y="410" text-anchor="middle" font-size="11.5" class="f-muted">calificación con juicio docente</text>

    <g fill="none" stroke-width="1.5">
      <path d="M 308 118 L 355 185" class="st-good"/>
      <path d="M 572 118 L 525 185" class="st-warn"/>
      <path d="M 308 384 L 355 295" class="st-axis"/>
      <path d="M 572 384 L 525 295" class="st-good"/>
    </g>

    <rect x="222" y="455" width="436" height="30" rx="2" class="bg-primary st-primary" stroke-width="1.2"/>
    <text x="440" y="475" text-anchor="middle" font-size="12.5" font-weight="bold" class="f-primary">La integridad se sostiene en trazabilidad, no en detección (§5.4)</text>
  </g>
</svg>
