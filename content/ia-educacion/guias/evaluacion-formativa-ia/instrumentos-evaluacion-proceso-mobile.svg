<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Cuatro instrumentos para hacer visible el proceso</title>
  <desc id="desc">Versión vertical. El portafolio iterativo, la bitácora de decisiones, la defensa oral y las rúbricas asistidas aportan evidencias complementarias. Los cuatro convergen en la trazabilidad del proceso y el juicio docente.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .tk{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}.ink{fill:#18223c}.muted{fill:#525d70}.primary{fill:#34508c}.good{fill:#536326}
    .bg-primary{fill:#e7ecf7}.bg-good{fill:#eceddc}.bg-neutral{fill:#ece9e1}.bg-warn{fill:#f4e6d8}
    .st-primary{stroke:#34508c}.st-good{stroke:#536326}.st-warn{stroke:#914411}.st-axis{stroke:#18223c}
  </style>
  <g class="tk">
    <text x="210" y="36" text-anchor="middle" font-size="21" font-weight="bold" class="ink">Cuatro instrumentos complementarios</text>

    <g transform="translate(25 62)">
      <rect width="370" height="138" rx="5" class="bg-good st-good" stroke-width="1.7"/>
      <text x="24" y="36" font-size="20" font-weight="bold" class="good">1 · Portafolio iterativo</text>
      <text x="24" y="70" font-size="15.5" class="muted">Versiones sucesivas que muestran</text>
      <text x="24" y="94" font-size="15.5" class="muted">la evolución del pensamiento.</text>
      <text x="24" y="121" font-size="13.5" font-weight="bold" class="good">Hace visible: evolución.</text>
    </g>

    <g transform="translate(25 220)">
      <rect width="370" height="138" rx="5" class="bg-warn st-warn" stroke-width="1.7"/>
      <text x="24" y="36" font-size="20" font-weight="bold" class="ink">2 · Bitácora de decisiones</text>
      <text x="24" y="70" font-size="15.5" class="muted">Registra consultas, criterios,</text>
      <text x="24" y="94" font-size="15.5" class="muted">aceptaciones y descartes.</text>
      <text x="24" y="121" font-size="13.5" font-weight="bold" class="ink">Hace visible: razonamiento.</text>
    </g>

    <g transform="translate(25 378)">
      <rect width="370" height="138" rx="5" class="bg-neutral st-axis" stroke-width="1.7"/>
      <text x="24" y="36" font-size="20" font-weight="bold" class="ink">3 · Defensa oral</text>
      <text x="24" y="70" font-size="15.5" class="muted">Explicar y sostener el trabajo</text>
      <text x="24" y="94" font-size="15.5" class="muted">sin depender de la IA.</text>
      <text x="24" y="121" font-size="13.5" font-weight="bold" class="ink">Hace visible: comprensión.</text>
    </g>

    <g transform="translate(25 536)">
      <rect width="370" height="138" rx="5" class="bg-good st-good" stroke-width="1.7"/>
      <text x="24" y="36" font-size="20" font-weight="bold" class="good">4 · Rúbricas asistidas</text>
      <text x="24" y="70" font-size="15.5" class="muted">Retroalimentación con IA;</text>
      <text x="24" y="94" font-size="15.5" class="muted">calificación con juicio docente.</text>
      <text x="24" y="121" font-size="13.5" font-weight="bold" class="good">Hace visible: criterios.</text>
    </g>

    <path d="M210 674v34" class="st-axis" stroke-width="2"/>
    <rect x="25" y="708" width="370" height="164" rx="5" class="bg-primary st-primary" stroke-width="1.9"/>
    <text x="210" y="746" text-anchor="middle" font-size="20" font-weight="bold" class="primary">Trazabilidad del proceso</text>
    <text x="210" y="782" text-anchor="middle" font-size="15.5" class="muted">Qué se preguntó, qué se descartó,</text>
    <text x="210" y="806" text-anchor="middle" font-size="15.5" class="muted">qué se transformó y por qué.</text>
    <text x="210" y="842" text-anchor="middle" font-size="16" font-weight="bold" class="ink">Evidencia del juicio.</text>

    <rect x="25" y="900" width="370" height="54" rx="5" class="bg-primary st-primary" stroke-width="1.3"/>
    <text x="210" y="924" text-anchor="middle" font-size="14.5" font-weight="bold" class="primary">La integridad se sostiene en trazabilidad,</text>
    <text x="210" y="945" text-anchor="middle" font-size="14.5" font-weight="bold" class="primary">no en detección.</text>
  </g>
</svg>
