<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1005" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Cuatro maneras de conocer cómo se llegó al resultado</title>
  <desc id="desc">Versión vertical de las cuatro muestras que ayudan a comprender el recorrido: versiones sucesivas, una nota sobre una decisión, una conversación sobre el trabajo y criterios explícitos. Cada actividad puede elegir la muestra más pequeña que todavía ayude a interpretar el aprendizaje.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="1005"/>

  <g class="tk-font">
    <text x="210" y="36" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">Cuatro maneras de conocer</text>
    <text x="210" y="61" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">cómo se llegó al resultado</text>

    <rect x="25" y="84" width="370" height="150" rx="5" class="bg-primary st-primary" stroke-width="1.8"/>
    <text x="210" y="119" text-anchor="middle" font-size="19" font-weight="bold" class="f-primary">Comprender el recorrido</text>
    <text x="210" y="151" text-anchor="middle" font-size="15" class="f-muted">Qué se preguntó, qué se descartó,</text>
    <text x="210" y="174" text-anchor="middle" font-size="15" class="f-muted">qué se transformó y por qué.</text>
    <text x="210" y="206" text-anchor="middle" font-size="15.5" font-weight="bold" class="f-ink">Una decisión que puede explicarse.</text>

    <g transform="translate(25 260)">
      <rect width="370" height="128" rx="5" class="bg-good st-good" stroke-width="1.6"/>
      <text x="24" y="38" font-size="19" font-weight="bold" class="f-good">1 · Versiones sucesivas</text>
      <text x="24" y="72" font-size="15.5" class="f-muted">Permiten comparar qué cambió</text>
      <text x="24" y="96" font-size="15.5" class="f-muted">y qué provocó el cambio.</text>
    </g>
    <g transform="translate(25 404)">
      <rect width="370" height="128" rx="5" class="bg-warn st-warn" stroke-width="1.6"/>
      <text x="24" y="38" font-size="19" font-weight="bold" class="f-ink">2 · Nota sobre una decisión</text>
      <text x="24" y="72" font-size="15.5" class="f-muted">Explica qué se aceptó, corrigió</text>
      <text x="24" y="96" font-size="15.5" class="f-muted">o descartó, y por qué.</text>
    </g>
    <g transform="translate(25 548)">
      <rect width="370" height="128" rx="5" class="bg-neutral st-axis" stroke-width="1.6"/>
      <text x="24" y="38" font-size="19" font-weight="bold" class="f-ink">3 · Conversación sobre el trabajo</text>
      <text x="24" y="72" font-size="15.5" class="f-muted">La persona explica una elección</text>
      <text x="24" y="96" font-size="15.5" class="f-muted">y responde una pregunta.</text>
    </g>
    <g transform="translate(25 692)">
      <rect width="370" height="128" rx="5" class="bg-good st-good" stroke-width="1.6"/>
      <text x="24" y="38" font-size="19" font-weight="bold" class="f-good">4 · Criterios explícitos</text>
      <text x="24" y="72" font-size="15.5" class="f-muted">El grupo sabe qué se observará;</text>
      <text x="24" y="96" font-size="15.5" class="f-muted">el profesorado conserva el juicio.</text>
    </g>

    <text x="210" y="856" text-anchor="middle" font-size="14.5" class="f-muted">Cada actividad puede elegir la muestra más pequeña</text>
    <text x="210" y="878" text-anchor="middle" font-size="14.5" class="f-muted">que todavía ayude a interpretar el aprendizaje.</text>

    <rect x="25" y="900" width="370" height="80" rx="5" class="bg-primary st-primary" stroke-width="1.3"/>
    <text x="210" y="933" text-anchor="middle" font-size="15" font-weight="bold" class="f-primary">Comprender una decisión aporta más</text>
    <text x="210" y="957" text-anchor="middle" font-size="15" font-weight="bold" class="f-primary">que intentar detectar una herramienta.</text>
  </g>
</svg>
