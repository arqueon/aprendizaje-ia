<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1064" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Siete criterios para tomar decisiones educativas sobre inteligencia artificial</title>
  <desc id="desc">Versión vertical de los siete criterios revisables: enseñar antes de exigir, explicar el uso, observar también las decisiones del recorrido, ofrecer opciones de acceso, aclarar quién responde, conservar control sobre herramientas y datos, y revisar los acuerdos a partir de la experiencia.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <rect class="fig-canvas" x="0" y="0" width="420" height="1064"/>

  <g class="tk-font">
    <rect x="25" y="24" width="370" height="96" rx="5" class="bg-primary st-primary" stroke-width="1.7"/>
    <text x="210" y="56" text-anchor="middle" font-size="19" font-weight="bold" class="f-primary">Decidir cómo usar IA</text>
    <text x="210" y="80" text-anchor="middle" font-size="19" font-weight="bold" class="f-primary">para apoyar el aprendizaje</text>
    <text x="210" y="106" text-anchor="middle" font-size="15" class="f-muted">Siete criterios revisables para decidir con contexto.</text>

    <g transform="translate(25 146)">
      <rect width="370" height="100" rx="5" class="bg-warn st-warn" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">1</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-ink">Enseñar antes de exigir</text>
      <text x="70" y="72" font-size="15" class="f-muted">No exigir lo que no se enseñó.</text>
    </g>

    <g transform="translate(25 262)">
      <rect width="370" height="118" rx="5" class="bg-neutral st-axis" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">2</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-ink">Explicar cómo se utilizó</text>
      <text x="70" y="72" font-size="15" class="f-muted">Estudiantado y profesorado describen</text>
      <text x="70" y="94" font-size="15" class="f-muted">los apoyos relevantes.</text>
    </g>

    <g transform="translate(25 396)">
      <rect width="370" height="100" rx="5" class="bg-good st-good" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">3</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-good">Mirar también el recorrido</text>
      <text x="70" y="72" font-size="15" class="f-muted">Conocer una decisión y cómo se comprobó.</text>
    </g>

    <g transform="translate(25 512)">
      <rect width="370" height="100" rx="5" class="bg-good st-good" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">4</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-good">Ofrecer opciones de acceso</text>
      <text x="70" y="72" font-size="15" class="f-muted">Que la actividad no cree desventajas.</text>
    </g>

    <g transform="translate(25 628)">
      <rect width="370" height="100" rx="5" class="bg-neutral st-axis" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">5</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-ink">Aclarar quién responde</text>
      <text x="70" y="72" font-size="15" class="f-muted">Cada ámbito explica sus decisiones.</text>
    </g>

    <g transform="translate(25 744)">
      <rect width="370" height="118" rx="5" class="bg-warn st-warn" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">6</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-ink">Conservar opciones</text>
      <text x="70" y="72" font-size="15" class="f-muted">Poder recuperar datos</text>
      <text x="70" y="94" font-size="15" class="f-muted">y cambiar de herramienta.</text>
    </g>

    <g transform="translate(25 878)">
      <rect width="370" height="118" rx="5" class="bg-primary st-primary" stroke-width="1.4"/>
      <circle cx="35" cy="36" r="20" class="bg-primary st-primary" stroke-width="1.4"/>
      <text x="35" y="42" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">7</text>
      <text x="70" y="42" font-size="18.5" font-weight="bold" class="f-primary">Volver a revisar</text>
      <text x="70" y="72" font-size="15" class="f-muted">Actualizar acuerdos a partir de la</text>
      <text x="70" y="94" font-size="15" class="f-muted">experiencia y de los nuevos casos.</text>
    </g>

    <text x="210" y="1038" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">Los criterios se consideran juntos; ninguno decide por sí solo.</text>
  </g>
</svg>
