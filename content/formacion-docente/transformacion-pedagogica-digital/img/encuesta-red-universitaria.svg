<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; transition: fill 0.3s; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 12; transition: fill 0.3s, stroke 0.3s; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .q-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .p-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .pct-1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #2563eb; }
      .pct-2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #0d9488; }
      .pct-3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #d97706; }
      .bar-bg { fill: #f1f5f9; rx: 4; }
      .bar-fill-1 { fill: #2563eb; rx: 4; }
      .bar-fill-2 { fill: #0d9488; rx: 4; }
      .bar-fill-3 { fill: #d97706; rx: 4; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .card-bg { fill: #1e293b; stroke: #334155; }
        .title { fill: #f1f5f9; }
        .subtitle { fill: #94a3b8; }
        .q-text { fill: #e2e8f0; }
        .p-text { fill: #94a3b8; }
        .pct-1 { fill: #60a5fa; }
        .pct-2 { fill: #2dd4bf; }
        .pct-3 { fill: #fbbf24; }
        .bar-bg { fill: #334155; }
        .bar-fill-1 { fill: #3b82f6; }
        .bar-fill-2 { fill: #14b8a6; }
        .bar-fill-3 { fill: #f59e0b; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400" rx="16" />

  <!-- Header -->
  <text x="400" y="45" class="title" text-anchor="middle">Resultados de la Encuesta en la Red Universitaria</text>
  <text x="400" y="65" class="subtitle" text-anchor="middle">Percepción docente sobre modalidades de impartición (UdeG, 2022)</text>

  <!-- Card 1 -->
  <g transform="translate(40, 90)">
    <rect class="card-bg" width="720" height="85" filter="url(#shadow)" />
    <text x="20" y="30" class="q-text">¿El programa podría cursarse combinando lo presencial y en línea (híbrido)?</text>
    <text x="690" y="30" class="pct-1" text-anchor="end">~85%</text>
    <text x="20" y="50" class="p-text">Consenso abrumador a favor del aprendizaje híbrido en todos los Centros Universitarios y SEMS.</text>
    <rect x="20" y="62" width="680" height="8" class="bar-bg" />
    <rect x="20" y="62" width="578" height="8" class="bar-fill-1" />
  </g>

  <!-- Card 2 -->
  <g transform="translate(40, 190)">
    <rect class="card-bg" width="720" height="85" filter="url(#shadow)" />
    <text x="20" y="30" class="q-text">¿El programa podría cursarse 100% en línea sin perder calidad?</text>
    <text x="690" y="30" class="pct-2" text-anchor="end">~40%</text>
    <text x="20" y="50" class="p-text">Opinión dividida; varía significativamente según la disciplina práctica o teórica del Centro.</text>
    <rect x="20" y="62" width="680" height="8" class="bar-bg" />
    <rect x="20" y="62" width="272" height="8" class="bar-fill-2" />
  </g>

  <!-- Card 3 -->
  <g transform="translate(40, 290)">
    <rect class="card-bg" width="720" height="85" filter="url(#shadow)" />
    <text x="20" y="30" class="q-text">¿Las características de la asignatura demandan 100% de presencialidad?</text>
    <text x="690" y="30" class="pct-3" text-anchor="end">~15%</text>
    <text x="20" y="50" class="p-text">Bajo porcentaje de docentes considera obligatorio el modelo tradicional estrictamente presencial.</text>
    <rect x="20" y="62" width="680" height="8" class="bar-bg" />
    <rect x="20" y="62" width="102" height="8" class="bar-fill-3" />
  </g>
</svg>
