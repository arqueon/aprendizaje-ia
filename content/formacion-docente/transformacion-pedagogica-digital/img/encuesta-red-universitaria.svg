<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f3ee; }
      .card-bg { fill: #ffffff; stroke: #c9c5bb; stroke-width: 1; rx: 12; }
      .title { font-family: "Piazzolla", Georgia, "Times New Roman", serif; font-size: 20px; font-weight: bold; fill: #18223c; }
      .subtitle { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #525d70; }
      .q-text { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #18223c; }
      .p-text { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #525d70; }
      .pct-1 { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #34508c; }
      .pct-2 { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #536326; }
      .pct-3 { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #914411; }
      .bar-bg { fill: #ece9e1; rx: 4; }
      .bar-fill-1 { fill: #34508c; rx: 4; }
      .bar-fill-2 { fill: #536326; rx: 4; }
      .bar-fill-3 { fill: #914411; rx: 4; }
      
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18223c" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400" rx="16" />

  <!-- Header -->
  <text x="400" y="45" class="title" text-anchor="middle">Resultados de la Encuesta en la Red Universitaria</text>
  <text x="400" y="65" class="subtitle" text-anchor="middle">Percepción docente sobre modalidades de impartición (UdeG, 2022)</text>

  <!-- Card 1 -->
  <g transform="translate(40, 90)">
    <rect class="card-bg" width="720" height="85" filter="url(#shadow)" />
    <text x="20" y="30" class="q-text">¿El programa podría cursarse combinando lo presencial y en línea (híbrido)?</text>
    <text x="690" y="30" class="pct-1" text-anchor="end">~85%</text>
    <text x="20" y="50" class="p-text">Consenso abrumador a favor del aprendizaje híbrido en todos los Centros Universitarios y SEMS.</text>
    <rect x="20" y="62" width="680" height="8" class="bar-bg" />
    <rect x="20" y="62" width="578" height="8" class="bar-fill-1" />
  </g>

  <!-- Card 2 -->
  <g transform="translate(40, 190)">
    <rect class="card-bg" width="720" height="85" filter="url(#shadow)" />
    <text x="20" y="30" class="q-text">¿El programa podría cursarse 100% en línea sin perder calidad?</text>
    <text x="690" y="30" class="pct-2" text-anchor="end">~40%</text>
    <text x="20" y="50" class="p-text">Opinión dividida; varía significativamente según la disciplina práctica o teórica del Centro.</text>
    <rect x="20" y="62" width="680" height="8" class="bar-bg" />
    <rect x="20" y="62" width="272" height="8" class="bar-fill-2" />
  </g>

  <!-- Card 3 -->
  <g transform="translate(40, 290)">
    <rect class="card-bg" width="720" height="85" filter="url(#shadow)" />
    <text x="20" y="30" class="q-text">¿Las características de la asignatura demandan 100% de presencialidad?</text>
    <text x="690" y="30" class="pct-3" text-anchor="end">~15%</text>
    <text x="20" y="50" class="p-text">Bajo porcentaje de docentes considera obligatorio el modelo tradicional estrictamente presencial.</text>
    <rect x="20" y="62" width="680" height="8" class="bar-bg" />
    <rect x="20" y="62" width="102" height="8" class="bar-fill-3" />
  </g>
</svg>
