<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f3ee; }
      .card-bg { fill: #ffffff; stroke: #c9c5bb; stroke-width: 1; rx: 12; }
      .title { font-family: "Piazzolla", Georgia, "Times New Roman", serif; font-size: 22px; font-weight: bold; fill: #18223c; }
      .subtitle { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #525d70; }
      
      .c1-title { font-family: "Piazzolla", Georgia, serif; font-size: 18px; font-weight: bold; fill: #536326; }
      .c2-title { font-family: "Piazzolla", Georgia, serif; font-size: 18px; font-weight: bold; fill: #914411; }
      .c3-title { font-family: "Piazzolla", Georgia, serif; font-size: 18px; font-weight: bold; fill: #34508c; }
      
      .li-text { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #232c47; }
      .res-title { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #18223c; letter-spacing: 1px; }
      
      .box-1 { fill: #eceddc; stroke: #d8dbae; stroke-width: 1; rx: 8; }
      .box-2 { fill: #f4e6d8; stroke: #f4e6d8; stroke-width: 1; rx: 8; }
      .box-3 { fill: #e7ecf7; stroke: #c3cfe9; stroke-width: 1; rx: 8; }
      
      .box-text-1 { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #44521f; text-anchor: middle; }
      .box-text-2 { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #5e2e0d; text-anchor: middle; }
      .box-text-3 { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #7f1820; text-anchor: middle; }

    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18223c" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect class="bg" width="900" height="600" rx="16" />

  <text x="450" y="45" class="title" text-anchor="middle">El Dilema de las Habilidades</text>
  <text x="450" y="65" class="subtitle" text-anchor="middle">Perspectivas de la universidad, el gobierno y la industria</text>

  <!-- 3 Columns -->
  <!-- Col 1 -->
  <g transform="translate(40, 100)">
    <rect class="card-bg" width="260" height="200" filter="url(#shadow)" />
    <text x="20" y="35" class="c1-title">Universidad</text>
    <circle cx="20" cy="70" r="4" fill="#536326" />
    <text x="35" y="75" class="li-text">Proveer habilidades que</text>
    <text x="35" y="95" class="li-text">servirán en el futuro.</text>
    <circle cx="20" cy="130" r="4" fill="#536326" />
    <text x="35" y="135" class="li-text">Ofrecer oportunidades</text>
    <text x="35" y="155" class="li-text">inmediatas y conexiones</text>
    <text x="35" y="175" class="li-text">de carrera.</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(320, 100)">
    <rect class="card-bg" width="260" height="200" filter="url(#shadow)" />
    <text x="20" y="35" class="c2-title">Gobierno</text>
    <circle cx="20" cy="70" r="4" fill="#914411" />
    <text x="35" y="75" class="li-text">Necesidad de planear a</text>
    <text x="35" y="95" class="li-text">futuro y apoyar la</text>
    <text x="35" y="115" class="li-text">innovación.</text>
    <circle cx="20" cy="150" r="4" fill="#914411" />
    <text x="35" y="155" class="li-text">Apoyar los requerimientos</text>
    <text x="35" y="175" class="li-text">actuales de recursos humanos.</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(600, 100)">
    <rect class="card-bg" width="260" height="200" filter="url(#shadow)" />
    <text x="20" y="35" class="c3-title">Industria</text>
    <circle cx="20" cy="70" r="4" fill="#34508c" />
    <text x="35" y="75" class="li-text">Satisfechos con egresados</text>
    <text x="35" y="95" class="li-text">que tengan adaptabilidad</text>
    <text x="35" y="115" class="li-text">y análisis.</text>
    <circle cx="20" cy="150" r="4" fill="#34508c" />
    <text x="35" y="155" class="li-text">Solicitan habilidades</text>
    <text x="35" y="175" class="li-text">específicas para inicio rápido.</text>
  </g>

  <!-- Connection Lines (Arrows pointing down) -->
  <line x1="450" y1="310" x2="450" y2="350" stroke="#c9c5bb" stroke-width="2" />
  <polygon points="450,360 445,350 455,350" fill="#c9c5bb" />
  
  <!-- Divider -->
  <line x1="40" y1="380" x2="860" y2="380" stroke="#c9c5bb" stroke-width="2" />
  
  <text x="450" y="415" class="res-title" text-anchor="middle">HABILIDADES CLAVE RESULTANTES</text>

  <!-- Result Boxes -->
  <g transform="translate(40, 440)">
    <rect class="box-1" width="260" height="80" filter="url(#shadow)" />
    <text x="130" y="35" class="box-text-1">Para trabajos e industrias</text>
    <text x="130" y="55" class="box-text-1">que aún no existen</text>
  </g>
  
  <g transform="translate(320, 440)">
    <rect class="box-3" width="260" height="80" filter="url(#shadow)" />
    <text x="130" y="35" class="box-text-3">Transferibles entre</text>
    <text x="130" y="55" class="box-text-3">trabajos y carreras</text>
  </g>
  
  <g transform="translate(600, 440)">
    <rect class="box-2" width="260" height="80" filter="url(#shadow)" />
    <text x="130" y="35" class="box-text-2">Para trabajos específicos</text>
    <text x="130" y="55" class="box-text-2">ya demandados hoy</text>
  </g>

</svg>
