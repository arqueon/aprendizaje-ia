<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; transition: fill 0.3s; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 12; transition: fill 0.3s, stroke 0.3s; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      
      .lvl-crear { fill: #c026d3; } .lvl-evaluar { fill: #2563eb; } .lvl-analizar { fill: #0d9488; }
      .lvl-aplicar { fill: #64748b; } .lvl-entender { fill: #d97706; } .lvl-recordar { fill: #dc2626; }
      
      .lvl-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; letter-spacing: 1px; }
      
      .col-title-1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #b91c1c; text-anchor: middle; }
      .col-title-2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #047857; text-anchor: middle; }
      
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .box-title-red { fill: #b91c1c; }
      .box-title-green { fill: #047857; }
      .box-title-dark { fill: #1e293b; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      
      .red-box { fill: #fef2f2; stroke: #fecaca; rx: 8; }
      .green-box { fill: #ecfdf5; stroke: #a7f3d0; rx: 8; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .card-bg { fill: #1e293b; stroke: #334155; }
        
        .title { fill: #f1f5f9; }
        .subtitle { fill: #94a3b8; }
        .box-desc { fill: #cbd5e1; }
        
        .lvl-crear { fill: #d946ef; } .lvl-evaluar { fill: #3b82f6; } .lvl-analizar { fill: #14b8a6; }
        .lvl-aplicar { fill: #94a3b8; } .lvl-entender { fill: #f59e0b; } .lvl-recordar { fill: #ef4444; }
        
        .col-title-1 { fill: #f87171; }
        .col-title-2 { fill: #34d399; }
        
        .box-title-red { fill: #fca5a5; }
        .box-title-green { fill: #6ee7b7; }
        .box-title-dark { fill: #f1f5f9; }
        
        .red-box { fill: #450a0a; stroke: #7f1d1d; }
        .green-box { fill: #064e3b; stroke: #065f46; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect class="bg" width="1000" height="600" rx="16" />
  
  <text x="500" y="55" class="title" text-anchor="middle">Taxonomía de Bloom en Modelos de Aprendizaje</text>
  <text x="500" y="75" class="subtitle" text-anchor="middle">Comparativa de distribución del tiempo de clase</text>

  <!-- Left Column: Traditional -->
  <g transform="translate(40, 120)">
    <rect class="card-bg" width="280" height="420" filter="url(#shadow)" />
    <text x="140" y="40" class="col-title-1">Modelo Tradicional</text>
    
    <rect class="red-box" x="20" y="70" width="240" height="150" />
    <text x="140" y="100" class="box-title box-title-red" text-anchor="middle">Fuera del aula</text>
    <text x="140" y="130" class="box-title box-title-dark" text-anchor="middle">Crear, Evaluar, Analizar, Aplicar</text>
    <text x="140" y="160" class="box-desc" text-anchor="middle">El estudiante intenta los niveles</text>
    <text x="140" y="180" class="box-desc" text-anchor="middle">difíciles en solitario como tarea.</text>

    <rect class="red-box" x="20" y="240" width="240" height="150" />
    <text x="140" y="270" class="box-title box-title-red" text-anchor="middle">Durante la clase</text>
    <text x="140" y="300" class="box-title box-title-dark" text-anchor="middle">Recordar, Entender</text>
    <text x="140" y="330" class="box-desc" text-anchor="middle">Tiempo presencial dedicado a</text>
    <text x="140" y="350" class="box-desc" text-anchor="middle">transmisión pasiva de información.</text>
  </g>

  <!-- Center: Pyramid -->
  <g transform="translate(500, 330)">
    <!-- Instead of precise paths, using stacked centered rectangles varying in width to look modern -->
    <rect x="-80" y="-190" width="160" height="40" rx="8" class="lvl-crear" filter="url(#shadow)" />
    <text x="0" y="-164" class="lvl-text">Crear</text>
    
    <rect x="-105" y="-140" width="210" height="40" rx="8" class="lvl-evaluar" filter="url(#shadow)" />
    <text x="0" y="-114" class="lvl-text">Evaluar</text>
    
    <rect x="-130" y="-90" width="260" height="40" rx="8" class="lvl-analizar" filter="url(#shadow)" />
    <text x="0" y="-64" class="lvl-text">Analizar</text>
    
    <rect x="-155" y="-40" width="310" height="40" rx="8" class="lvl-aplicar" filter="url(#shadow)" />
    <text x="0" y="-14" class="lvl-text">Aplicar</text>
    
    <rect x="-180" y="10" width="360" height="40" rx="8" class="lvl-entender" filter="url(#shadow)" />
    <text x="0" y="36" class="lvl-text">Entender</text>
    
    <rect x="-205" y="60" width="410" height="40" rx="8" class="lvl-recordar" filter="url(#shadow)" />
    <text x="0" y="86" class="lvl-text">Recordar</text>
    
    <!-- Dotted lines linking to boxes -->
    <line x1="-160" y1="-170" x2="-220" y2="-170" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4" />
    <line x1="-205" y1="80" x2="-220" y2="80" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4" />
    
    <line x1="160" y1="-170" x2="220" y2="-170" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4" />
    <line x1="205" y1="80" x2="220" y2="80" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4" />
  </g>

  <!-- Right Column: Flipped -->
  <g transform="translate(680, 120)">
    <rect class="card-bg" width="280" height="420" filter="url(#shadow)" />
    <text x="140" y="40" class="col-title-2">Modelo Invertido y Activo</text>
    
    <rect class="green-box" x="20" y="70" width="240" height="150" />
    <text x="140" y="100" class="box-title box-title-green" text-anchor="middle">Durante la clase</text>
    <text x="140" y="130" class="box-title box-title-dark" text-anchor="middle">Crear, Evaluar, Analizar, Aplicar</text>
    <text x="140" y="160" class="box-desc" text-anchor="middle">Trabajo activo en equipo y resolución</text>
    <text x="140" y="180" class="box-desc" text-anchor="middle">de problemas guiado por el docente.</text>

    <rect class="green-box" x="20" y="240" width="240" height="150" />
    <text x="140" y="270" class="box-title box-title-green" text-anchor="middle">Antes del aula (En línea)</text>
    <text x="140" y="300" class="box-title box-title-dark" text-anchor="middle">Recordar, Entender</text>
    <text x="140" y="330" class="box-desc" text-anchor="middle">Los estudiantes revisan videos e</text>
    <text x="140" y="350" class="box-desc" text-anchor="middle">instrucciones de manera autónoma.</text>
  </g>

</svg>
