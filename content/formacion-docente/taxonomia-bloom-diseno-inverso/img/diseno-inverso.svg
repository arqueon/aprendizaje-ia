<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f3ee; }
      .card-bg { fill: #ffffff; stroke: #c9c5bb; stroke-width: 1; rx: 12; }
      
      .title { font-family: "Piazzolla", Georgia, "Times New Roman", serif; font-size: 24px; font-weight: bold; fill: #18223c; }
      .subtitle { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #525d70; }
      
      .step-pill-1 { fill: #f7e5e2; rx: 12; } .step-txt-1 { fill: #7f1820; font-weight: bold; font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 12px; }
      .step-pill-2 { fill: #eceddc; rx: 12; } .step-txt-2 { fill: #3f4b1d; font-weight: bold; font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 12px; }
      .step-pill-3 { fill: #f4e6d8; rx: 12; } .step-txt-3 { fill: #78380f; font-weight: bold; font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 12px; }
      
      .card-title { font-family: "Piazzolla", Georgia, serif; font-size: 16px; font-weight: bold; fill: #18223c; }
      .card-desc { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #34405a; }

    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18223c" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect class="bg" width="900" height="350" rx="16" />
  
  <text x="450" y="55" class="title" text-anchor="middle">Etapas del Diseño Inverso (Backward Design)</text>
  <text x="450" y="75" class="subtitle" text-anchor="middle">Planificación de atrás hacia adelante para asegurar coherencia formativa</text>

  <!-- Flow Arrows (Background) -->
  <path d="M 290 200 L 340 200" stroke="#c9c5bb" stroke-width="3" stroke-dasharray="6" fill="none" />
  <polygon points="345,200 335,195 335,205" fill="#c9c5bb" />
  
  <path d="M 570 200 L 620 200" stroke="#c9c5bb" stroke-width="3" stroke-dasharray="6" fill="none" />
  <polygon points="625,200 615,195 615,205" fill="#c9c5bb" />

  <!-- Step 1 -->
  <g transform="translate(40, 110)">
    <rect class="card-bg" width="250" height="180" filter="url(#shadow)" />
    <rect class="step-pill-1" x="20" y="20" width="60" height="24" />
    <text x="50" y="36" class="step-txt-1" text-anchor="middle">Paso 1</text>
    
    <text x="20" y="75" class="card-title">Identificar</text>
    <text x="20" y="95" class="card-title">Resultados Deseados</text>
    
    <text x="20" y="125" class="card-desc">Definir los objetivos de</text>
    <text x="20" y="145" class="card-desc">aprendizaje: qué deben saber</text>
    <text x="20" y="165" class="card-desc">y saber hacer los estudiantes.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(320, 110)">
    <rect class="card-bg" width="250" height="180" filter="url(#shadow)" />
    <rect class="step-pill-2" x="20" y="20" width="60" height="24" />
    <text x="50" y="36" class="step-txt-2" text-anchor="middle">Paso 2</text>
    
    <text x="20" y="75" class="card-title">Determinar Evidencia</text>
    <text x="20" y="95" class="card-title">Aceptable</text>
    
    <text x="20" y="125" class="card-desc">Establecer formas de evaluación</text>
    <text x="20" y="145" class="card-desc">y rúbricas antes de planear</text>
    <text x="20" y="165" class="card-desc">las actividades y clases.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(600, 110)">
    <rect class="card-bg" width="250" height="180" filter="url(#shadow)" />
    <rect class="step-pill-3" x="20" y="20" width="60" height="24" />
    <text x="50" y="36" class="step-txt-3" text-anchor="middle">Paso 3</text>
    
    <text x="20" y="75" class="card-title">Planear Experiencias</text>
    <text x="20" y="95" class="card-title">de Aprendizaje</text>
    
    <text x="20" y="125" class="card-desc">Diseñar lecturas, secuencias</text>
    <text x="20" y="145" class="card-desc">y actividades prácticas que</text>
    <text x="20" y="165" class="card-desc">faciliten el logro del objetivo.</text>
  </g>

  <text x="850" y="330" class="subtitle" text-anchor="end" font-size="11px">Adaptado de: Wiggins &amp; McTighe (2005)</text>
</svg>
