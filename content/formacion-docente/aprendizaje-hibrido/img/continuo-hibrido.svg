<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; transition: fill 0.3s; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 12; transition: fill 0.3s, stroke 0.3s; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #94a3b8; letter-spacing: 2px; }
      .axis-line { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 6; }
      .q-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; }
      .q-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .q-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      
      .icon-bg-1 { fill: #dbeafe; rx: 8; } .icon-fg-1 { fill: #2563eb; } .text-1 { fill: #2563eb; }
      .icon-bg-2 { fill: #ccfbf1; rx: 8; } .icon-fg-2 { fill: #0d9488; } .text-2 { fill: #0d9488; }
      .icon-bg-3 { fill: #ffedd5; rx: 8; } .icon-fg-3 { fill: #d97706; } .text-3 { fill: #d97706; }
      .icon-bg-4 { fill: #f3e8ff; rx: 8; } .icon-fg-4 { fill: #9333ea; } .text-4 { fill: #9333ea; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .card-bg { fill: #1e293b; stroke: #334155; }
        .title { fill: #f1f5f9; }
        .subtitle { fill: #94a3b8; }
        .axis-text { fill: #475569; }
        .axis-line { stroke: #334155; }
        .q-title { fill: #f1f5f9; }
        .q-text { fill: #cbd5e1; }
        
        .icon-bg-1 { fill: #1e3a8a; } .icon-fg-1 { fill: #60a5fa; } .text-1 { fill: #60a5fa; }
        .icon-bg-2 { fill: #134e4a; } .icon-fg-2 { fill: #2dd4bf; } .text-2 { fill: #2dd4bf; }
        .icon-bg-3 { fill: #78350f; } .icon-fg-3 { fill: #fbbf24; } .text-3 { fill: #fbbf24; }
        .icon-bg-4 { fill: #581c87; } .icon-fg-4 { fill: #c084fc; } .text-4 { fill: #c084fc; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect class="bg" width="800" height="500" rx="16" />

  <text x="400" y="45" class="title" text-anchor="middle">El Continuo del Aprendizaje Híbrido</text>
  <text x="400" y="65" class="subtitle" text-anchor="middle">Interacción cruzada entre temporalidad y espacialidad</text>

  <!-- Axes -->
  <line x1="400" y1="120" x2="400" y2="460" class="axis-line" />
  <line x1="60" y1="290" x2="740" y2="290" class="axis-line" />
  
  <text x="400" y="110" class="axis-text" text-anchor="middle">SINCRÓNICO</text>
  <text x="400" y="480" class="axis-text" text-anchor="middle">ASINCRÓNICO</text>
  
  <text x="30" y="295" class="axis-text" text-anchor="middle" transform="rotate(-90 30,295)">EN LÍNEA</text>
  <text x="770" y="295" class="axis-text" text-anchor="middle" transform="rotate(90 770,295)">PRESENCIAL</text>

  <!-- Quadrant 1 (Top Left): Sincronico En Linea -->
  <g transform="translate(60, 130)">
    <rect class="card-bg" width="320" height="140" filter="url(#shadow)" />
    <rect class="icon-bg-1" x="20" y="20" width="40" height="40" />
    <circle cx="40" cy="40" r="10" class="icon-fg-1" />
    <polygon points="50,40 56,34 56,46" class="icon-fg-1" />
    
    <text x="75" y="45" class="q-title">Videoconferencias</text>
    <text x="20" y="80" class="q-subtitle text-1">Sincrónico + En Línea</text>
    <text x="20" y="100" class="q-text">Clases virtuales en tiempo real a</text>
    <text x="20" y="120" class="q-text">través de Meet, Webex o Zoom.</text>
  </g>

  <!-- Quadrant 3 (Top Right): Sincronico Presencial -->
  <g transform="translate(420, 130)">
    <rect class="card-bg" width="320" height="140" filter="url(#shadow)" />
    <rect class="icon-bg-3" x="20" y="20" width="40" height="40" />
    <rect x="28" y="28" width="24" height="16" class="icon-fg-3" rx="2" />
    <rect x="36" y="44" width="8" height="6" class="icon-fg-3" />
    
    <text x="75" y="45" class="q-title">Clases Tradicionales</text>
    <text x="20" y="80" class="q-subtitle text-3">Sincrónico + Presencial</text>
    <text x="20" y="100" class="q-text">Sesiones cara a cara en el aula física,</text>
    <text x="20" y="120" class="q-text">generalmente magistrales.</text>
  </g>

  <!-- Quadrant 2 (Bottom Left): Asincronico En Linea -->
  <g transform="translate(60, 310)">
    <rect class="card-bg" width="320" height="140" filter="url(#shadow)" />
    <rect class="icon-bg-2" x="20" y="20" width="40" height="40" />
    <rect x="28" y="32" width="24" height="16" class="icon-fg-2" rx="2" />
    <path d="M30 32 L40 24 L50 32" fill="none" stroke="currentColor" class="icon-fg-2" stroke-width="2" />
    
    <text x="75" y="45" class="q-title">E-learning Asincrónico</text>
    <text x="20" y="80" class="q-subtitle text-2">Asincrónico + En Línea</text>
    <text x="20" y="100" class="q-text">Trabajo autónomo en plataformas:</text>
    <text x="20" y="120" class="q-text">foros, tareas y videos grabados.</text>
  </g>

  <!-- Quadrant 4 (Bottom Right): Asincronico Presencial -->
  <g transform="translate(420, 310)">
    <rect class="card-bg" width="320" height="140" filter="url(#shadow)" />
    <rect class="icon-bg-4" x="20" y="20" width="40" height="40" />
    <path d="M32 44 L32 30 L36 28 L44 28 L48 30 L48 44 Z" class="icon-fg-4" />
    <path d="M28 44 L52 44 L52 48 L28 48 Z" class="icon-fg-4" />
    
    <text x="75" y="45" class="q-title">Prácticas Flexibles</text>
    <text x="20" y="80" class="q-subtitle text-4">Asincrónico + Presencial</text>
    <text x="20" y="100" class="q-text">Laboratorios, talleres o trabajo</text>
    <text x="20" y="120" class="q-text">en equipo en el espacio físico.</text>
  </g>
</svg>
