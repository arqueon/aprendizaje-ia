<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cada momento usa y transforma lo anterior</title>
  <desc id="desc">Tres momentos conectados. Antes se intenta y se produce un borrador con preguntas. Durante el encuentro se contrasta ese borrador y se producen criterios y objeciones. Después se revisa y explica, produciendo una versión final con razones. Si las personas no coinciden en horario, un contraste diferido conserva la misma decisión y evidencia.</desc>
  <style>
    .bg{fill:#f7f2e8}.ink{fill:#1d2a42}.muted{fill:#526078}.paper{fill:#fffaf1;stroke:#b9ad98;stroke-width:3}.red{fill:#a8202a}.olive{fill:#536326}.ochre{fill:#914411}.line{fill:none;stroke:#536326;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#a8202a;stroke-width:4;stroke-dasharray:10 11}.t1{font:700 54px Lora,Georgia,serif}.t2{font:700 34px Lora,Georgia,serif}.t3{font:700 28px Inter,Arial,sans-serif}.body{font:400 25px Inter,Arial,sans-serif}.small{font:600 21px Inter,Arial,sans-serif}.white{fill:#fffaf1}
  </style>
  <rect class="bg" width="1600" height="900"/>
  <text class="ink t1" x="800" y="82" text-anchor="middle">Cada momento usa y transforma lo anterior</text>
  <text class="muted body" x="800" y="126" text-anchor="middle">Una secuencia híbrida conecta productos y decisiones; no solo reparte materiales.</text>

  <g transform="translate(90 208)">
    <rect class="paper" width="390" height="390" rx="28"/>
    <circle class="red" cx="70" cy="70" r="36"/>
    <path d="M54 70h32M70 54v32" stroke="#fffaf1" stroke-width="6" stroke-linecap="round"/>
    <text class="ink t2" x="124" y="80">Antes</text>
    <text class="red t3" x="46" y="150">Intentar</text>
    <text class="ink body" x="46" y="204">La persona formula una</text>
    <text class="ink body" x="46" y="240">primera explicación.</text>
    <line x1="46" x2="344" y1="280" y2="280" stroke="#d5c8b2" stroke-width="3"/>
    <text class="olive small" x="46" y="324">Produce</text>
    <text class="ink body" x="46" y="360">Borrador y preguntas</text>
  </g>

  <g transform="translate(605 208)">
    <rect class="paper" width="390" height="390" rx="28"/>
    <circle class="olive" cx="70" cy="70" r="36"/>
    <path d="M51 64h38M51 76h26" stroke="#fffaf1" stroke-width="6" stroke-linecap="round"/>
    <text class="ink t2" x="124" y="80">Encuentro</text>
    <text class="olive t3" x="46" y="150">Contrastar</text>
    <text class="ink body" x="46" y="204">Se comparan razones,</text>
    <text class="ink body" x="46" y="240">fuentes y alternativas.</text>
    <line x1="46" x2="344" y1="280" y2="280" stroke="#d5c8b2" stroke-width="3"/>
    <text class="olive small" x="46" y="324">Produce</text>
    <text class="ink body" x="46" y="360">Criterios y objeciones</text>
  </g>

  <g transform="translate(1120 208)">
    <rect class="paper" width="390" height="390" rx="28"/>
    <circle class="ochre" cx="70" cy="70" r="36"/>
    <path d="M52 72l12 12 26-30" fill="none" stroke="#fffaf1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ink t2" x="124" y="80">Después</text>
    <text class="ochre t3" x="46" y="150">Revisar y explicar</text>
    <text class="ink body" x="46" y="204">La persona transforma el</text>
    <text class="ink body" x="46" y="240">borrador y justifica.</text>
    <line x1="46" x2="344" y1="280" y2="280" stroke="#d5c8b2" stroke-width="3"/>
    <text class="olive small" x="46" y="324">Produce</text>
    <text class="ink body" x="46" y="360">Versión y razones</text>
  </g>

  <path class="line" d="M480 404h105"/>
  <path class="olive" d="M585 404l-24-16v32z"/>
  <path class="line" d="M995 404h105"/>
  <path class="olive" d="M1100 404l-24-16v32z"/>
  <text class="olive small" x="532" y="375" text-anchor="middle">lleva el borrador</text>
  <text class="olive small" x="1048" y="375" text-anchor="middle">lleva decisiones</text>

  <g transform="translate(190 676)">
    <rect x="0" y="0" width="1220" height="132" rx="24" fill="#efe7d7" stroke="#a8202a" stroke-width="3"/>
    <path class="dash" d="M42 72h140"/>
    <text class="red t3" x="214" y="43">Si las personas no coinciden en horario</text>
    <text class="ink body" x="214" y="78">El contraste puede realizarse de manera diferida;</text>
    <text class="ink body" x="214" y="108">conserva la misma decisión y evidencia.</text>
  </g>
</svg>
