<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Las tres literacidades de la alfabetización en IA</title>
  <desc id="desc">Versión vertical de las tres literacidades acumulativas de la alfabetización en IA, de arriba
    hacia abajo: la operativa (usar) enseña a formular instrucciones claras, iterar con la IA e integrarla al
    flujo de trabajo, con Bloom en recordar, comprender y aplicar y el módulo M1; la crítica (entender) enseña
    a reconocer sesgos, errores e invenciones en lo que la IA devuelve y a verificarlo, con Bloom en analizar y
    evaluar y los módulos M1 y M2; la de co-creación (dirigir) enseña a decidir qué preguntar, qué aceptar, qué
    descartar y cuándo no usar la IA, con Bloom en crear y los módulos M3, M4 y M6. Cada nivel supone el
    anterior. El módulo M5 adapta las tres a cada disciplina y la evaluación del proceso hace visible la
    progresión.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .f-good, .good { fill:#b9c47a; }
      .f-risk, .risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#d49a55; } .st-axis { stroke:#eceee9; }
    }
  </style>
  <defs>
    <marker id="litArrowM" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="f-ink"/>
    </marker>
  </defs>
  <rect class="fig-canvas" x="0" y="0" width="420" height="1010"/>

  <g class="tk-font">
    <text x="210" y="36" text-anchor="middle" font-size="19" font-weight="bold" class="f-ink">Tres literacidades acumulativas</text>
    <text x="210" y="60" text-anchor="middle" font-size="14" class="f-muted">Cada nivel conserva el anterior y añade</text>
    <text x="210" y="80" text-anchor="middle" font-size="14" class="f-muted">una forma de juicio más exigente.</text>

    <!-- 1 · Operativa -->
    <g transform="translate(25 104)">
      <rect width="370" height="216" rx="5" class="bg-neutral st-axis" stroke-width="1.6"/>
      <text x="24" y="36" font-size="19" font-weight="bold" class="f-ink">1 · Operativa</text>
      <text x="346" y="36" text-anchor="end" font-size="14" class="f-muted">Usar</text>
      <text x="24" y="66" font-size="12.5" font-weight="bold" class="f-primary">Qué desarrolla</text>
      <text x="24" y="88" font-size="15" class="f-ink">Formular instrucciones claras, iterar</text>
      <text x="24" y="110" font-size="15" class="f-ink">con la IA e integrarla al flujo de trabajo.</text>
      <text x="24" y="140" font-size="12.5" font-weight="bold" class="f-primary">Cómo se construye</text>
      <text x="24" y="162" font-size="15" class="f-muted">Práctica guiada con ejemplos de la disciplina.</text>
      <rect x="24" y="176" width="322" height="28" rx="3" class="bg-primary st-primary" stroke-width="1"/>
      <text x="185" y="195" text-anchor="middle" font-size="13" class="f-primary">Bloom · recordar, comprender, aplicar · Módulo M1</text>
    </g>

    <line x1="210" y1="322" x2="210" y2="350" class="st-axis" stroke-width="1.6" marker-end="url(#litArrowM)"/>
    <text x="232" y="341" font-size="12" class="f-muted">supone la anterior</text>

    <!-- 2 · Crítica -->
    <g transform="translate(25 356)">
      <rect width="370" height="216" rx="5" class="bg-warn st-warn" stroke-width="1.6"/>
      <text x="24" y="36" font-size="19" font-weight="bold" class="f-ink">2 · Crítica</text>
      <text x="346" y="36" text-anchor="end" font-size="14" class="f-muted">Entender</text>
      <text x="24" y="66" font-size="12.5" font-weight="bold" class="f-primary">Qué desarrolla</text>
      <text x="24" y="88" font-size="15" class="f-ink">Reconocer sesgos, errores e invenciones</text>
      <text x="24" y="110" font-size="15" class="f-ink">en lo que la IA devuelve, y verificarlo.</text>
      <text x="24" y="140" font-size="12.5" font-weight="bold" class="f-primary">Cómo se construye</text>
      <text x="24" y="162" font-size="15" class="f-muted">Lectura lateral, contraste y análisis del sesgo.</text>
      <rect x="24" y="176" width="322" height="28" rx="3" class="bg-primary st-primary" stroke-width="1"/>
      <text x="185" y="195" text-anchor="middle" font-size="13" class="f-primary">Bloom · analizar y evaluar · Módulos M1 y M2</text>
    </g>

    <line x1="210" y1="574" x2="210" y2="602" class="st-axis" stroke-width="1.6" marker-end="url(#litArrowM)"/>
    <text x="232" y="593" font-size="12" class="f-muted">supone las anteriores</text>

    <!-- 3 · Co-creación -->
    <g transform="translate(25 608)">
      <rect width="370" height="216" rx="5" class="bg-good st-good" stroke-width="1.8"/>
      <text x="24" y="36" font-size="19" font-weight="bold" class="f-good">3 · Co-creación</text>
      <text x="346" y="36" text-anchor="end" font-size="14" class="f-muted">Dirigir</text>
      <text x="24" y="66" font-size="12.5" font-weight="bold" class="f-primary">Qué desarrolla</text>
      <text x="24" y="88" font-size="15" class="f-ink">Decidir qué preguntar, qué aceptar,</text>
      <text x="24" y="110" font-size="15" class="f-ink">qué descartar y cuándo no usar la IA.</text>
      <text x="24" y="140" font-size="12.5" font-weight="bold" class="f-primary">Cómo se construye</text>
      <text x="24" y="162" font-size="15" class="f-muted">Formular, evaluar, descartar, reformular, documentar.</text>
      <rect x="24" y="176" width="322" height="28" rx="3" class="bg-primary st-primary" stroke-width="1"/>
      <text x="185" y="195" text-anchor="middle" font-size="13" font-weight="bold" class="f-primary">Bloom · crear · Módulos M3, M4 y M6</text>
    </g>

    <text x="210" y="866" text-anchor="middle" font-size="14" class="f-muted">De usar herramientas a dirigir el propio trabajo con IA.</text>

    <rect x="25" y="888" width="370" height="96" rx="5" class="bg-primary st-primary" stroke-width="1.3"/>
    <text x="210" y="918" text-anchor="middle" font-size="14.5" font-weight="bold" class="f-primary">El módulo M5 adapta las tres literacidades</text>
    <text x="210" y="940" text-anchor="middle" font-size="14.5" font-weight="bold" class="f-primary">a cada disciplina.</text>
    <text x="210" y="966" text-anchor="middle" font-size="13.5" class="f-primary">La evaluación del proceso hace visible la progresión.</text>
  </g>
</svg>
