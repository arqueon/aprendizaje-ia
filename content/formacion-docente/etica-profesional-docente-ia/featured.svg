  <g fill="#68762f" fill-opacity="0.18" stroke="#8b9a4a" stroke-opacity="0.45" stroke-width="2">
    <rect x="700" y="130" width="150" height="130" rx="8"/>
    <rect x="890" y="130" width="150" height="130" rx="8"/>
    <rect x="700" y="300" width="150" height="130" rx="8"/>
    <rect x="890" y="300" width="150" height="130" rx="8"/>
  </g>
  <g stroke="#c6d093" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round">
    <line x1="722" y1="165" x2="828" y2="165"/><line x1="722" y1="190" x2="815" y2="190"/>
    <line x1="912" y1="165" x2="1018" y2="165"/><line x1="912" y1="190" x2="1005" y2="190"/>
    <line x1="722" y1="335" x2="828" y2="335"/><line x1="722" y1="360" x2="815" y2="360"/>
    <line x1="912" y1="335" x2="1018" y2="335"/><line x1="912" y1="360" x2="1005" y2="360"/>
  </g>
  <g fill="#aab86a" fill-opacity="0.5">
