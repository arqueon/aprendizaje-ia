  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#aab86a" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- documento del docente, con su línea de declaración -->
  <g fill="#68762f" fill-opacity="0.28" stroke="#8b9a4a" stroke-opacity="0.6" stroke-width="2.5">
    <rect x="200" y="140" width="300" height="350" rx="10"/>
  </g>
  <g stroke="#c6d093" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round">
