<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" role="img" aria-labelledby="titulo desc">
  <title id="titulo">ICAP: qué hizo la persona con las ideas, con el mismo caso en sus cuatro modos</title>
  <desc id="desc">Versión vertical. El mismo caso, comentar un texto en clase, en los cuatro modos de ICAP, sin escalera: pasivo, recibe (lee los comentarios de otros; producto visible, ninguno o un recuerdo), activo, ordena (clasifica los comentarios por tema; una lista o un esquema), constructivo, genera (escribe una objeción propia con su razón; una idea que no estaba), interactivo, construye con otros (responde a un comentario ajeno y llegan a una versión común; una explicación que ninguno tenía). La misma herramienta sirve para las cuatro; lo que las distingue es el producto.</desc>
  <style>
    .fig-canvas{fill:var(--udg-c-surface-alt,#ece9e1)}
    .paper{fill:var(--udg-c-surface,#ffffff);stroke:var(--udg-c-line,#c9c5bb);stroke-width:1.5}
    .ink{fill:var(--udg-c-ink,#18223c)}.muted{fill:var(--udg-c-muted,#525d70)}
    .good{fill:var(--udg-c-good,#536326)}.good-tint{fill:var(--udg-c-good-tint,#eceddc)}
    .st-line{fill:none;stroke:var(--udg-c-line,#c9c5bb);stroke-width:1.5;stroke-dasharray:4 5}
    .t1{font:600 21px Newsreader,Georgia,serif}.t2{font:700 13px "Archivo Narrow","Arial Narrow",sans-serif;letter-spacing:1.2px}
    .t3{font:600 15px Newsreader,Georgia,serif}.body{font:400 14px Inter,Arial,sans-serif}.small{font:600 12.5px Inter,Arial,sans-serif}
  </style>
  <rect class="fig-canvas" width="420" height="860"/>
  <text class="ink t1" x="210" y="36" text-anchor="middle">ICAP: qué hizo con las ideas</text>
  <text class="muted body" x="210" y="58" text-anchor="middle">El mismo caso en los cuatro modos; no es una escalera.</text>
  <g transform="translate(24 80)">
    <rect class="paper" width="372" height="126" rx="9"/><rect class="good-tint" width="372" height="30" rx="9"/><rect class="good-tint" y="18" width="372" height="12"/>
    <text class="good t2" x="14" y="20">P · PASIVO</text>
    <text class="ink t3" x="14" y="56">Recibe: lee los comentarios de otros.</text>
    <text class="muted small" x="14" y="84">PRODUCTO VISIBLE</text>
    <text class="ink body" x="14" y="106">Ninguno, o lo que recuerda después.</text>
  </g>
  <g transform="translate(24 220)">
    <rect class="paper" width="372" height="126" rx="9"/><rect class="good-tint" width="372" height="30" rx="9"/><rect class="good-tint" y="18" width="372" height="12"/>
    <text class="good t2" x="14" y="20">A · ACTIVO</text>
    <text class="ink t3" x="14" y="56">Ordena: clasifica los comentarios por tema.</text>
    <text class="muted small" x="14" y="84">PRODUCTO VISIBLE</text>
    <text class="ink body" x="14" y="106">Una lista o un esquema con lo que ya estaba.</text>
  </g>
  <g transform="translate(24 360)">
    <rect class="paper" width="372" height="146" rx="9"/><rect class="good-tint" width="372" height="30" rx="9"/><rect class="good-tint" y="18" width="372" height="12"/>
    <text class="good t2" x="14" y="20">C · CONSTRUCTIVO</text>
    <text class="ink t3" x="14" y="56">Genera: una objeción propia con su razón.</text>
    <text class="muted small" x="14" y="84">PRODUCTO VISIBLE</text>
    <text class="ink body" x="14" y="106">Una idea que no estaba en el texto</text>
    <text class="ink body" x="14" y="126">ni en los comentarios.</text>
  </g>
  <g transform="translate(24 520)">
    <rect class="paper" width="372" height="166" rx="9"/><rect class="good-tint" width="372" height="30" rx="9"/><rect class="good-tint" y="18" width="372" height="12"/>
    <text class="good t2" x="14" y="20">I · INTERACTIVO</text>
    <text class="ink t3" x="14" y="56">Construye con otros: responde a otro</text>
    <text class="ink t3" x="14" y="76">y llegan a una versión común.</text>
    <text class="muted small" x="14" y="104">PRODUCTO VISIBLE</text>
    <text class="ink body" x="14" y="126">Una explicación que ninguno de los dos</text>
    <text class="ink body" x="14" y="146">tenía antes.</text>
  </g>
  <path class="st-line" d="M24 714h372"/>
  <text class="good small" x="24" y="744">EVIDENCIA · la misma herramienta sirve para los cuatro modos.</text>
  <text class="muted body" x="24" y="774">Lo que las distingue es el producto: sin producto</text>
  <text class="muted body" x="24" y="794">no se sabe qué hizo la persona con las ideas.</text>
</svg>
