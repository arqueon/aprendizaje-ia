<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f3ee; }
      .header-bg { fill: #ece9e1; }
      .row-bg-1 { fill: #ffffff; }
      .row-bg-2 { fill: #f5f3ee; }
      .border { stroke: #c9c5bb; stroke-width: 1; }
      
      .title { font-family: "Piazzolla", Georgia, "Times New Roman", serif; font-size: 22px; font-weight: bold; fill: #18223c; }
      .subtitle { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #525d70; }
      .th-text { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #18223c; }
      .td-bold { font-family: "Piazzolla", Georgia, serif; font-size: 16px; font-weight: bold; fill: #18223c; }
      .td-text { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #34405a; }
      
      .cat-mejor { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 16px; fill: #536326; font-weight: bold; }
      .cat-trans { font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; font-size: 16px; fill: #b12028; font-weight: bold; }
      
      .pill-bg-mejor { fill: #eceddc; rx: 12; } .pill-txt-mejor { fill: #3f4b1d; font-size: 12px; font-weight: bold; font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; }
      .pill-bg-trans { fill: #f7e5e2; rx: 12; } .pill-txt-trans { fill: #7f1820; font-size: 12px; font-weight: bold; font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif; }

    </style>
  </defs>

  <rect class="bg" width="900" height="450" rx="16" />
  
  <text x="450" y="45" class="title" text-anchor="middle">Modelo SAMR y Taxonomía de Bloom</text>
  <text x="450" y="65" class="subtitle" text-anchor="middle">Correspondencia de niveles para la integración tecnológica</text>

  <!-- Table -->
  <g transform="translate(40, 100)">
    <!-- Header -->
    <rect class="header-bg border" x="0" y="0" width="820" height="40" rx="4" />
    <text x="20" y="25" class="th-text">Categoría</text>
    <text x="220" y="25" class="th-text">Nivel SAMR</text>
    <text x="520" y="25" class="th-text">Niveles de Bloom Asociados</text>
    
    <!-- Row 1: Sustitución -->
    <rect class="row-bg-1 border" x="0" y="40" width="820" height="60" />
    <text x="20" y="75" class="cat-mejor">Mejora</text>
    <text x="220" y="65" class="td-bold">S — Sustitución</text>
    <text x="220" y="85" class="td-text">Sustitución directa tradicional sin cambio funcional.</text>
    
    <rect class="pill-bg-mejor" x="520" y="55" width="85" height="24" />
    <text x="562" y="72" class="pill-txt-mejor" text-anchor="middle">Recordar</text>
    
    <rect class="pill-bg-mejor" x="615" y="55" width="85" height="24" />
    <text x="657" y="72" class="pill-txt-mejor" text-anchor="middle">Entender</text>

    <!-- Row 2: Aumento -->
    <rect class="row-bg-2 border" x="0" y="100" width="820" height="60" />
    <text x="20" y="135" class="cat-mejor">Mejora</text>
    <text x="220" y="125" class="td-bold">A — Aumento</text>
    <text x="220" y="145" class="td-text">Sustitución con mejoras funcionales en el aprendizaje.</text>
    
    <rect class="pill-bg-mejor" x="520" y="115" width="85" height="24" />
    <text x="562" y="132" class="pill-txt-mejor" text-anchor="middle">Aplicar</text>

    <!-- Row 3: Modificación -->
    <rect class="row-bg-1 border" x="0" y="160" width="820" height="60" />
    <text x="20" y="195" class="cat-trans">Transformación</text>
    <text x="220" y="185" class="td-bold">M — Modificación</text>
    <text x="220" y="205" class="td-text">Rediseño significativo de las actividades.</text>
    
    <rect class="pill-bg-trans" x="520" y="175" width="85" height="24" />
    <text x="562" y="192" class="pill-txt-trans" text-anchor="middle">Analizar</text>

    <!-- Row 4: Redefinición -->
    <rect class="row-bg-2 border" x="0" y="220" width="820" height="60" />
    <text x="20" y="255" class="cat-trans">Transformación</text>
    <text x="220" y="245" class="td-bold">R — Redefinición</text>
    <text x="220" y="265" class="td-text">Creación de actividades previamente imposibles.</text>
    
    <rect class="pill-bg-trans" x="520" y="235" width="85" height="24" />
    <text x="562" y="252" class="pill-txt-trans" text-anchor="middle">Evaluar</text>
    
    <rect class="pill-bg-trans" x="615" y="235" width="85" height="24" />
    <text x="657" y="252" class="pill-txt-trans" text-anchor="middle">Crear</text>
  </g>

</svg>
