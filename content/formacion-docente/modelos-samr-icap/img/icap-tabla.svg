<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; transition: fill 0.3s; }
      .header-bg { fill: #f1f5f9; }
      .row-bg-1 { fill: #ffffff; }
      .row-bg-2 { fill: #f8fafc; }
      .border { stroke: #e2e8f0; stroke-width: 1; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      
      .th-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #334155; }
      .td-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      
      .cat-i { fill: #db2777; font-weight: bold; font-family: sans-serif; font-size: 15px; }
      .cat-c { fill: #7c3aed; font-weight: bold; font-family: sans-serif; font-size: 15px; }
      .cat-a { fill: #2563eb; font-weight: bold; font-family: sans-serif; font-size: 15px; }
      .cat-p { fill: #475569; font-weight: bold; font-family: sans-serif; font-size: 15px; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .header-bg { fill: #1e293b; }
        .row-bg-1 { fill: #0f172a; }
        .row-bg-2 { fill: #1e293b; }
        .border { stroke: #334155; }
        
        .title { fill: #f1f5f9; }
        .subtitle { fill: #94a3b8; }
        .th-text { fill: #cbd5e1; }
        .td-text { fill: #94a3b8; }
        
        .cat-i { fill: #f472b6; }
        .cat-c { fill: #a78bfa; }
        .cat-a { fill: #60a5fa; }
        .cat-p { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect class="bg" width="1000" height="450" rx="16" />
  
  <text x="500" y="45" class="title" text-anchor="middle">Modelo ICAP</text>
  <text x="500" y="65" class="subtitle" text-anchor="middle">Niveles de compromiso cognitivo y resultados de aprendizaje</text>

  <!-- Table -->
  <g transform="translate(40, 100)">
    <!-- Header -->
    <rect class="header-bg border" x="0" y="0" width="920" height="40" rx="4" />
    <text x="20" y="25" class="th-text">Modo de Involucramiento</text>
    <text x="240" y="25" class="th-text">Proceso Cognitivo</text>
    <text x="520" y="25" class="th-text">Cambio en el Conocimiento</text>
    <text x="740" y="25" class="th-text">Ejemplos Prácticos</text>
    
    <!-- Row 1: Interactivo -->
    <rect class="row-bg-1 border" x="0" y="40" width="920" height="60" />
    <text x="20" y="75" class="cat-i">Interactivo</text>
    <text x="240" y="75" class="td-text">Activar, inferir y almacenar colaborativamente.</text>
    <text x="520" y="75" class="td-text">Innovar y co-crear nuevas soluciones.</text>
    <text x="740" y="65" class="td-text">Defender posturas en grupo,</text>
    <text x="740" y="85" class="td-text">debatir y responder en pares.</text>
    
    <!-- Row 2: Constructivo -->
    <rect class="row-bg-2 border" x="0" y="100" width="920" height="60" />
    <text x="20" y="135" class="cat-c">Constructivo</text>
    <text x="240" y="135" class="td-text">Usar conocimientos previos e inferir conceptos.</text>
    <text x="520" y="135" class="td-text">Resolver problemas en equipo.</text>
    <text x="740" y="125" class="td-text">Compartir reflexiones y</text>
    <text x="740" y="145" class="td-text">elaborar mapas conceptuales.</text>

    <!-- Row 3: Activo -->
    <rect class="row-bg-1 border" x="0" y="160" width="920" height="60" />
    <text x="20" y="195" class="cat-a">Activo</text>
    <text x="240" y="195" class="td-text">Activar conocimientos previos para nuevas tareas.</text>
    <text x="520" y="195" class="td-text">Aplicar el conocimiento a problemas.</text>
    <text x="740" y="185" class="td-text">Tomar notas, resaltar y</text>
    <text x="740" y="205" class="td-text">responder cuestionarios.</text>

    <!-- Row 4: Pasivo -->
    <rect class="row-bg-2 border" x="0" y="220" width="920" height="60" />
    <text x="20" y="255" class="cat-p">Pasivo</text>
    <text x="240" y="255" class="td-text">Almacenar información de manera aislada.</text>
    <text x="520" y="255" class="td-text">Recordar algo en contexto específico.</text>
    <text x="740" y="245" class="td-text">Escuchar exposiciones, leer</text>
    <text x="740" y="265" class="td-text">o mirar videos sin interacción.</text>
  </g>

</svg>
