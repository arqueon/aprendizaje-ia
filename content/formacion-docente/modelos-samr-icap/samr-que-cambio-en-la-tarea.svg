<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="titulo desc">
  <title id="titulo">SAMR: qué cambió en la tarea, con un mismo caso en cuatro peldaños</title>
  <desc id="desc">Un mismo caso, comentar un texto en clase, recorre los cuatro peldaños de SAMR. Sustituir: el comentario se escribe en un documento en vez de en papel; la tarea es la misma. Aumentar: el documento es compartido y el comentario recibe respuestas; la tarea gana una función. Modificar: dos equipos comentan el mismo texto y responden entre sí en tiempo real; la tarea cambia de forma. Redefinir: lectores de otra universidad discuten los comentarios en un foro; la tarea no existía sin la red. Bajo cada peldaño, la misma pregunta de evidencia: compara la tarea antes y después.</desc>
  <style>
    .fig-canvas{fill:var(--udg-c-surface-alt,#ece9e1)}
    .paper{fill:var(--udg-c-surface,#ffffff);stroke:var(--udg-c-line,#c9c5bb);stroke-width:1.5}
    .ink{fill:var(--udg-c-ink,#18223c)}.muted{fill:var(--udg-c-muted,#525d70)}
    .primary{fill:var(--udg-c-primary,#34508c)}.primary-tint{fill:var(--udg-c-primary-tint,#e7ecf7)}
    .st-primary{fill:none;stroke:var(--udg-c-primary,#34508c);stroke-width:2.5;stroke-linecap:round}
    .st-line{fill:none;stroke:var(--udg-c-line,#c9c5bb);stroke-width:1.5;stroke-dasharray:4 5}
    .t1{font:600 26px Newsreader,Georgia,serif}.t2{font:700 14px "Archivo Narrow","Arial Narrow",sans-serif;letter-spacing:1.4px}
    .t3{font:600 15.5px Newsreader,Georgia,serif}.body{font:400 15px Inter,Arial,sans-serif}.small{font:600 13px Inter,Arial,sans-serif}
  </style>
  <rect class="fig-canvas" width="960" height="560"/>
  <text class="ink t1" x="480" y="44" text-anchor="middle">SAMR pregunta qué cambió en la tarea</text>
  <text class="muted body" x="480" y="70" text-anchor="middle">Un mismo caso, comentar un texto en clase, en cuatro peldaños. La persona puede hacer lo mismo en todos.</text>

  <!-- escalera: cuatro tarjetas a alturas crecientes -->
  <g transform="translate(40 300)">
    <rect class="paper" width="210" height="150" rx="10"/>
    <rect class="primary-tint" x="0" y="0" width="210" height="34" rx="10"/><rect class="primary-tint" x="0" y="20" width="210" height="14"/>
    <text class="primary t2" x="14" y="23">S · SUSTITUIR</text>
    <text class="ink t3" x="14" y="62">El comentario se</text>
    <text class="ink t3" x="14" y="82">escribe en un documento.</text>
    <text class="muted body" x="14" y="112">Antes: en papel.</text>
    <text class="muted body" x="14" y="132">La tarea es la misma.</text>
  </g>
  <g transform="translate(265 250)">
    <rect class="paper" width="210" height="200" rx="10"/>
    <rect class="primary-tint" x="0" y="0" width="210" height="34" rx="10"/><rect class="primary-tint" x="0" y="20" width="210" height="14"/>
    <text class="primary t2" x="14" y="23">A · AUMENTAR</text>
    <text class="ink t3" x="14" y="62">El documento es</text>
    <text class="ink t3" x="14" y="82">compartido y el</text>
    <text class="ink t3" x="14" y="102">comentario recibe</text>
    <text class="ink t3" x="14" y="122">respuestas.</text>
    <text class="muted body" x="14" y="152">Antes: nadie respondía.</text>
    <text class="muted body" x="14" y="172">La tarea gana una función.</text>
  </g>
  <g transform="translate(490 200)">
    <rect class="paper" width="210" height="250" rx="10"/>
    <rect class="primary-tint" x="0" y="0" width="210" height="34" rx="10"/><rect class="primary-tint" x="0" y="20" width="210" height="14"/>
    <text class="primary t2" x="14" y="23">M · MODIFICAR</text>
    <text class="ink t3" x="14" y="62">Dos equipos comentan</text>
    <text class="ink t3" x="14" y="82">el mismo texto y se</text>
    <text class="ink t3" x="14" y="102">responden en</text>
    <text class="ink t3" x="14" y="122">tiempo real.</text>
    <text class="muted body" x="14" y="152">Antes: cada quien</text>
    <text class="muted body" x="14" y="172">comentaba por separado.</text>
    <text class="muted body" x="14" y="200">La tarea cambia de forma:</text>
    <text class="muted body" x="14" y="220">ahora hay que responder.</text>
  </g>
  <g transform="translate(715 150)">
    <rect class="paper" width="210" height="300" rx="10"/>
    <rect class="primary-tint" x="0" y="0" width="210" height="34" rx="10"/><rect class="primary-tint" x="0" y="20" width="210" height="14"/>
    <text class="primary t2" x="14" y="23">R · REDEFINIR</text>
    <text class="ink t3" x="14" y="62">Lectores de otra</text>
    <text class="ink t3" x="14" y="82">universidad discuten</text>
    <text class="ink t3" x="14" y="102">los comentarios</text>
    <text class="ink t3" x="14" y="122">en un foro.</text>
    <text class="muted body" x="14" y="152">Antes: no existía</text>
    <text class="muted body" x="14" y="172">una tarea así.</text>
    <text class="muted body" x="14" y="200">La tarea no era posible</text>
    <text class="muted body" x="14" y="220">sin la red.</text>
  </g>
  <path class="st-line" d="M40 470h885"/>
  <text class="primary small" x="40" y="500">EVIDENCIA · en cada peldaño se comprueba lo mismo: compara la tarea antes y después.</text>
  <text class="muted body" x="40" y="526">Subir de peldaño no dice nada sobre lo que la persona hizo con las ideas: para eso está ICAP.</text>
</svg>
