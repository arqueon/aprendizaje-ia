<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-labelledby="pm-t pm-d">
  <title id="pm-t">Ocho hábitos de la mente del profesorado moderno</title>
  <desc id="pm-d">Un círculo central dice «experto en hábitos de la mente». A su alrededor, ocho hábitos: se ve como aprendiz; se permite equivocarse; no espera a ser experto para probar algo nuevo; corre hacia sus debilidades; deja que el estudiantado se enseñe entre sí; lo cuestiona todo; es resiliente y perseverante; confía en aprender con actitud y esfuerzo. Adaptado de Reid Wilson.</desc>
  <style>
    .f{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}
    .ink{fill:var(--udg-c-ink, #18223c)}
    .mut{fill:var(--udg-c-muted, #525d70)}
    .good{fill:var(--udg-c-good, #536326)}
    .bgood{fill:var(--udg-c-good-tint, #eceddc)}
    .surf{fill:var(--udg-c-surface, #ffffff)}
    .sg{stroke:var(--udg-c-good, #536326)}
    .sl{stroke:var(--udg-c-line, #c9c5bb)}
  </style>
  <text class="f ink" x="620" y="52" font-size="30" font-weight="700" text-anchor="middle">Ocho hábitos de la mente del profesorado moderno</text>
  <g class="sl" stroke-width="1.6">
    <line x1="450" y1="170" x2="545" y2="330"/><line x1="450" y1="300" x2="540" y2="360"/>
    <line x1="450" y1="430" x2="540" y2="400"/><line x1="450" y1="560" x2="545" y2="430"/>
    <line x1="790" y1="170" x2="695" y2="330"/><line x1="790" y1="300" x2="700" y2="360"/>
    <line x1="790" y1="430" x2="700" y2="400"/><line x1="790" y1="560" x2="695" y2="430"/>
  </g>
  <circle cx="620" cy="380" r="108" class="bgood sg" stroke-width="2"/>
  <text class="f good" x="620" y="355" font-size="21" font-weight="700" text-anchor="middle">EXPERTO EN</text>
  <text class="f ink" x="620" y="388" font-size="26" font-weight="700" text-anchor="middle">hábitos</text>
  <text class="f ink" x="620" y="418" font-size="26" font-weight="700" text-anchor="middle">de la mente</text>
  <g>
    <rect x="90" y="130" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="270" y="163" font-size="21" font-weight="600" text-anchor="middle">Se ve como aprendiz,</text>
    <text class="f mut" x="270" y="189" font-size="19" text-anchor="middle">no solo como docente</text>
    <rect x="90" y="260" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="270" y="293" font-size="21" font-weight="600" text-anchor="middle">Se permite equivocarse</text>
    <text class="f mut" x="270" y="319" font-size="19" text-anchor="middle">con frecuencia</text>
    <rect x="90" y="390" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="270" y="423" font-size="21" font-weight="600" text-anchor="middle">No espera a ser experto</text>
    <text class="f mut" x="270" y="449" font-size="19" text-anchor="middle">para probar algo nuevo</text>
    <rect x="90" y="520" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="270" y="553" font-size="21" font-weight="600" text-anchor="middle">Corre hacia sus debilidades</text>
    <text class="f mut" x="270" y="579" font-size="19" text-anchor="middle">en lugar de huir de ellas</text>
  </g>
  <g>
    <rect x="790" y="130" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="970" y="163" font-size="21" font-weight="600" text-anchor="middle">Deja que el estudiantado</text>
    <text class="f mut" x="970" y="189" font-size="19" text-anchor="middle">se enseñe entre sí</text>
    <rect x="790" y="260" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="970" y="293" font-size="21" font-weight="600" text-anchor="middle">Lo cuestiona todo</text>
    <text class="f mut" x="970" y="319" font-size="19" text-anchor="middle">incluida su propia práctica</text>
    <rect x="790" y="390" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="970" y="423" font-size="21" font-weight="600" text-anchor="middle">Es resiliente</text>
    <text class="f mut" x="970" y="449" font-size="19" text-anchor="middle">y perseverante</text>
    <rect x="790" y="520" width="360" height="80" rx="2" class="surf sg" stroke-width="1.5"/>
    <text class="f ink" x="970" y="553" font-size="21" font-weight="600" text-anchor="middle">Confía en aprender lo que sea</text>
    <text class="f mut" x="970" y="579" font-size="19" text-anchor="middle">con actitud y esfuerzo</text>
  </g>
  <text class="f mut" x="620" y="682" font-size="17" text-anchor="middle">El punto de partida no es la herramienta: es la disposición a seguir aprendiendo.</text>
</svg>
