<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1138" role="img" aria-labelledby="pmm-t pmm-d">
  <title id="pmm-t">Ocho hábitos de la mente del profesorado moderno</title>
  <desc id="pmm-d">Versión apilada: un encabezado dice «experto en hábitos de la mente» y debajo se listan los ocho hábitos. Adaptado de Reid Wilson.</desc>
  <style>
    .f{font-family:'Archivo Narrow',Helvetica,Arial,sans-serif}
    .ink{fill:var(--udg-c-ink, #18223c)} .mut{fill:var(--udg-c-muted, #525d70)}
    .good{fill:var(--udg-c-good, #536326)} .bgood{fill:var(--udg-c-good-tint, #eceddc)}
    .surf{fill:var(--udg-c-surface, #ffffff)} .sg{stroke:var(--udg-c-good, #536326)}
  </style>
  <text class="f ink" x="320" y="56" font-size="30" font-weight="700" text-anchor="middle">Ocho hábitos de la mente</text>
  <text class="f ink" x="320" y="92" font-size="30" font-weight="700" text-anchor="middle">del profesorado moderno</text>
  <rect x="130" y="130" width="380" height="84" rx="42" class="bgood sg" stroke-width="2"/>
  <text class="f good" x="320" y="165" font-size="20" font-weight="700" text-anchor="middle">EXPERTO EN</text>
  <text class="f ink" x="320" y="196" font-size="25" font-weight="700" text-anchor="middle">hábitos de la mente</text>
  <rect x="40" y="250" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="286" font-size="24" font-weight="600" text-anchor="middle">Se ve como aprendiz,</text><text class="f mut" x="320" y="314" font-size="21" text-anchor="middle">no solo como docente</text><rect x="40" y="356" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="392" font-size="24" font-weight="600" text-anchor="middle">Se permite equivocarse</text><text class="f mut" x="320" y="420" font-size="21" text-anchor="middle">con frecuencia</text><rect x="40" y="462" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="498" font-size="24" font-weight="600" text-anchor="middle">No espera a ser experto</text><text class="f mut" x="320" y="526" font-size="21" text-anchor="middle">para probar algo nuevo</text><rect x="40" y="568" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="604" font-size="24" font-weight="600" text-anchor="middle">Corre hacia sus debilidades</text><text class="f mut" x="320" y="632" font-size="21" text-anchor="middle">en lugar de huir de ellas</text><rect x="40" y="674" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="710" font-size="24" font-weight="600" text-anchor="middle">Deja que el estudiantado</text><text class="f mut" x="320" y="738" font-size="21" text-anchor="middle">se enseñe entre sí</text><rect x="40" y="780" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="816" font-size="24" font-weight="600" text-anchor="middle">Lo cuestiona todo</text><text class="f mut" x="320" y="844" font-size="21" text-anchor="middle">incluida su propia práctica</text><rect x="40" y="886" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="922" font-size="24" font-weight="600" text-anchor="middle">Es resiliente</text><text class="f mut" x="320" y="950" font-size="21" text-anchor="middle">y perseverante</text><rect x="40" y="992" width="560" height="86" rx="2" class="surf sg" stroke-width="1.5"/><text class="f ink" x="320" y="1028" font-size="24" font-weight="600" text-anchor="middle">Confía en aprender lo que sea</text><text class="f mut" x="320" y="1056" font-size="21" text-anchor="middle">con actitud y esfuerzo</text>
</svg>