  <path d="M 330 430 C 470 420 560 390 640 380 C 720 370 790 372 838 368" fill="none" stroke="#e8c497" stroke-opacity="0.65" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
