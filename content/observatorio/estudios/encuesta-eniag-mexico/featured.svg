  <g>
    <rect x="330" y="205" width="72" height="245" rx="8" fill="#b06a1f" fill-opacity="0.55"/>
    <rect x="430" y="255" width="72" height="195" rx="8" fill="#b06a1f" fill-opacity="0.42"/>
    <rect x="530" y="160" width="72" height="290" rx="8" fill="#d99a55" fill-opacity="0.6"/>
    <rect x="630" y="330" width="72" height="120" rx="8" fill="#b06a1f" fill-opacity="0.35"/>
