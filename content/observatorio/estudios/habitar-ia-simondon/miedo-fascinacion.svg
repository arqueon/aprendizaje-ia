<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Péndulo entre miedo y fascinación por la tecnología, con una tercera vía: comprender</title>
  <desc id="desc">Un arco con tres posiciones. A la izquierda, el miedo: «La IA reemplaza al docente», «Prohibirla es cuidarlos». A la derecha, la fascinación: «La IA revoluciona el aula», «Resolverá todos los problemas». En lo alto, la tercera vía: comprender, una cultura técnica crítica. Ambos extremos tratan a la tecnología como una fuerza autónoma; Simondon propone comprender la técnica y sus relaciones.</desc>
  <style>
    .fig-canvas{fill:var(--udg-c-surface-alt,#ece9e1)}
    .ink{fill:var(--udg-c-ink,#18223c)}.muted{fill:var(--udg-c-muted,#525d70)}
    .risk{fill:var(--udg-c-risk,#8b2635)}.risk-tint{fill:var(--udg-c-risk-tint,#f8e7ea);stroke:var(--udg-c-risk,#8b2635);stroke-width:2}
    .warn{fill:var(--udg-c-warning,#914411)}.warn-tint{fill:var(--udg-c-warning-tint,#f4e6d8);stroke:var(--udg-c-warning,#914411);stroke-width:2}
    .good{fill:var(--udg-c-good,#536326)}.good-tint{fill:var(--udg-c-good-tint,#eceddc);stroke:var(--udg-c-good,#536326);stroke-width:2.5}
    .arc{fill:none;stroke:var(--udg-c-line,#c9c5bb);stroke-width:2;stroke-dasharray:7 7}
    .st-risk{fill:none;stroke:var(--udg-c-risk,#8b2635);stroke-width:2.5;stroke-linecap:round}
    .st-warn{fill:none;stroke:var(--udg-c-warning,#914411);stroke-width:2.5;stroke-linecap:round}
    .st-good{fill:none;stroke:var(--udg-c-good,#536326);stroke-width:2.5;stroke-linecap:round}
    .t1{font:600 24px Newsreader,Georgia,serif}.body{font:400 15px Inter,Arial,sans-serif}.small{font:400 14px Inter,Arial,sans-serif}.lbl{font:700 14px "Archivo Narrow","Arial Narrow",sans-serif;letter-spacing:1.2px}
  </style>
  <rect class="fig-canvas" width="1200" height="520"/>
  <path class="arc" d="M150 330Q600 40 1050 330"/>
  <!-- miedo -->
  <circle class="risk-tint" cx="150" cy="330" r="46"/>
  <path class="st-risk" d="M150 306l24 42h-48z"/><path class="st-risk" d="M150 322v14M150 342v1"/>
  <text class="risk t1" x="150" y="410" text-anchor="middle">Miedo</text>
  <text class="muted small" x="150" y="436" text-anchor="middle">«La IA reemplaza al docente»</text>
  <text class="muted small" x="150" y="458" text-anchor="middle">«Prohibirla es cuidarlos»</text>
  <!-- fascinación -->
  <circle class="warn-tint" cx="1050" cy="330" r="46"/>
  <path class="st-warn" d="M1050 306v14M1050 340v14M1026 330h14M1060 330h14M1033 313l10 10M1057 347l10 10M1067 313l-10 10M1043 347l-10 10"/>
  <text class="warn t1" x="1050" y="410" text-anchor="middle">Fascinación</text>
  <text class="muted small" x="1050" y="436" text-anchor="middle">«La IA revoluciona el aula»</text>
  <text class="muted small" x="1050" y="458" text-anchor="middle">«Resolverá todos los problemas»</text>
  <!-- comprender -->
  <circle class="good-tint" cx="600" cy="120" r="54"/>
  <circle class="st-good" cx="594" cy="114" r="18"/><path class="st-good" d="M607 127l16 16"/>
  <text class="good t1" x="600" y="212" text-anchor="middle">Comprender</text>
  <text class="muted small" x="600" y="238" text-anchor="middle">Cultura técnica crítica</text>
  <text class="ink body" x="600" y="300" text-anchor="middle">Ambos extremos tratan a la tecnología como una fuerza autónoma.</text>
  <text class="ink body" x="600" y="324" text-anchor="middle">Simondon propone una tercera vía: comprender la técnica y sus relaciones.</text>
</svg>
