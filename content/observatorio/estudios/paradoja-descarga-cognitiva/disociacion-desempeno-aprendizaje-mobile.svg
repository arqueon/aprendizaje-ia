<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" role="img" aria-labelledby="titulo desc">
  <title id="titulo">¿Qué queda cuando se retira la IA? La misma herramienta con o sin orientación pedagógica</title>
  <desc id="desc">Versión vertical de un solo panel con dos momentos, la práctica con IA y la evaluación sin IA.
    Una línea discontinua marca el nivel del grupo que practicó sin IA. Durante la práctica, los dos grupos
    que usan IA rinden por encima de esa referencia. En la evaluación sin IA, el grupo sin orientación
    pedagógica, que recibía la solución completa, cae por debajo del grupo que nunca usó la herramienta;
    es el efecto muleta. El grupo con orientación pedagógica, que recibía pistas dosificadas, termina al
    nivel del grupo sin IA y conserva lo aprendido. La diferencia no está en el modelo, está en el método.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-axis { stroke:#18223c; }
    .dot-ink { fill:#18223c; } .dot-risk { fill:#8b2635; } .dot-good { fill:#536326; }

    /* Apariencia oscura: el SVG servido como imagen solo ve la preferencia del sistema.
       Lienzo opaco para legibilidad en ambos casos. Ver CLAUDE.md convención 6. */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink { fill:#eceee9; } .f-muted { fill:#a7b0c4; }
      .f-primary { fill:#8ba3d6; } .f-good { fill:#b9c47a; } .f-risk { fill:#d98b8f; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-axis { stroke:#eceee9; }
      .dot-ink { fill:#eceee9; } .dot-risk { fill:#d98b8f; } .dot-good { fill:#b9c47a; }
    }
  </style>

  <rect class="fig-canvas" x="0" y="0" width="420" height="600"/>
  <g class="tk-font">
    <text x="210" y="32" text-anchor="middle" font-size="15" font-weight="bold" class="f-ink">¿Qué queda cuando se retira la IA?</text>
    <text x="210" y="51" text-anchor="middle" font-size="11" class="f-muted">La misma herramienta produce resultados opuestos</text>
    <text x="210" y="66" text-anchor="middle" font-size="11" class="f-muted">con o sin orientación pedagógica</text>

    <!-- leyenda -->
    <line x1="60" y1="88" x2="84" y2="88" class="st-risk" stroke-width="2.6"/>
    <text x="92" y="92" font-size="10.5" class="f-ink">Sin orientación pedagógica, la IA entrega la solución</text>
    <line x1="60" y1="108" x2="84" y2="108" class="st-good" stroke-width="2.6"/>
    <text x="92" y="112" font-size="10.5" class="f-ink">Con orientación pedagógica, la IA da pistas dosificadas</text>
    <line x1="60" y1="128" x2="84" y2="128" class="st-axis" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="92" y="132" font-size="10.5" class="f-ink">Grupo que practicó sin IA</text>

    <!-- ejes -->
    <line x1="60" y1="470" x2="400" y2="470" class="st-axis" stroke-width="1.3"/>
    <line x1="60" y1="470" x2="60" y2="160" class="st-axis" stroke-width="1.3"/>
    <text x="44" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-ink" transform="rotate(-90 44 315)">Desempeño</text>
    <text x="140" y="492" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-ink">Durante la práctica</text>
    <text x="140" y="507" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-ink">con IA</text>
    <text x="330" y="492" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-ink">En la evaluación</text>
    <text x="330" y="507" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-ink">sin IA</text>

    <!-- nota de práctica -->
    <text x="140" y="182" text-anchor="middle" font-size="10.5" font-style="italic" class="f-muted">Ambos grupos con IA rinden</text>
    <text x="140" y="196" text-anchor="middle" font-size="10.5" font-style="italic" class="f-muted">más durante la práctica</text>

    <!-- control -->
    <line x1="140" y1="365" x2="330" y2="365" class="st-axis" stroke-width="1.8" stroke-dasharray="6 5"/>
    <circle cx="140" cy="365" r="4" class="dot-ink"/>
    <circle cx="330" cy="365" r="4" class="dot-ink"/>

    <!-- sin orientación -->
    <line x1="140" y1="222" x2="330" y2="428" class="st-risk" stroke-width="2.6"/>
    <circle cx="140" cy="222" r="5" class="dot-risk"/>
    <circle cx="330" cy="428" r="5" class="dot-risk"/>
    <text x="330" y="447" text-anchor="middle" font-size="10.5" font-weight="bold" class="f-risk">queda por debajo (efecto muleta)</text>

    <!-- con orientación -->
    <line x1="140" y1="245" x2="330" y2="365" class="st-good" stroke-width="2.6"/>
    <circle cx="140" cy="245" r="5" class="dot-good"/>
    <circle cx="330" cy="365" r="7.5" fill="none" class="st-good" stroke-width="2.6"/>
    <text x="330" y="345" text-anchor="middle" font-size="10.5" font-weight="bold" class="f-good">conserva lo aprendido</text>

    <!-- cierre -->
    <text x="210" y="545" text-anchor="middle" font-size="12" font-weight="bold" class="f-primary">La diferencia no está en el modelo,</text>
    <text x="210" y="561" text-anchor="middle" font-size="12" font-weight="bold" class="f-primary">está en el método</text>
    <text x="210" y="581" text-anchor="middle" font-size="9.5" class="f-muted">Esquema ilustrativo; la evidencia se presenta en este estudio</text>
  </g>
</svg>
