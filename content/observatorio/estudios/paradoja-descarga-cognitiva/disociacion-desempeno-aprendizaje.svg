<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="titulo desc">
  <title id="titulo">La disociación entre desempeño y aprendizaje: el efecto muleta y su mitigación</title>
  <desc id="desc">Dos paneles esquemáticos. En el izquierdo, acceso sin salvaguardas: durante la práctica
    con IA el desempeño sube muy por encima del grupo de control, pero al evaluar sin IA cae por debajo
    de quienes nunca la usaron; es el efecto muleta. En el derecho, asistencia con salvaguardas pedagógicas
    que dosifica pistas en lugar de soluciones: el desempeño sube durante la práctica y, al evaluar sin IA,
    la caída frente al grupo de control se mitiga. La leyenda central concluye que la diferencia no es solo
    el modelo, sino el método.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#202945; } .f-muted { fill:#5B5A66; }
    .f-primary { fill:#B12028; } .f-good { fill:#5E6A28; } .f-risk { fill:#9A4A12; }
    .bg-primary { fill:#F7E5E2; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#F4E6D8; }
    .bg-neutral { fill:#F2EBDF; } .bg-warn { fill:#FDE8C0; }
    .st-primary { stroke:#B12028; } .st-good { stroke:#5E6A28; } .st-risk { stroke:#9A4A12; }
    .st-warn { stroke:#C9971C; } .st-axis { stroke:#202945; }
  </style>

  <g class="tk-font">
    <!-- ===== Panel izquierdo: sin salvaguardas ===== -->
    <rect x="40" y="40" width="380" height="330" rx="2" class="bg-risk st-risk" stroke-width="1.5" fill-opacity="0.35"/>
    <text x="230" y="70" text-anchor="middle" font-size="15.5" font-weight="bold" class="f-risk">Acceso sin salvaguardas</text>
    <text x="230" y="89" text-anchor="middle" font-size="12" class="f-muted">La IA entrega la solución</text>

    <!-- ejes -->
    <line x1="85" y1="330" x2="395" y2="330" class="st-axis" stroke-width="1.3"/>
    <line x1="85" y1="330" x2="85" y2="110" class="st-axis" stroke-width="1.3"/>
    <text x="78" y="225" text-anchor="middle" font-size="11.5" class="f-muted" transform="rotate(-90 70 225)">Desempeño</text>
    <text x="165" y="348" text-anchor="middle" font-size="12" class="f-muted">Práctica con IA</text>
    <text x="330" y="348" text-anchor="middle" font-size="12" class="f-muted">Evaluación sin IA</text>

    <!-- control (línea discontinua) -->
    <line x1="165" y1="245" x2="330" y2="245" class="st-axis" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="165" cy="245" r="4.5" fill="#202945"/>
    <circle cx="330" cy="245" r="4.5" fill="#202945"/>

    <!-- con IA -->
    <line x1="165" y1="140" x2="330" y2="290" class="st-risk" stroke-width="2.6"/>
    <circle cx="165" cy="140" r="5" fill="#9A4A12"/>
    <circle cx="330" cy="290" r="5" fill="#9A4A12"/>
    <text x="172" y="132" font-size="11.5" class="f-risk">Rinde más mientras la usa</text>
    <text x="330" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-risk">Queda por debajo</text>

    <text x="230" y="395" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-risk">Efecto muleta</text>
    <text x="230" y="412" text-anchor="middle" font-size="11.5" class="f-muted">La herramienta sustituyó el esfuerzo</text>

    <!-- ===== Panel derecho: con andamiaje ===== -->
    <rect x="460" y="40" width="380" height="330" rx="2" class="bg-good st-good" stroke-width="1.5" fill-opacity="0.35"/>
    <text x="650" y="70" text-anchor="middle" font-size="15.5" font-weight="bold" class="f-good">Con salvaguardas pedagógicas</text>
    <text x="650" y="89" text-anchor="middle" font-size="12" class="f-muted">Pistas dosificadas, no soluciones</text>

    <!-- ejes -->
    <line x1="505" y1="330" x2="815" y2="330" class="st-axis" stroke-width="1.3"/>
    <line x1="505" y1="330" x2="505" y2="110" class="st-axis" stroke-width="1.3"/>
    <text x="585" y="348" text-anchor="middle" font-size="12" class="f-muted">Práctica con IA</text>
    <text x="750" y="348" text-anchor="middle" font-size="12" class="f-muted">Evaluación sin IA</text>

    <!-- control -->
    <line x1="585" y1="245" x2="750" y2="245" class="st-axis" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="585" cy="245" r="4.5" fill="#202945"/>
    <circle cx="750" cy="245" r="4.5" fill="#202945"/>

    <!-- con IA andamiada -->
    <line x1="585" y1="130" x2="750" y2="245" class="st-good" stroke-width="2.6"/>
    <circle cx="585" cy="130" r="5" fill="#5E6A28"/>
    <circle cx="750" cy="245" r="5" fill="#5E6A28"/>
    <text x="592" y="122" font-size="11.5" class="f-good">Gana más practicando</text>
    <text x="750" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" class="f-good">mitiga la caída</text>

    <text x="650" y="395" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-good">El andamiaje protege el aprendizaje</text>
    <text x="650" y="412" text-anchor="middle" font-size="11.5" class="f-muted">Las pistas redujeron la sustitución del esfuerzo</text>

    <!-- ===== Leyenda y cierre ===== -->
    <line x1="60" y1="432" x2="200" y2="432" class="st-axis" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="208" y="436" font-size="11.5" class="f-muted">Grupo de control sin IA</text>
    <text x="440" y="468" text-anchor="middle" font-size="14.5" font-weight="bold" class="f-primary">La línea divisoria no es solo el modelo: es el método</text>
    <text x="440" y="487" text-anchor="middle" font-size="11" class="f-muted">Esquema conceptual: el efecto se comprueba también sin asistencia</text>
  </g>
</svg>
