<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="titulo desc">
  <title id="titulo">¿Qué queda cuando se retira la IA? La misma herramienta con o sin orientación pedagógica</title>
  <desc id="desc">Gráfica de un solo panel con dos momentos, la práctica con IA y la evaluación sin IA.
    Una línea discontinua horizontal marca el nivel del grupo que practicó sin IA. Durante la práctica,
    los dos grupos que usan IA rinden por encima de esa referencia. En la evaluación sin IA se separan.
    El grupo sin orientación pedagógica, al que la IA entregaba la solución completa, cae por debajo
    del grupo que nunca la usó; es el efecto muleta. El grupo con orientación pedagógica, al que la IA
    daba pistas dosificadas, termina al nivel del grupo que practicó sin IA y conserva lo aprendido.
    La diferencia no está en el modelo, está en el método.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Autorización editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; } .f-good { fill:#536326; } .f-risk { fill:#8b2635; }
    .bg-primary { fill:#e7ecf7; } .bg-good { fill:#ECEDDC; } .bg-risk { fill:#f8e7ea; }
    .bg-neutral { fill:#ece9e1; } .bg-warn { fill:#f4e6d8; }
    .st-primary { stroke:#34508c; } .st-good { stroke:#536326; } .st-risk { stroke:#8b2635; }
    .st-warn { stroke:#914411; } .st-axis { stroke:#18223c; }
    .dot-ink { fill:#18223c; } .dot-risk { fill:#8b2635; } .dot-good { fill:#536326; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6. */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink { fill:#eceee9; }
      .f-muted { fill:#a7b0c4; }
      .f-primary { fill:#8ba3d6; }
      .f-good { fill:#b9c47a; }
      .f-risk { fill:#d98b8f; }
      .bg-primary { fill:#243352; } .bg-good { fill:#2b331f; } .bg-risk { fill:#40222a; }
      .bg-neutral { fill:#212d4c; } .bg-warn { fill:#3a2c17; }
      .st-primary { stroke:#8ba3d6; } .st-good { stroke:#b9c47a; } .st-risk { stroke:#d98b8f; }
      .st-warn { stroke:#caa06a; } .st-axis { stroke:#eceee9; }
      .dot-ink { fill:#eceee9; } .dot-risk { fill:#d98b8f; } .dot-good { fill:#b9c47a; }
    }
  </style>

  <rect class="fig-canvas" x="0" y="0" width="880" height="520"/>
  <g class="tk-font">
    <!-- ===== Título ===== -->
    <text x="440" y="40" text-anchor="middle" font-size="18" font-weight="bold" class="f-ink">¿Qué queda cuando se retira la IA?</text>
    <text x="440" y="61" text-anchor="middle" font-size="13" class="f-muted">La misma herramienta produce resultados opuestos con o sin orientación pedagógica</text>

    <!-- ===== Ejes ===== -->
    <line x1="150" y1="400" x2="740" y2="400" class="st-axis" stroke-width="1.4"/>
    <line x1="150" y1="400" x2="150" y2="100" class="st-axis" stroke-width="1.4"/>
    <text x="128" y="250" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-ink" transform="rotate(-90 128 250)">Desempeño</text>
    <text x="280" y="424" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-ink">Durante la práctica con IA</text>
    <text x="610" y="424" text-anchor="middle" font-size="13.5" font-weight="bold" class="f-ink">En la evaluación sin IA</text>

    <!-- ===== Referencia: grupo que practicó sin IA ===== -->
    <line x1="280" y1="300" x2="610" y2="300" class="st-axis" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="280" cy="300" r="4.5" class="dot-ink"/>
    <circle cx="610" cy="300" r="4.5" class="dot-ink"/>
    <text x="268" y="304" text-anchor="end" font-size="12" class="f-muted">Grupo que practicó sin IA</text>

    <!-- ===== Sin orientación pedagógica (la IA entrega la solución) ===== -->
    <line x1="280" y1="148" x2="610" y2="352" class="st-risk" stroke-width="2.8"/>
    <circle cx="280" cy="148" r="5.5" class="dot-risk"/>
    <circle cx="610" cy="352" r="5.5" class="dot-risk"/>
    <text x="268" y="152" text-anchor="end" font-size="12" class="f-risk">La IA entrega la solución completa</text>
    <text x="626" y="348" font-size="13.5" font-weight="bold" class="f-risk">Sin orientación pedagógica</text>
    <text x="626" y="365" font-size="12" class="f-risk">queda por debajo del grupo sin IA</text>
    <text x="626" y="381" font-size="12" class="f-muted">(efecto muleta)</text>

    <!-- ===== Con orientación pedagógica (pistas dosificadas) ===== -->
    <line x1="280" y1="176" x2="610" y2="300" class="st-good" stroke-width="2.8"/>
    <circle cx="280" cy="176" r="5.5" class="dot-good"/>
    <circle cx="610" cy="300" r="8" fill="none" class="st-good" stroke-width="2.8"/>
    <text x="268" y="180" text-anchor="end" font-size="12" class="f-good">La IA da pistas dosificadas</text>
    <text x="626" y="288" font-size="13.5" font-weight="bold" class="f-good">Con orientación pedagógica</text>
    <text x="626" y="305" font-size="12" class="f-good">conserva lo aprendido, al nivel</text>
    <text x="626" y="321" font-size="12" class="f-good">del grupo que practicó sin IA</text>

    <!-- ===== Nota sobre la práctica ===== -->
    <text x="280" y="118" text-anchor="middle" font-size="12" font-style="italic" class="f-muted">Con IA, ambos grupos rinden más durante la práctica</text>

    <!-- ===== Cierre ===== -->
    <text x="440" y="470" text-anchor="middle" font-size="14.5" font-weight="bold" class="f-primary">La diferencia no está en el modelo, está en el método</text>
    <text x="440" y="490" text-anchor="middle" font-size="11" class="f-muted">Esquema ilustrativo; la evidencia experimental se presenta en este estudio</text>
  </g>
</svg>
