<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de dirección epistémica</title>
  <desc id="desc">Cinco decisiones conectadas: preguntar, verificar, aceptar o descartar, transformar y documentar.</desc>
  <rect width="1200" height="675" rx="44" fill="#edf6f5"/>
  <path d="M150 355c160-220 300 230 455-40s280 206 440-20" fill="none" stroke="#8cb5b7" stroke-width="22" stroke-linecap="round"/>
  <g font-family="sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="156" cy="352" r="72" fill="#123b4a"/><text x="156" y="361" font-size="22" fill="#fff">PREGUNTAR</text>
    <circle cx="370" cy="253" r="72" fill="#007c83"/><text x="370" y="262" font-size="22" fill="#fff">VERIFICAR</text>
    <circle cx="600" cy="372" r="80" fill="#f7a11a"/><text x="600" y="365" font-size="20" fill="#123b4a">ACEPTAR O</text><text x="600" y="392" font-size="20" fill="#123b4a">DESCARTAR</text>
    <circle cx="832" cy="252" r="72" fill="#007c83"/><text x="832" y="261" font-size="21" fill="#fff">TRANSFORMAR</text>
    <circle cx="1052" cy="337" r="72" fill="#123b4a"/><text x="1052" y="346" font-size="20" fill="#fff">DOCUMENTAR</text>
  </g>
  <text x="76" y="88" font-family="sans-serif" font-size="31" font-weight="700" fill="#123b4a">La persona conserva la dirección del proceso</text>
  <text x="76" y="128" font-family="sans-serif" font-size="23" fill="#007c83">Explora los cinco puntos para ver qué evidencia deja cada decisión.</text>
</svg>
