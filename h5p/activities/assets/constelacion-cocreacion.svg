<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Constelación de co-creación y evaluación</title>
  <desc id="desc">Tres rutas —estudiante, docente y coordinación— convergen en dirección epistémica, trazabilidad y ganancia cognitiva.</desc>
  <rect width="1600" height="900" fill="#102e3a"/>
  <circle cx="800" cy="450" r="150" fill="#f7a11a"/>
  <circle cx="800" cy="450" r="190" fill="none" stroke="#f7a11a" stroke-width="3" opacity=".42"/>
  <circle cx="800" cy="450" r="235" fill="none" stroke="#f7a11a" stroke-width="2" opacity=".25"/>
  <g stroke="#8ed1ce" stroke-width="8" opacity=".75">
    <path d="M800 300 430 190M650 510 330 650M950 510l320 140"/>
    <path d="M650 390 330 260M950 390l320-130"/>
  </g>
  <g fill="#8ed1ce">
    <circle cx="430" cy="190" r="32"/><circle cx="330" cy="650" r="32"/><circle cx="1270" cy="650" r="32"/><circle cx="330" cy="260" r="18"/><circle cx="1270" cy="260" r="18"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="800" y="430" font-size="34" font-weight="700" fill="#123b4a">DIRECCIÓN</text>
    <text x="800" y="475" font-size="34" font-weight="700" fill="#123b4a">EPISTÉMICA</text>
    <text x="430" y="126" font-size="30" font-weight="700" fill="#fff">ESTUDIANTE</text>
    <text x="330" y="722" font-size="30" font-weight="700" fill="#fff">DOCENTE</text>
    <text x="1270" y="722" font-size="30" font-weight="700" fill="#fff">COORDINACIÓN</text>
  </g>
  <text x="800" y="820" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#d9eeec">co-crear · verificar · justificar · aprender</text>
</svg>
