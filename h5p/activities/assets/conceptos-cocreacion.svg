<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro conceptos para co-crear</title>
  <desc id="desc">Co-creación, dirección epistémica, trazabilidad y ganancia cognitiva forman un sistema conectado.</desc>
  <rect width="1200" height="675" rx="44" fill="#f6f1e8"/>
  <circle cx="600" cy="338" r="112" fill="#123b4a"/>
  <text x="600" y="326" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff">APRENDIZAJE</text>
  <text x="600" y="362" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#f7a11a">CON IA</text>
  <path d="M500 285 315 190M700 285l185-95M500 392 315 493M700 392l185 101" stroke="#8cb5b7" stroke-width="10"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="105" y="98" width="360" height="132" rx="30" fill="#007c83"/><text x="285" y="156" font-size="25" font-weight="700" fill="#fff">CO-CREACIÓN</text><text x="285" y="194" font-size="19" fill="#fff">trabajo distribuido</text>
    <rect x="735" y="98" width="360" height="132" rx="30" fill="#f7a11a"/><text x="915" y="154" font-size="23" font-weight="700" fill="#123b4a">DIRECCIÓN EPISTÉMICA</text><text x="915" y="194" font-size="19" fill="#123b4a">decidir qué cuenta</text>
    <rect x="105" y="445" width="360" height="132" rx="30" fill="#f7a11a"/><text x="285" y="503" font-size="25" font-weight="700" fill="#123b4a">TRAZABILIDAD</text><text x="285" y="541" font-size="19" fill="#123b4a">hacer visible el proceso</text>
    <rect x="735" y="445" width="360" height="132" rx="30" fill="#007c83"/><text x="915" y="503" font-size="23" font-weight="700" fill="#fff">GANANCIA COGNITIVA</text><text x="915" y="541" font-size="19" fill="#fff">aprender algo transferible</text>
  </g>
</svg>
