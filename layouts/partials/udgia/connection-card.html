{{- $page := .page -}}
{{- $featuredURL := partial "udgia/featured-url.html" $page -}}
<article
  data-connection-source="{{ .source }}"
  {{- with .criterion }} data-connection-criterion="{{ . }}"{{ end }}
  class="relative overflow-hidden rounded-lg border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 flex flex-col">
  {{- with $featuredURL }}
    <div class="relative overflow-hidden" style="aspect-ratio:16/9;">
      <img src="{{ . }}" alt="" role="presentation" loading="lazy" decoding="async"
        class="not-prose absolute inset-0 w-full h-full object-cover">
    </div>
  {{- end }}
  <div class="p-5 flex-1">
    <p class="text-sm font-semibold text-[var(--udg-c-primary)] mb-2">{{ .label }}</p>
    <h3 class="text-lg font-bold mt-0 mb-2"><a href="{{ $page.RelPermalink }}">{{ $page.LinkTitle }}</a></h3>
    {{- with .reason }}<p class="text-sm mb-0">{{ . }}</p>{{ else }}{{ with $page.Params.summary }}<p class="text-sm mb-0">{{ . }}</p>{{ end }}{{ end }}
  </div>
</article>
