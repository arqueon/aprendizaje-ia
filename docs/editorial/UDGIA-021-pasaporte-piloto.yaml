  - "El corpus heredado empieza con definiciones y listas sin situación, ejemplo ni recapitulación."
  - "Las portadas genéricas repiten IA mediante cerebro, robot, red, pantalla o neón sin función explicativa."
  - "Bloom, SAMR e ICAP tienden a representarse como jerarquías equivalentes."
  - "Una conversación con IA se llama interactiva sin conducta recíproca entre aprendices."
  - "El glosario se usa como definición canónica aunque carece de mediación y contexto."

