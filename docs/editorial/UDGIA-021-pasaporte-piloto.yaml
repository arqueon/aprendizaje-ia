    actividad_preparatoria: "Caso recurrente explicado, contraste de dos interpretaciones y mapa que separa las preguntas de cada marco."
    clase_de_tarea: "CT1"
    modulo: "Columna conceptual completa"
    tipo_de_aprendizaje: "indagacion"
    modo_icap_previsto: "constructivo"
    conducta_icap_observable: "Genera una comparación y una explicación que no estaban dadas literalmente."
    justificacion_icap: "La clasificación depende de la explicación propia, no de clics, IA o formato visual."
    papel_de_ia_si_aplica: "La lectura no requiere IA; un ejemplo puede mostrar respuestas producidas con IA."
    alternativa_sin_ia: "Ruta completa en prosa, tablas y casos estáticos."
    nivel_cognitivo_evidencia: "analizar"
    peso_en_calificacion: null
  - resultado: "RA2"
    evidencia: "Decisión justificada ante un escenario: propósito, ayuda elegida, trabajo no delegable, evidencia y alternativa."
    actividad_preparatoria: "Ejemplo trabajado completo, segundo caso con apoyos parciales y escenario de transferencia."
    clase_de_tarea: "CT2"
    modulo: "Agenciamiento/co-creación + aplicación de los cinco marcos"
    tipo_de_aprendizaje: "produccion"
    modo_icap_previsto: "constructivo"
    conducta_icap_observable: "Formula y defiende una decisión contextual propia."
    justificacion_icap: "La persona genera una justificación; una interfaz conversacional no se contabiliza como interacción ICAP."
    papel_de_ia_si_aplica: "Opcional como fuente de una sugerencia o contraste; nunca decide ni evalúa la evidencia final."
    alternativa_sin_ia: "Caso y alternativas escritas con la misma exigencia de justificación."
    nivel_cognitivo_evidencia: "evaluar"
    peso_en_calificacion: null
  - resultado: "RA3"
    evidencia: "Recorrido observado desde una pregunta por audiencia hasta una guía/práctica y una explicación del siguiente paso."
    actividad_preparatoria: "Selector de entrada, enlaces tipados y cierres que explican por qué sigue cada recurso."
    clase_de_tarea: "CT3"
    modulo: "Entrada general y cierres de las seis familias"
    tipo_de_aprendizaje: "practica"
    modo_icap_previsto: "constructivo"
    conducta_icap_observable: "Selecciona una ruta y genera una explicación propia de por qué responde a su necesidad."
    justificacion_icap: "La evidencia completa no termina en navegar: exige producir una razón de pertinencia que no estaba dada literalmente."
    papel_de_ia_si_aplica: "Ninguno."
