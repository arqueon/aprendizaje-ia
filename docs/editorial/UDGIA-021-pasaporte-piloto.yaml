decisiones_y_justificaciones:
  - decision: "Sustitución visual selectiva por función y lotes."
    alternativa_descartada: "Rediseñar todas las portadas antes de intervenir el contenido."
    razon: "Conserva familias útiles, reduce fatiga prioritaria y evita retrabajo antes de resolver el núcleo."
    fecha: "2026-08-02"
  - decision: "Iniciar con L1 y seis familias conceptuales."
    alternativa_descartada: "Piloto visual transversal sin reordenar contenidos."
    razon: "Permite probar juntos coherencia conceptual, narrativa, navegación y sistema visual."
    fecha: "2026-08-02"
  - decision: "Usar escenas situadas solo con anclas de contexto y diagramas para relaciones conceptuales."
    alternativa_descartada: "Sustituir imágenes genéricas por otras escenas humanas igualmente intercambiables."
    razon: "Campo o problema, evidencia y consecuencia deben aportar comprensión; las personas no son decoración."
    fecha: "2026-08-02"
  - decision: "Reservar una familia pública por autoridad y audiencia, sin crear páginas todavía."
    alternativa_descartada: "Centro único o enlaces directos a archivos externos."
    razon: "Separa estatus, guía estudiantil y guía docente, y permite enlaces duraderos sin mezclar funciones."
    fecha: "2026-08-02"
  - decision: "Probar primero la entrada general con tres perfiles humanos."
    alternativa_descartada: "Preparar de inmediato paquetes para las seis muestras."
    razon: "La entrada debe orientar todo el recorrido y permite corregir el protocolo antes de escalarlo."
    fecha: "2026-08-02"
    estado: "supersedida-el-2026-08-03-por-falta-de-revisores-externos"
  - decision: "Usar una segunda revisión simulada de M1 para no detener el refinamiento local."
    alternativa_descartada: "Tratar la ausencia inmediata de lectores humanos como bloqueo de todo trabajo local."
    razon: "Tres perfiles independientes pueden detectar coincidencias y priorizar ajustes; la lectura humana conserva su función antes de integrar o publicar."
    fecha: "2026-08-02"
  - decision: "Acotar la revisión humana a Rubén y usar agentes únicamente como perspectivas simuladas."
    alternativa_descartada: "Presentar agentes como participantes, revisores externos o personas usuarias de tecnologías de asistencia."
    razon: "No hay otras personas disponibles por ahora. Las simulaciones ayudan a detectar barreras, pero Rubén conserva el único dictamen humano y el VoBo final de cada lote; el uso real y el lector de pantalla real permanecen no verificados."
    fecha: "2026-08-03"
  - decision: "Aplicar cuatro ajustes acotados a M1 y mantener lectura humana antes de integrar."
    alternativa_descartada: "Extender la reescritura a las otras cinco muestras o considerar suficiente la simulación."
    razon: "Los tres perfiles coincidieron en las mismas barreras; el alcance aprobado corrige solo la entrada y conserva la aprobación final humana."
    fecha: "2026-08-02"
  - decision: "Diferir la lectura humana y continuar con diagnóstico y preparación local."
    alternativa_descartada: "Detener todo el trabajo hasta conseguir lectores reales o eliminar la validación final."
    razon: "La auditoría local puede avanzar sin confundir simulación con aprobación; la lectura humana conserva su función antes de integrar o publicar."
    fecha: "2026-08-02"
  - decision: "Aplicar el lote A de continuidad M2-M6, preparar solo briefs B2-B6 y conservar los SVG."
    alternativa_descartada: "Dejar el diagnóstico sin cambios, reemplazar los diagramas o construir de inmediato las interacciones."
    razon: "Resuelve un patrón común con cambios acotados, mantiene los visuales funcionales y define la interacción antes de elegir tecnología; la lectura humana permanece antes de integrar."
    fecha: "2026-08-02"
  - decision: "Prototipar B6 como HTML local autónomo y conservar BloomObjectiveBuilder sin cambios."
    alternativa_descartada: "Convertir el constructor H5P existente en revisor mediante un parche menor."
    razon: "El H5P empieza por nivel y verbo, representa una progresión ascendente y no diagnostica los enlaces propósito-evidencia-experiencia-asistencia; el prototipo necesita otro contrato conceptual."
    fecha: "2026-08-02"
  - decision: "Reescribir la superficie pública del prototipo M6 con el enfoque de las guías para profesorado y estudiantes."
    alternativa_descartada: "Conservar la terminología interna y añadir una definición al inicio."
    razon: "La primera lectura humana no pudo explicar qué hacía la actividad; el caso, la acción y el resultado deben entenderse antes de cualquier término técnico."
    fecha: "2026-08-02"
  - decision: "Reabrir la comprensibilidad de B2-B5, desarrollar las cinco cualidades obligatorias y no elegir todavía un prototipo."
    alternativa_descartada: "Tomar el PASS automático y la brevedad de los resúmenes como prueba suficiente de claridad."
    razon: "La lectura humana no pudo reconstruir qué se comparaba, para qué ni qué se lograba; las relaciones y los pasos deben enseñarse antes de comprimirlos."
    fecha: "2026-08-02"
  - decision: "Cerrar la duda de claridad de B2-B5 y separar la futura elección de prototipo."
    alternativa_descartada: "Interpretar la confirmación de claridad como autorización para construir o integrar una interacción."
    razon: "Rubén confirmó propósito, recorrido y resultado sin ajustes; la elección de prototipo requiere una decisión posterior con alcance propio."
    fecha: "2026-08-02"
  - decision: "Construir como siguiente prototipo local la comparación de dos sugerencias para el mismo borrador."
    alternativa_descartada: "Prototipar primero la revisión de consigna, la secuencia híbrida o la separación entre cambio tecnológico y trabajo cognitivo."
    razon: "La actividad sirve a estudiantes y docentes, pone en acción la dirección humana del proceso y complementa el prototipo M6 dirigido principalmente a profesorado."
    fecha: "2026-08-02"
  - decision: "Priorizar la eliminación de bloqueos de todo el ecosistema antes de escalar producción."
    alternativa_descartada: "Seguir acumulando prototipos o producir cada soporte por separado."
    razon: "La población y modalidad condicionan el curso y los lectores de Hugo; la integración vertical condiciona la producción por lotes. El orden P0-P4 reduce retrabajo sin confundir producción local con publicación."
    fecha: "2026-08-03"
  - decision: "Trabajar con dos cohortes separadas de educación superior y un núcleo común multidisciplinar."
    alternativa_descartada: "Una sola cohorte mixta, una única ruta o casos cerrados de una disciplina."
    razon: "Rubén eligió casos adaptables y revisión por campo para conservar un núcleo compartido sin borrar las diferencias entre estudiantado y profesorado."
    fecha: "2026-08-03"
  - decision: "Preparar P1 y después producir localmente por lotes con revisión de cada diff."
    alternativa_descartada: "Integrar directamente en content, publicar o detener la preparación por el aviso de privacidad."
    razon: "El envío SmallDocs autorizó preparación y producción local reversible; privacidad y contacto quedan diferidos y el instrumento no se distribuye."
    fecha: "2026-08-03"
  - decision: "Diseñar para 36 a 60 personas por cohorte y un encuentro semanal de 60 minutos."
    alternativa_descartada: "Un piloto pequeño o una proporción mayor de tiempo síncrono."
