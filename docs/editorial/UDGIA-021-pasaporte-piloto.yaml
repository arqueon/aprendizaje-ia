    nivel_cognitivo_evidencia: "aplicar"
    peso_en_calificacion: null

distribucion_tipos_de_aprendizaje:
  adquisicion_pct: 25
  indagacion_pct: 25
  practica_pct: 20
  discusion_pct: 0
  colaboracion_pct: 0
  produccion_pct: 30
  alerta: "El sitio público asincrónico no promete discusión o colaboración; el curso podrá añadirlas cuando modalidad y población estén definidas."

distribucion_modos_icap:
  pasivo_pct: 25
  activo_pct: 20
  constructivo_pct: 55
  interactivo_pct: 0
  criterio_de_conteo: "Función prevista de los tres tipos de evidencia y su preparación; no representa tiempo real de usuario."
  alerta: "No atribuir modo interactivo a H5P o conversación con IA; el curso amplio resolverá interacción humana según modalidad."

desempeno_terminal: >-
  Ante una situación de aprendizaje con tecnología o IA, explica qué pregunta necesita
  responder, usa el marco pertinente sin confundirlo con los demás, justifica una decisión
  y encuentra el recurso adecuado para continuar.

clases_de_tarea:
  - id: "CT1"
    tarea_completa: "Explicar un caso educativo mediante lentes conceptuales distintos sin convertirlos en una jerarquía única."
    que_se_simplifica: "Un solo caso, propósito explícito y cuatro dimensiones muy contrastadas."
    variantes:
      - "Estudiante revisa un borrador con dos sugerencias de IA."
      - "Docente distribuye una actividad entre preparación, encuentro y cierre."
    andamiaje_inicial: "Ejemplo trabajado y preguntas visibles de cada lente."
    secuencia_de_retirada: "ejemplo completo → comparación con huecos → caso con solo preguntas → transferencia"
    informacion_de_apoyo: "Explicaciones cotidianas, límites y mapa de relaciones."
    informacion_procedimental: "Preguntas: qué propósito, qué hace la persona, qué cambia en la tarea, cómo se conectan los momentos y qué evidencia queda."
    practica_de_componentes: "Ninguna automatización aislada."
  - id: "CT2"
    tarea_completa: "Decidir y justificar si usar, limitar, aplazar o no usar IA en una situación concreta."
    que_se_simplifica: "Consecuencia acotada, datos no sensibles y dos rutas plausibles."
    variantes:
      - "Revisión de un texto de bajo riesgo."
      - "Actividad con información sensible o acceso desigual."
    andamiaje_inicial: "Decisión modelada con propósito, criterio, evidencia y alternativa."
    secuencia_de_retirada: "caso resuelto → pasos faltantes → plantilla breve → decisión autónoma"
    informacion_de_apoyo: "Orientaciones §§3–6 y muestras para estudiantes/docentes."
    informacion_procedimental: "Plantilla de decisión y verificación."
    practica_de_componentes: "Verificar una afirmación solo si el caso lo requiere."
  - id: "CT3"
    tarea_completa: "Encontrar una ruta pertinente y explicar por qué ese recurso es el siguiente paso."
    que_se_simplifica: "Tres entradas por audiencia/intención y un único enlace principal por cierre."
    variantes:
      - "Quiero comprender antes de usar IA."
      - "Quiero diseñar una actividad."
      - "Necesito resolver un término encontrado en el curso."
    andamiaje_inicial: "Selector con ejemplos de necesidades."
    secuencia_de_retirada: "ruta sugerida → mapa navegable → búsqueda o índice semántico"
    informacion_de_apoyo: "Contrato de relaciones tipadas y mapa de constelación."
    informacion_procedimental: "Indicadores Para quién, Para qué y Cómo continuar."
    practica_de_componentes: "Ninguna."

narrativa:
  pregunta_motriz: "¿Qué necesita hacer una persona, además de usar una herramienta, para que la IA ayude a aprender y enseñar?"
  caso_o_hilo_recurrente: >-
    Un mismo borrador o actividad cambia de versión. La persona debe decidir propósito,
    ayuda, momento, trabajo cognitivo, evidencia y siguiente paso.
  arco:
    al_inicio_es_capaz_de: "Reconocer nombres y herramientas que aparecen separados en el sitio."
    al_final_es_capaz_de: "Distinguir las preguntas de cada marco, relacionarlas en un caso y justificar una ruta."
  tension_por_modulo:
    - modulo: "Entrada general"
      queda_resuelto: "Por qué el producto final no basta para saber qué se aprendió."
      queda_abierto: "Quién conserva la pregunta, el criterio y la decisión."
      por_que_sigue_lo_que_sigue: "La co-creación permite observar cómo se reparte el trabajo."
    - modulo: "Agenciamiento y co-creación"
      queda_resuelto: "Qué decisiones no se delegan y qué rastro puede mostrarlas."
      queda_abierto: "Qué tipo de actividad provoca aprendizaje."
      por_que_sigue_lo_que_sigue: "Hay que mirar la conducta de la persona, no la herramienta."
    - modulo: "Aprendizaje activo"
      queda_resuelto: "Qué significa generar, contrastar y revisar ideas."
      queda_abierto: "Cómo conectar esas acciones entre momentos y espacios."
      por_que_sigue_lo_que_sigue: "El diseño híbrido responde a la secuencia funcional."
    - modulo: "Aprendizaje híbrido"
      queda_resuelto: "Cómo cada momento usa el trabajo del anterior."
      queda_abierto: "Cómo describir transformación de la tarea e implicación cognitiva sin confundirlas."
      por_que_sigue_lo_que_sigue: "SAMR e ICAP miran dimensiones diferentes del mismo caso."
    - modulo: "SAMR e ICAP"
      queda_resuelto: "Qué pregunta responde cada marco y por qué chat no equivale a interacción ICAP."
      queda_abierto: "Cómo partir del propósito y elegir evidencia suficiente."
      por_que_sigue_lo_que_sigue: "Bloom y diseño inverso conectan operación cognitiva, evidencia y experiencia."
    - modulo: "Bloom y diseño inverso"
      queda_resuelto: "Cómo alinear propósito, evidencia, actividad y uso de IA sin una pirámide rígida."
      queda_abierto: "Cómo aplicar la decisión en una guía, práctica o curso."
      por_que_sigue_lo_que_sigue: "El cierre dirige a una acción específica por audiencia."

conceptos_umbral:
  - concepto: "La herramienta no determina el aprendizaje."
    intuicion_previa_en_conflicto: "Más tecnología, clics o fluidez significan mayor aprendizaje."
    caso_que_la_rompe: "Dos productos iguales con procesos de decisión y comprensión opuestos."
    tiempo_estimado_de_transito: "NO verificado"
    evidencia_de_cruce: "La persona justifica el valor de la actividad mediante una conducta y una evidencia, no por la herramienta."
  - concepto: "Los marcos no forman una jerarquía única."
    intuicion_previa_en_conflicto: "SAMR, ICAP y Bloom pueden alinearse nivel por nivel."
    caso_que_la_rompe: "Una tarea transforma el medio pero exige recepción, o cambia poco el medio y exige una explicación constructiva."
    tiempo_estimado_de_transito: "NO verificado"
    evidencia_de_cruce: "La persona explica qué pregunta responde cada marco y evita correspondencias automáticas."

modulos:
  - id: "M1"
    titulo: "Entrada general"
    titulo_publico_sin_codigo: "Empezar con IA para aprender y enseñar"
    resultados_asociados: ["RA2", "RA3"]
    clase_de_tarea: "CT2, CT3"
    transicion_de_entrada: "Parte de una tarea o producto familiar y pregunta qué aprendió realmente la persona."
    recorrido_explicativo:
      situacion_reconocible: "Un producto convincente aparece en minutos."
      explicacion_cotidiana: "El acabado no revela el recorrido."
      concepto_y_relaciones: "Propósito, ayuda, verificación, decisión y evidencia."
      ejemplo_trabajado: "Un caso ficticio de calidad del agua compara dos conclusiones y vuelve a la evidencia antes de decidir."
      contraste_o_limite: "Dominar instrucciones o una marca no basta."
      oportunidad_de_uso: "Elegir una ruta de estudiantado o profesorado."
