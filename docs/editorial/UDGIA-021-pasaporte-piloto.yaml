# PASAPORTE UDGIA-021 — fuente de verdad del piloto editorial de Hugo.
# La arquitectura interna no se copia a las páginas públicas.

curso:
  titulo: "Piloto editorial del sitio IA y Aprendizaje"
  clave: "UDGIA-021"
  programa: "Ecosistema IA-docencia UDGPlus"
  institucion: "Universidad de Guadalajara / UDGPlus"
  modalidad: "recurso web público asincrónico; no es un curso ni fija modalidad del curso amplio"
  duracion_semanas: 0
  horas_totales_estudiante: 0
  creditos: null
  idioma: "es-MX"
  version: "0.27-p2-aplicado-working-tree-qa-pass"
  fecha_actualizacion: "2026-08-03"
  modo_de_trabajo: "copiloto"

poblacion:
  descripcion: >-
    Personas que llegan al sitio público por las rutas existentes de estudiantado o
    profesorado. El primer piloto debe ser comprensible sin formación previa en diseño
    instruccional, inteligencia artificial, Bloom, ICAP, SAMR, aprendizaje activo o
    aprendizaje híbrido. Coordinación académica puede consultar el nodo de entrada, pero
    no es la audiencia primaria de las seis familias piloto.
  tamano_estimado: null
  conocimientos_previos_garantizados: []
  conocimientos_previos_NO_garantizados:
    - "Vocabulario de inteligencia artificial y educación"
    - "Diseño instruccional o evaluación del aprendizaje"
    - "Taxonomía revisada de Bloom"
    - "Modelos SAMR e ICAP"
    - "Diferencia entre modalidad híbrida y aprendizaje activo"
  concepciones_erroneas_frecuentes:
    - concepto: "aprendizaje activo"
      concepcion_previa: "Toda participación, clic o uso de una herramienta vuelve activa una actividad."
      por_que_es_tentadora: "La actividad visible se confunde con generación y revisión de ideas."
    - concepto: "aprendizaje híbrido"
      concepcion_previa: "Basta repartir materiales entre aula y plataforma."
      por_que_es_tentadora: "Describe los medios utilizados, aunque no exista una secuencia funcional."
    - concepto: "ICAP interactivo"
      concepcion_previa: "Conversar con un chatbot equivale a co-construir con otra persona."
      por_que_es_tentadora: "La interfaz responde y parece recíproca."
    - concepto: "taxonomía de Bloom"
      concepcion_previa: "Es una pirámide rígida y siempre hay que subir sus seis escalones en orden."
      por_que_es_tentadora: "La representación piramidal simplifica una relación compleja."
    - concepto: "co-creación con IA"
      concepcion_previa: "Un producto más pulido prueba que hubo aprendizaje compartido con el sistema."
      por_que_es_tentadora: "El acabado oculta quién formuló, verificó y decidió."
  lengua_y_variedad: "español de México; evitar anglicismos no mediados"
  condiciones_materiales:
    dispositivo_predominante: "DESCONOCIDO; diseñar primero para móvil y teclado"
    conectividad: "DESCONOCIDA; no hacer que la comprensión dependa de activos pesados o interacción"
    horas_disponibles_por_semana: null
  motivaciones_de_inscripcion:
    - "Resolver una duda sobre IA y aprendizaje"
    - "Diseñar o revisar una actividad docente"
    - "Entender un término encontrado en una guía o curso"
  causas_de_abandono_conocidas:
    - "Entrada por definiciones abstractas"
    - "Texto o diagramas densos sin ejemplo mediado"
    - "Navegación sin ruta de continuidad"
    - "Imágenes genéricas que no aportan comprensión"
  uso_previsto_del_aprendizaje: >-
    Comprender una relación, tomar una decisión acotada y continuar hacia una guía,
    práctica, ejemplo o tarea del curso pertinente.
  fuente_del_perfil: >-
    Rutas por audiencia y contrato editorial UDGIA-004A; no existe todavía investigación
    de usuarios ni prueba con la primera cohorte del curso amplio.
  huecos_de_informacion:
    - "Perfiles, dispositivos y tecnologías de asistencia de usuarios reales"
    - "Términos de búsqueda y rutas de entrada más frecuentes"
    - "Tiempo de lectura y abandono por tipo de página"
    - "Primera población, modalidad y carga del curso amplio"

comunicacion_publica:
  audiencia_en_sus_propias_palabras: >-
    Estudio o enseño y necesito entender qué aporta la IA, qué parte del trabajo no debo
    delegar y qué recurso me ayuda a continuar.
  preguntas_que_probablemente_trae:
    - "¿En qué puede ayudarme la IA sin sustituir mi aprendizaje o mi criterio?"
    - "¿Qué significa que una actividad sea activa o híbrida?"
    - "¿Para qué sirven Bloom, SAMR e ICAP y cuáles son sus límites?"
    - "¿Qué debo observar, producir o documentar?"
    - "¿Qué página o guía me conviene leer después?"
  conocimientos_que_NO_se_pueden_suponer:
    - "Diferencia entre producto y evidencia del proceso"
    - "Diferencia entre herramienta, modalidad, conducta cognitiva y resultado"
    - "Sentido de dirección epistémica, ICAP o diseño inverso"
  etiquetas_internas_que_no_deben_publicarse: ["UDGIA-021", "RA", "CT", "M", "A", "L1-lote"]
  tono: "orientador, conversacional y académico divulgativo"
  terminos_necesarios:
    - termino: "co-creación persona-IA"
      situacion_que_prepara_su_significado: "Una persona recibe dos sugerencias plausibles y debe decidir qué cambia y por qué."
      explicacion_cotidiana: "El sistema aporta posibilidades; la persona conserva la pregunta, el criterio, la verificación y la decisión."
      ejemplo: "Revisar dos versiones de un borrador y justificar qué se acepta, transforma o descarta."
      lugar_de_primera_aparicion: "Familia agenciamiento y co-creación"
    - termino: "aprendizaje activo"
      situacion_que_prepara_su_significado: "Dos estudiantes usan la misma herramienta, pero solo uno explica, contrasta y revisa."
      explicacion_cotidiana: "La actividad importa por el trabajo de pensamiento que provoca, no por el movimiento o la tecnología."
      ejemplo: "Comparar respuestas, construir un criterio y revisar una explicación."
      lugar_de_primera_aparicion: "Familia aprendizaje activo"
    - termino: "aprendizaje híbrido"
      situacion_que_prepara_su_significado: "Un trabajo previo solo cobra sentido si se usa para decidir durante el encuentro y revisar después."
      explicacion_cotidiana: "Los momentos se conectan por función; no basta distribuir archivos entre espacios."
      ejemplo: "Borrador asíncrono, contraste síncrono y revisión final justificada."
      lugar_de_primera_aparicion: "Familia aprendizaje híbrido"
    - termino: "SAMR e ICAP"
      situacion_que_prepara_su_significado: "La misma tecnología puede cambiar poco la tarea y aun así exigir razonamiento, o al revés."
      explicacion_cotidiana: "SAMR mira la transformación de la tarea; ICAP, lo que hace cognitivamente la persona."
      ejemplo: "Sustituir papel por pantalla frente a generar y contrastar una explicación propia."
      lugar_de_primera_aparicion: "Familia SAMR e ICAP"
    - termino: "Bloom y diseño inverso"
      situacion_que_prepara_su_significado: "Una actividad empieza por lo que se quiere observar, no por una herramienta o verbo aislado."
      explicacion_cotidiana: "Bloom ayuda a describir la operación cognitiva; el diseño inverso alinea propósito, evidencia y experiencia."
      ejemplo: "Elegir una evidencia que realmente obligue a comparar y justificar, no solo reconocer opciones."
      lugar_de_primera_aparicion: "Familia Bloom y diseño inverso"
  ideas_centrales:
    - idea: "El valor educativo depende de la decisión y el trabajo cognitivo, no de la presencia de IA."
      situacion_de_entrada: "Dos productos igual de pulidos esconden procesos de aprendizaje distintos."
      explicacion_cotidiana: "Hay que mirar qué comprendió, verificó y decidió la persona."
      relaciones_que_deben_desarrollarse: ["co-creación", "aprendizaje activo", "evidencia del proceso"]
      ejemplo_trabajado: "Un borrador revisado en dos versiones con razones de aceptación y descarte."
      contraste_o_limite: "Usar más herramientas o producir más rápido no demuestra mayor aprendizaje."
      uso_para_la_audiencia: "Decidir qué asistencia conviene y qué evidencia conservar."
      recapitulacion: "La herramienta puede apoyar; el criterio y la responsabilidad siguen siendo humanos."
    - idea: "Los marcos responden preguntas diferentes y no forman una escalera única."
      situacion_de_entrada: "Una actividad puede ser híbrida, usar IA y seguir exigiendo solo recepción."
      explicacion_cotidiana: "Modalidad, transformación de tarea, conducta cognitiva y propósito son dimensiones relacionadas pero distintas."
      relaciones_que_deben_desarrollarse: ["aprendizaje híbrido", "SAMR", "ICAP", "Bloom", "diseño inverso"]
      ejemplo_trabajado: "La misma consigna se observa desde cada marco y produce diagnósticos distintos."
      contraste_o_limite: "No existe correspondencia automática SAMR↔Bloom ni chat↔ICAP interactivo."
      uso_para_la_audiencia: "Elegir el marco según la pregunta de diseño que necesita responder."
      recapitulacion: "Los marcos se coordinan por su función; no se apilan como niveles equivalentes."
  decisiones_de_formato:
    tablas_solo_despues_de_explicar: true
    visuales_y_pregunta_que_responden:
      - "Mapa de lentes: ¿qué pregunta responde cada marco y qué no permite concluir?"
      - "Comparador de versiones: ¿qué decisión humana cambió el resultado?"
      - "Secuencia híbrida: ¿cómo utiliza cada momento el trabajo del anterior?"
    apoyos_para_lectura_en_movil:
      - "Prosa breve antes de tablas y diagramas"
      - "Una relación principal por visual"
      - "Sin texto diminuto incrustado"
      - "Fallback estructurado y navegación lineal equivalente"

resultados_de_aprendizaje:
  - id: "RA1"
    enunciado_para_estudiante: "Podrás explicar con un ejemplo qué pregunta responde cada familia conceptual y qué no permite concluir."
    enunciado_formal: "La persona distingue co-creación, aprendizaje activo, aprendizaje híbrido, SAMR, ICAP, Bloom y diseño inverso por su función y límites en un caso educativo."
    nivel_cognitivo: "analizar"
    justificacion_del_nivel: "La evidencia exige separar dimensiones que aparecen juntas en un mismo caso y explicar sus relaciones."
    observable_en: "Reconstrucción del lector en frío y mapa comparativo de un caso."
    criterio_de_suficiencia: "Distingue las seis lentes del recorrido sin equivalencias rígidas y aporta al menos un ejemplo y un límite correctos."
    competencia_asociada: "Literacidades crítica y de co-creación; criterio didáctico y dirección epistémica."
    auditado_por: "auditor de alineación UDGIA-021, ronda 2"
    fecha_auditoria: "2026-08-02"
  - id: "RA2"
    enunciado_para_estudiante: "Podrás decidir qué ayuda de IA conviene, qué trabajo conservar y qué evidencia permite justificar tu decisión."
    enunciado_formal: "La persona evalúa una situación educativa y justifica una ruta de uso, límite, aplazamiento o no uso de IA."
    nivel_cognitivo: "evaluar"
    justificacion_del_nivel: "La tarea exige aplicar criterios, comparar consecuencias y defender una decisión contextual."
    observable_en: "Respuesta a un escenario con decisión, razón, evidencia y alternativa."
    criterio_de_suficiencia: "La decisión corresponde al propósito, conserva trabajo no delegable y nombra una evidencia pertinente."
    competencia_asociada: "Juicio crítico, agencia y uso selectivo/no utilización."
    auditado_por: "auditor de alineación UDGIA-021, ronda 2"
    fecha_auditoria: "2026-08-02"
  - id: "RA3"
    enunciado_para_estudiante: "Podrás encontrar una guía, práctica o profundización adecuada para continuar desde tu necesidad."
    enunciado_formal: "La persona selecciona y explica un siguiente recurso según audiencia, intención y relación semántica."
    nivel_cognitivo: "aplicar"
    justificacion_del_nivel: "La evidencia usa las categorías del recorrido en una necesidad concreta, no solo reconoce etiquetas."
    observable_en: "Prueba de recorrido desde una pregunta real hasta un recurso y un siguiente paso."
    criterio_de_suficiencia: "Llega sin callejón a un recurso pertinente y puede explicar por qué continúa ahí."
    competencia_asociada: "Autogestión del aprendizaje y navegación informacional."
    auditado_por: "auditor de alineación UDGIA-021, ronda 2"
    fecha_auditoria: "2026-08-02"

