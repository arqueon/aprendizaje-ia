<svg xmlns="http://www.w3.org/2000/svg" width="640" height="970" viewBox="0 0 640 970" role="img" aria-labelledby="cinco-mobile-title cinco-mobile-desc">
  <title id="cinco-mobile-title">Cinco movimientos para probar una ayuda de IA</title>
  <desc id="cinco-mobile-desc">Secuencia vertical de cinco movimientos: nombrar el propósito, hacer un primer intento, pedir ayuda delimitada, comprobar el punto decisivo y decidir y explicar.</desc>
  <metadata>Variante móvil derivada del Generated Output de Napkin AI y adaptada a identidad C para el piloto editorial UDGIA-021. Uso sujeto a los términos aplicables de Napkin.</metadata>
  <rect width="640" height="970" fill="#f7f2e8"/>

  <g font-family="Lora, Georgia, serif" fill="#1d2a42">
    <text x="44" y="66" font-size="36" font-weight="700">Cinco movimientos para</text>
    <text x="44" y="108" font-size="36" font-weight="700">probar una ayuda</text>
    <text x="44" y="145" font-size="17">El propósito y la decisión siguen siendo tuyos.</text>
  </g>

  <line x1="82" y1="227" x2="82" y2="827" stroke="#9aa6b7" stroke-width="4"/>

  <g font-family="Lora, Georgia, serif" fill="#1d2a42">
    <g>
      <rect x="112" y="170" width="484" height="125" rx="18" fill="#fffdf8" stroke="#d8cfbf" stroke-width="2"/>
      <rect x="112" y="170" width="12" height="125" rx="6" fill="#394f70"/>
      <circle cx="82" cy="233" r="28" fill="#394f70"/>
      <text x="82" y="234" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">1</text>
      <text x="148" y="210" font-size="22" font-weight="700">Propósito claro</text>
      <text x="148" y="244" font-size="17">Nombra qué necesitas comprender,</text>
      <text x="148" y="268" font-size="17">enseñar o producir.</text>
    </g>

    <g>
      <rect x="112" y="320" width="484" height="125" rx="18" fill="#fffdf8" stroke="#d8cfbf" stroke-width="2"/>
      <rect x="112" y="320" width="12" height="125" rx="6" fill="#a8202a"/>
      <circle cx="82" cy="383" r="28" fill="#a8202a"/>
      <text x="82" y="384" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">2</text>
      <text x="148" y="360" font-size="22" font-weight="700">Primer intento</text>
      <text x="148" y="394" font-size="17">Escribe algo propio antes de pedir</text>
      <text x="148" y="418" font-size="17">una solución.</text>
    </g>

    <g>
      <rect x="112" y="470" width="484" height="125" rx="18" fill="#fffdf8" stroke="#d8cfbf" stroke-width="2"/>
      <rect x="112" y="470" width="12" height="125" rx="6" fill="#596522"/>
      <circle cx="82" cy="533" r="28" fill="#596522"/>
      <text x="82" y="534" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">3</text>
      <text x="148" y="510" font-size="22" font-weight="700">Ayuda delimitada</text>
      <text x="148" y="544" font-size="17">Pide una objeción o apoyo sobre</text>
      <text x="148" y="568" font-size="17">una parte concreta.</text>
    </g>

    <g>
      <rect x="112" y="620" width="484" height="125" rx="18" fill="#fffdf8" stroke="#d8cfbf" stroke-width="2"/>
      <rect x="112" y="620" width="12" height="125" rx="6" fill="#9a681a"/>
      <circle cx="82" cy="683" r="28" fill="#9a681a"/>
      <text x="82" y="684" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">4</text>
      <text x="148" y="660" font-size="22" font-weight="700">Punto comprobado</text>
      <text x="148" y="694" font-size="17">Vuelve a los datos, fuentes, reglas</text>
      <text x="148" y="718" font-size="17">o ejemplos decisivos.</text>
    </g>

    <g>
      <rect x="112" y="770" width="484" height="125" rx="18" fill="#fffdf8" stroke="#d8cfbf" stroke-width="2"/>
      <rect x="112" y="770" width="12" height="125" rx="6" fill="#394f70"/>
      <circle cx="82" cy="833" r="28" fill="#394f70"/>
      <text x="82" y="834" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">5</text>
      <text x="148" y="810" font-size="22" font-weight="700">Decisión explicada</text>
      <text x="148" y="844" font-size="17">Conserva, transforma, descarta o</text>
      <text x="148" y="868" font-size="17">deja pendiente y anota por qué.</text>
    </g>

    <text x="44" y="938" font-size="16" font-style="italic">La IA aporta; tú conservas el recorrido y la decisión.</text>
  </g>
</svg>
