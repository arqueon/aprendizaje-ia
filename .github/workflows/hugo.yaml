# Adaptador de publicación vigente. El artefacto Hugo no depende de GitHub Pages:
# docs/deployment/servidor-web-udgplus.md define el contrato portable.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Verify generated H5P runtime
        run: npm run h5p:verify
      - name: Install Chromium for H5P QA
        run: npx playwright-core install --with-deps chromium
      - name: Run H5P functional, accessibility and security QA
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/udgia-h5p-qa
          CAPTURE_SCREENSHOTS: "false"
        run: npm run qa:h5p
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deploy smoke test. The same probe is used for any future UDGPlus host.
  verify-deployment:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for deployment probe
        run: npx playwright-core install --with-deps chromium
      - name: Verify deployed site and H5P runtime
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p deployment-evidence
          for attempt in 1 2 3 4 5; do
            report="deployment-evidence/attempt-${attempt}.json"
            if timeout 120s env DEPLOYMENT_REPORT="$report" npm run qa:h5p:deployment; then
              cp "$report" deployment-evidence/final.json
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep "$((attempt * 10))"
            fi
          done
          exit 1
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udgia-h5p-deployment-${{ github.sha }}
          path: deployment-evidence/
          if-no-files-found: error
