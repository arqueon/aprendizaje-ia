services:
  aprendizaje-ia:
    image: udgia.local/aprendizaje-ia:udgia-011
    pull_policy: never
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "127.0.0.1:8185:8080"
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 2 -O /dev/null http://127.0.0.1:8080/healthz || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    labels:
      org.udgia.scope: private-staging
      org.udgia.source: udgia-011
