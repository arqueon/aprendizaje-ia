map $uri $udgia_cache_control {
    default                                                     "public, max-age=3600";
    ~*\.html$                                                   "no-cache";
    ~*\.json$                                                   "no-cache";
    ~*\.webmanifest$                                            "no-cache";
    ~*^/(?:[A-Za-z0-9._~-]+/)*h5p/udgia/v[0-9]+/content/        "no-cache";
    ~*^/(?:[A-Za-z0-9._~-]+/)*h5p/udgia/v[0-9]+/(?:player|libraries|themes|adapters)/.+\.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp)$
                                                                "public, max-age=31536000, immutable";
    ~*^/(?:[A-Za-z0-9._~-]+/)*h5p/udgia/v[0-9]+/(?:host|embed)\.(?:css|js)$
                                                                "public, max-age=31536000, immutable";
    ~*[._-][0-9a-f]{8,}\.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp)$
                                                                "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    max_ranges 1;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control $udgia_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
