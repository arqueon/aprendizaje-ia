<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="cinco-title cinco-desc">
  <title id="cinco-title">Cinco movimientos para probar una ayuda de IA</title>
  <desc id="cinco-desc">Secuencia de cinco movimientos: decir qué necesitas hacer, hacer un primer intento, pedir ayuda sobre una parte, comprobar la respuesta y decidir y explicar.</desc>
  <metadata>Variante derivada del Generated Output de Napkin AI y adaptada a identidad C para el piloto editorial UDGIA-021. Uso sujeto a los términos aplicables de Napkin.</metadata>
  <rect width="1200" height="650" fill="#f7f2e8"/>

  <g font-family="Lora, Georgia, serif" fill="#1d2a42">
    <text x="600" y="68" font-size="42" font-weight="700" text-anchor="middle">Cinco movimientos para probar una ayuda</text>
    <text x="600" y="106" font-size="18" text-anchor="middle">La IA puede ayudar; tú compruebas la respuesta y decides qué conservar.</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="44">
    <path d="M140 335 C220 205 290 205 370 335" stroke="#394f70"/>
    <path d="M370 335 C450 465 520 465 600 335" stroke="#a8202a"/>
    <path d="M600 335 C680 205 750 205 830 335" stroke="#596522"/>
    <path d="M830 335 C910 465 980 465 1060 335" stroke="#9a681a"/>
  </g>

  <g fill="#f7f2e8" stroke="#1d2a42" stroke-width="3">
    <circle cx="140" cy="335" r="39"/>
    <circle cx="370" cy="335" r="39"/>
    <circle cx="600" cy="335" r="39"/>
    <circle cx="830" cy="335" r="39"/>
    <circle cx="1060" cy="335" r="39"/>
  </g>

  <g font-family="Lora, Georgia, serif" fill="#1d2a42" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="140" y="337">1</text>
    <text x="370" y="337">2</text>
    <text x="600" y="337">3</text>
    <text x="830" y="337">4</text>
    <text x="1060" y="337">5</text>
  </g>

  <g stroke="#1d2a42" stroke-width="2.5">
    <line x1="140" y1="375" x2="140" y2="485"/>
    <line x1="370" y1="268" x2="370" y2="295"/>
    <line x1="600" y1="375" x2="600" y2="485"/>
    <line x1="830" y1="268" x2="830" y2="295"/>
    <line x1="1060" y1="375" x2="1060" y2="485"/>
  </g>

  <g font-family="Lora, Georgia, serif" fill="#1d2a42">
    <g text-anchor="middle">
      <text x="140" y="520" font-size="21" font-weight="700">¿Qué necesitas hacer?</text>
      <text x="140" y="551" font-size="16">Di si necesitas</text>
      <text x="140" y="575" font-size="16">comprender, enseñar</text>
      <text x="140" y="599" font-size="16">o producir algo.</text>
    </g>

    <g text-anchor="middle">
      <text x="370" y="154" font-size="23" font-weight="700">Primer intento</text>
      <text x="370" y="185" font-size="16">Escribe algo propio antes</text>
      <text x="370" y="209" font-size="16">de pedir una solución.</text>
    </g>

    <g text-anchor="middle">
      <text x="600" y="520" font-size="23" font-weight="700">Ayuda sobre una parte</text>
      <text x="600" y="551" font-size="16">Pide una objeción o apoyo</text>
      <text x="600" y="575" font-size="16">sobre una parte concreta.</text>
    </g>

    <g text-anchor="middle">
      <text x="830" y="154" font-size="23" font-weight="700">Comprueba la respuesta</text>
      <text x="830" y="185" font-size="16">Vuelve a datos, fuentes,</text>
      <text x="830" y="209" font-size="16">reglas o ejemplos.</text>
    </g>

    <g text-anchor="middle">
      <text x="1060" y="520" font-size="23" font-weight="700">Decisión explicada</text>
      <text x="1060" y="551" font-size="16">Conserva, transforma,</text>
      <text x="1060" y="575" font-size="16">descarta o deja pendiente</text>
      <text x="1060" y="599" font-size="16">y anota por qué.</text>
    </g>
  </g>
</svg>
