<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Un ecosistema para la práctica docente</title>
  <desc id="desc">Dentro de un marco de uso responsable e integración al currículo, la práctica docente
    recorre cinco momentos en ciclo: orientarse en IA en Educación, experimentar en el Laboratorio,
    comprender en el Observatorio, equiparse en Recursos y desarrollarse en Formación Docente.
    El recorrido puede comenzar por cualquier momento y cada recorrido enriquece la práctica.</desc>
  <metadata id="udgia-rights">Atribución: Aprendizaje Digital e IA (UDGPlus), Universidad de Guadalajara. Licencia: CC BY-SA 4.0. Material editorial del proyecto; no constituye dictamen ni política institucional.</metadata>
  <style>
    .fig-canvas { fill:#f5f3ee; }
    /* === TOKENS GRÁFICOS — ver figuras/TOKENS-GRAFICOS.md === */
    .tk-font { font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif; }
    .f-ink { fill:#18223c; } .f-muted { fill:#525d70; }
    .f-primary { fill:#34508c; }
    .bg-primary { fill:#e7ecf7; } .bg-neutral { fill:#ece9e1; }
    .st-primary { stroke:#34508c; } .st-axis { stroke:#18223c; }
    /* Familias de sección (identidad C): tinta, ocre, almagre, oliva */
    .f-tinta { fill:#565f75; } .bg-tinta { fill:#e9ebf1; } .st-tinta { stroke:#656f85; }
    .f-ocre { fill:#7c4a12; } .bg-ocre { fill:#f6e8d4; } .st-ocre { stroke:#b06a1f; }
    .f-almagre { fill:#8b2635; } .bg-almagre { fill:#f8e7ea; } .st-almagre { stroke:#b12028; }
    .f-oliva { fill:#536326; } .bg-oliva { fill:#eceddc; } .st-oliva { stroke:#68762f; }

    /* Apariencia oscura. Un SVG servido como imagen es un documento aislado: no ve la
       clase html.dark del sitio, sólo la preferencia del sistema. Con autoSwitchAppearance
       ambas coinciden salvo que la persona use el selector en contra de su SO; el lienzo
       opaco garantiza legibilidad en cualquier caso. Ver CLAUDE.md convención 6.
       Se cubren los dos juegos de nombres en uso: `.f-ink` (escritorio) y `.ink` (móvil). */
    @media (prefers-color-scheme: dark) {
      .fig-canvas { fill:#131c31; }
      .f-ink, .ink { fill:#eceee9; }
      .f-muted, .muted { fill:#a7b0c4; }
      .f-primary, .primary { fill:#8ba3d6; }
      .bg-primary { fill:#243352; } .bg-neutral { fill:#212d4c; }
      .st-primary { stroke:#8ba3d6; } .st-axis { stroke:#eceee9; }
      .f-tinta { fill:#a3abc0; } .bg-tinta { fill:#232c44; } .st-tinta { stroke:#7e88a3; }
      .f-ocre { fill:#dfb079; } .bg-ocre { fill:#3a2c17; } .st-ocre { stroke:#c98b43; }
      .f-almagre { fill:#d98b8f; } .bg-almagre { fill:#40222a; } .st-almagre { stroke:#cc615f; }
      .f-oliva { fill:#b9c47a; } .bg-oliva { fill:#2b331f; } .st-oliva { stroke:#96a14c; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="f-ink"/>
    </marker>
  </defs>
  <rect class="fig-canvas" x="0" y="0" width="880" height="660"/>
  <g class="tk-font">
    <!-- encabezado -->
    <rect x="50" y="20" width="780" height="60" rx="3" class="bg-primary st-primary" stroke-width="1.6"/>
    <text x="440" y="45" text-anchor="middle" font-size="18" font-weight="bold" class="f-primary">Un ecosistema para la práctica docente</text>
    <text x="440" y="67" text-anchor="middle" font-size="12.5" class="f-ink">Cinco momentos que se alimentan entre sí, dentro de dos compromisos permanentes</text>

    <!-- capa transversal: marco de compromisos -->
    <rect x="36" y="112" width="808" height="518" rx="10" fill="none" class="st-primary" stroke-width="2.2"/>
    <rect x="270" y="98" width="340" height="28" rx="14" class="bg-primary st-primary" stroke-width="1.4"/>
    <text x="440" y="117" text-anchor="middle" font-size="13" font-weight="bold" class="f-primary">Uso responsable · ética y transparencia</text>
    <rect x="315" y="616" width="250" height="28" rx="14" class="bg-primary st-primary" stroke-width="1.4"/>
    <text x="440" y="635" text-anchor="middle" font-size="13" font-weight="bold" class="f-primary">Integración al currículo</text>

    <!-- centro: la práctica -->
    <rect x="310" y="300" width="260" height="104" rx="3" class="bg-primary st-primary" stroke-width="2"/>
    <text x="440" y="336" text-anchor="middle" font-size="17" font-weight="bold" class="f-primary">Tu práctica docente</text>
    <text x="440" y="360" text-anchor="middle" font-size="12.5" class="f-ink">Entra por cualquier momento;</text>
    <text x="440" y="378" text-anchor="middle" font-size="12.5" class="f-ink">cada recorrido la enriquece</text>

    <!-- estación 1: orientarse (añil) -->
    <rect x="335" y="140" width="210" height="92" rx="3" class="bg-primary st-primary" stroke-width="1.6"/>
    <text x="440" y="166" text-anchor="middle" font-size="15" font-weight="bold" class="f-primary">Orientarse</text>
    <text x="440" y="186" text-anchor="middle" font-size="11" letter-spacing="1" class="f-muted">IA EN EDUCACIÓN</text>
    <text x="440" y="208" text-anchor="middle" font-size="12" class="f-ink">Guías y rutas para decidir con criterio</text>

    <!-- estación 2: experimentar (tinta) -->
    <rect x="610" y="270" width="210" height="92" rx="3" class="bg-tinta st-tinta" stroke-width="1.6"/>
    <text x="715" y="296" text-anchor="middle" font-size="15" font-weight="bold" class="f-tinta">Experimentar</text>
    <text x="715" y="316" text-anchor="middle" font-size="11" letter-spacing="1" class="f-muted">LABORATORIO</text>
    <text x="715" y="338" text-anchor="middle" font-size="12" class="f-ink">Prueba prácticas reales en el aula</text>

    <!-- estación 3: comprender (ocre) -->
    <rect x="520" y="478" width="210" height="92" rx="3" class="bg-ocre st-ocre" stroke-width="1.6"/>
    <text x="625" y="504" text-anchor="middle" font-size="15" font-weight="bold" class="f-ocre">Comprender</text>
    <text x="625" y="524" text-anchor="middle" font-size="11" letter-spacing="1" class="f-muted">OBSERVATORIO</text>
    <text x="625" y="546" text-anchor="middle" font-size="12" class="f-ink">Analiza evidencia y tendencias</text>

    <!-- estación 4: equiparse (almagre) -->
    <rect x="150" y="478" width="210" height="92" rx="3" class="bg-almagre st-almagre" stroke-width="1.6"/>
    <text x="255" y="504" text-anchor="middle" font-size="15" font-weight="bold" class="f-almagre">Equiparse</text>
    <text x="255" y="524" text-anchor="middle" font-size="11" letter-spacing="1" class="f-muted">RECURSOS</text>
    <text x="255" y="546" text-anchor="middle" font-size="12" class="f-ink">Materiales y herramientas listos</text>

    <!-- estación 5: desarrollarse (oliva) -->
    <rect x="60" y="270" width="210" height="92" rx="3" class="bg-oliva st-oliva" stroke-width="1.6"/>
    <text x="165" y="296" text-anchor="middle" font-size="15" font-weight="bold" class="f-oliva">Desarrollarse</text>
    <text x="165" y="316" text-anchor="middle" font-size="11" letter-spacing="1" class="f-muted">FORMACIÓN DOCENTE</text>
    <text x="165" y="338" text-anchor="middle" font-size="12" class="f-ink">Capacidad para sostener el cambio</text>

    <!-- ciclo -->
    <line x1="550" y1="204" x2="666" y2="264" class="st-axis" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="700" y1="368" x2="652" y2="472" class="st-axis" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="514" y1="524" x2="368" y2="524" class="st-axis" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="184" y1="472" x2="146" y2="370" class="st-axis" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="214" y1="264" x2="330" y2="204" class="st-axis" stroke-width="1.8" marker-end="url(#arrow)"/>
  </g>
</svg>
